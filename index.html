o", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Cómo se arma tu hora", "pres": "Las partes rotan según el día y la fase", "nota": "Las clases te quedaron básicas, así que los miércoles y jueves de crossfit los sigo escribiendo yo, ahora y después del 11/10. Anotá lo que te falte y lo ajusto.\n\nLAS PARTES ROTAN, NO SON FIJAS. Escribí antes que la hora tenía cinco partes siempre iguales y eso es de manual de clase básica, justo lo que criticás del box. En una plani real los días varían: gym+oly+fuerza+cond+acc uno, oly+fuerza+cond otro, gym+oly+cond otro, según la fase del ciclo. Las piezas disponibles son seis:\nWARM UP · GYMNASTICS · WEIGHTLIFTING · FUERZA · CONDITIONING · ACCESORIO\n\nCON UN SOLO DÍA DE CROSSFIT POR SEMANA el problema es más duro que rotar: no podés rotar nada, tenés que elegir qué dos o tres de esas seis entran, y esa elección se argumenta cada semana. No se hereda de la semana pasada.\n\nLO QUE ELEGÍ HOY: oly + conditioning + accesorio. Sin bloque de gimnasia y sin skill aparte.\n\nPOR QUÉ NO VA GIMNASIA, LA VERSIÓN CORRECTA: primero la agregué porque la preguntaste y después la saqué culpando al hombro. Las dos veces me equivoqué de razón. La razón real es que hacés crossfit desde 2015 y con años de competitivo: el kipping de T2B y la vertical de manos no son algo que tengas que aprender, ni algo que se te caiga en cuatro semanas de una sesión semanal. Escribirte 5 minutos de kipping es hacerte practicar algo que ya tenés.\n\nLO QUE SÍ SE CAE RÁPIDO con un solo día por semana es el ciclado de barra y la tolerancia al metcon. Ahí van los 60 minutos. El kipping de T2B queda en el warm up, que es su lugar real.\n\nCUANDO EL CROSSFIT PASE A DOS O TRES DÍAS, la gimnasia tiene un bloque propio con volumen que sirva — no 10 minutos de relleno.\n\nFUERZA NO VA ACÁ ESTA SEMANA, y confirmás bien: la fuerza pura está el lunes (pierna pesada), el viernes (press pesado) y repartida el martes y sábado. Meterla también el jueves sería el cuarto día de empuje en cinco. El weightlifting de acá es técnica con carga media, que es otra cosa.\n\nLOS TIEMPOS DE HOY: 60 minutos con todo. Si te vas a pasar, lo que se cae es el accesorio.", "items": [{"id": "e-x-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Reemplazos", "pres": "Si el aparato está ocupado · tenelo a mano", "nota": "Buena idea. Esta lista sirve para cualquier sesión de crossfit, no solo hoy — el gimnasio está lleno y no se pierde la sesión por esperar una máquina.\n\n500 m DE REMO →\n· 12 shuttle run de 10 m (ida y vuelta = 1)\n· 400 m en bici\n· 400 m de cinta al 1%\n· 40 cal de ski\n· 30 kettlebell swing\n\n300 m DE REMO (calentamiento) →\n· 8 shuttle run · 250 m bici · 300 m cinta\n\nBARRA OLÍMPICA OCUPADA →\n· El complex con mancuernas, mismo esquema, mitad del peso total\n· DB clean + front squat + push press, 1+1+1\n\nBARRA DE DOMINADAS OCUPADA →\n· Toes to bar → 20 V-up o 15 hanging knee raise en anillas\n· Dominadas → remo invertido en barra baja, o polea al pecho\n\nSIN GHD NI BANCO ROMANO →\n· RDL con mancuernas 12 reps\n· Superman 20 reps\n· Hip thrust 15 reps\n\nSIN ESPACIO PARA FARMER CARRY →\n· Suitcase hold 45\" por lado (una sola mancuerna, la más pesada)\n\nCUANDO USES UN REEMPLAZO, anotalo en las notas del ejercicio. Cambia cómo leo el tiempo del WOD.", "items": [{"id": "e-x-x2", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "1 · Warm up", "dur": "08:00", "pres": "2 rounds", "items": [{"id": "e-x-w1", "t": "300 m de remo", "d": "suave, subiendo · o 8 shuttle run", "tipo": "chk"}, {"id": "e-x-w2", "t": "10 air squats con pausa abajo", "d": "10 reps", "tipo": "chk"}, {"id": "e-x-w3", "t": "10 pass through con barra vacía", "d": "10 reps", "tipo": "chk"}, {"id": "e-x-w4", "t": "5 inchworm", "d": "5 reps", "tipo": "chk"}, {"id": "e-x-w5", "t": "Front rack stretch", "d": "30 segundos", "tipo": "chk"}, {"id": "e-x-w6", "t": "5 kipping de toes to bar", "d": "2da vuelta · preparación del WOD", "tipo": "chk"}]}, {"nombre": "2 · Weightlifting · Complex de clean", "dur": "16:00", "pres": "Cada 2' × 6 sets · 60-75% del Clean", "nota": "1 power clean + 1 front squat + 1 push jerk. Los tres sin bajar la barra.\n\nPOR QUÉ ESTE COMPLEX: el power clean te da la tirada, el front squat la posición de recepción, y el push jerk el envío arriba — los tres aparecen en cualquier WOD.\n\nSubida suave: los dos primeros sets son de entrada, los últimos tres son el trabajo. No es día de máximo. Si el front squat te obliga a bajar el codo, ese es el tope y te quedás ahí.\n\nEl push jerk se recibe en tijera corta o con los pies parejos, apoyando. No hay salto vertical acá.\n\nSI LA BARRA ESTÁ OCUPADA: el mismo complex con mancuernas, la mitad del peso total, 1+1+1.", "items": [{"id": "e-x-a1", "t": "Set 1", "d": "60% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.6, "reps": 3}, {"id": "e-x-a2", "t": "Set 2", "d": "65% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.65, "reps": 3}, {"id": "e-x-a3", "t": "Set 3", "d": "70% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.7, "reps": 3}, {"id": "e-x-a4", "t": "Set 4", "d": "73% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.73, "reps": 3}, {"id": "e-x-a5", "t": "Set 5", "d": "75% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.75, "reps": 3}, {"id": "e-x-a6", "t": "Set 6", "d": "75% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.75, "reps": 3}]}, {"nombre": "3 · Conditioning", "dur": "14:00", "pres": "3 rounds for time · cap 15'", "nota": "3 rondas, lo más rápido que puedas:\n· 500 m de remo\n· 15 DB push press\n· 15 toes to bar\n\nTENÉS RAZÓN CON EL CAP. 20 minutos era demasiado colchón para este WOD: el objetivo real son 11-13 minutos y el cap baja a 15. Un cap que no aprieta no ordena nada.\n\nEL PESO: arrancá la primera ronda con 15 kg por mano como dijiste, y si sale liviano subí a 20 kg para las rondas 2 y 3. Anotá con qué hiciste cada ronda. Con 25 kg de DB bench cómodo a 10 reps, 20 kg de push press a 15 reps te va a dar el trabajo que buscás — el push press mueve menos peso que el bench pero son 15 reps con el hombro ya cansado del complex.\n\nCÓMO CORRERLO: el remo es el motor, no la carrera. Andá a un ritmo que te deje llegar a la barra respirando — si llegás fundido, los 15 push press se parten en tres tandas y perdés más de lo que ganaste remando.\n\nT2B: si a mitad de la segunda ronda se rompen, pasá a knees to elbow y terminá. Usá el kipping que hiciste en el warm up, no reps de a una.\n\nSE RE-TESTEA EL 14 DE OCTUBRE, después de la carrera. Los benchmarks se repiten cada 6-8 semanas, no cada semana.\n\nREEMPLAZOS: sin remo, 12 shuttle run de 10 m o 400 m de bici. Sin barra de dominadas, 20 V-up.", "items": [{"id": "e-x-c1", "t": "Tiempo total", "d": "mm:ss · objetivo 11-13' · cap 15'", "tipo": "tim", "seg": 780}, {"id": "e-x-c4", "t": "Peso del push press", "d": "kg por mancuerna", "tipo": "car", "peso": 20, "reps": 15}, {"id": "e-x-c2", "t": "Rondas completadas", "d": "de 3", "tipo": "rep", "reps": 3}, {"id": "e-x-c3", "t": "Cuánto costó", "d": "0 = fácil · 10 = al límite", "tipo": "rep", "reps": 8}]}, {"nombre": "4 · Accesorio", "dur": "10:00", "pres": "3 sets · rest 90\"", "nota": "Cadena posterior e isquio, liviano. Esto es lo que sostiene el volumen de carrera sin que aparezca una molestia nueva — y mañana se corre. Liviano de verdad: no es un bloque de fuerza.\n\nEL CORE CAMBIA: dead bug en vez de hollow hold, por el calambre de ayer. Mismo trabajo de pared abdominal, sin la contracción larga que te lo disparó. El hollow vuelve más adelante en series de 20\".\n\nSI NO HAY GHD NI BANCO ROMANO: RDL con mancuernas 12 reps, o superman 20 reps.\n\nEL FARMER CARRY va con lo más pesado que agarres — con mancuernas hexagonales de 40 kg, esas. Si no hay 40 m de espacio libre, suitcase hold 45\" por lado.", "items": [{"id": "e-x-e0", "t": "¿Hay GHD o banco romano?", "d": "fijate y marcá si hay", "tipo": "chk"}, {"id": "e-x-e1", "t": "Extensión de espalda, GHD o RDL", "d": "15 reps × 3 sets", "tipo": "chk"}, {"id": "e-x-e2", "t": "Copenhagen plank", "d": "10/10 × 3 sets", "tipo": "chk"}, {"id": "e-x-e3", "t": "Dead bug", "d": "10/10 × 3 sets · reemplaza al hollow", "tipo": "chk"}, {"id": "e-x-e4", "t": "Farmer carry · 40 m × 4", "d": "kg por mano", "tipo": "car", "peso": 40, "reps": 4}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "Estiramiento de gemelo y sóleo, 60\" por lado. Mañana hay trote.", "items": [{"id": "e-x-z1", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}, {"id": "e-x-z2", "t": "Piernas al terminar", "d": "0 = frescas · 10 = fundidas", "tipo": "rep", "reps": 5}, {"id": "e-x-z3", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 0}]}]}, {"dia": "Vie", "num": "11", "titulo": "Torso pesado + 4 km", "sub": "Doble · gimnasio 17 h, 4 km a las 20", "mes": "septiembre", "obj": "Encontrar tus kilos de press y anotarlos todos. A la noche, 4 km continuos y suaves.", "secciones": [{"nombre": "Cambió el fin de semana", "pres": "Leer primero · reescrito el 11/9", "nota": "NO HAY FÚTBOL MAÑANA. Avisaste que no podés ir, y eso cambia dos días.\n\nHOY: se cae la bici de 30' en Z2. Ya tenés una hora de torso a las 17 y 4 km a las 20; la bici solo sumaba fatiga sin aportarle nada al 10K. Se justificaba cuando el viernes era tu única sesión aeróbica de la semana — ahora no lo es.\n\nLA CORRIDA BAJA A 4 KM, no 8. Decisión tuya y está bien: primera semana del bloque, gemelo recién limpio y mañana hay metcon. La larga de verdad arranca el jueves 17.\n\nEL PRESS SE QUEDA PESADO. Sin partido al mediodía de mañana no hay razón para hacerle taper al viernes, así que los porcentajes van completos. Es el dato que más me falta. Vale esto y no la lista corta que te pasé por chat antes de saber lo del fútbol.\n\nMAÑANA: crossfit en el gimnasio en lugar del partido. Chipper de 25-28', cero impacto.", "items": [{"id": "e-v-x0", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "El día pesado de tren superior", "pres": "Leer una vez", "nota": "De los cuatro días de torso de la semana, este es el pesado. El martes fue tracción, el miércoles empuje moderado — acá van los kilos.\n\nCon tu bench estimado en 110, los porcentajes de abajo dan números reales. La regla de siempre: el kilo es sugerencia, el RPE manda. Si sale liviano, subís y lo anotás.\n\nLAS ZANCADAS NO VAN HOY. Estaban escritas acá, pero esta semana la pierna ya tuvo su dosis el lunes y a la noche corrés. Vuelven la semana que viene, en este mismo día, con el bloque excéntrico completo.\n\nCERO PIERNA HOY. Ni gemelo.", "items": [{"id": "e-v-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "SESIÓN 1 · Fuerza tren superior", "dur": "45:00", "pres": "Superseries · a la tarde", "nota": "Empuje y tracción alternados, en superserie: te ahorra la mitad del tiempo y el hombro descansa mientras trabaja la espalda.\n\nLos tres primeros ítems son press banca con porcentajes de tu bench de 110. Si no hay banco plano libre, floor press con mancuernas y anotá el peso por mano.\n\nLA POLEA VA EN SERIES FIJAS, no en pirámide: 4 × 8 a 55 kg, las cuatro al mismo peso. El martes hiciste 47-53-59-65 bajando reps — lo improvisaste vos porque te sobraba tiempo y estaba bien, pero para prescribir no sirve: si se mueven el peso y las reps a la vez, nunca sé si mejoraste. Un solo número que comparás cada semana. Si la cuarta serie sale fácil, la que viene 60.\n\nEL REMO CON BARRA IGUAL: 4 × 8 a 75 kg, las cuatro iguales. 75 te salió cómodo el martes, así que es el punto de partida y no el techo del día.\n\nLOS KILOS DEL FINAL, SACADOS DE TUS DATOS (tenías razón, eran genéricos):\n\nPRESS INCLINADO · 20 kg por mancuerna × 10. El miércoles hiciste DB bench 25 kg × 10 cómodo; el inclinado rinde 15-20% menos, así que 20 kg te da las mismas 10 reps con el mismo margen. Si a la tercera serie sobra, 22,5.\n\nELEVACIONES LATERALES · 10 kg × 12. Con 7,5 kg × 15 anotaste justo. A menos reps entra un kilo más. Si el codo se dobla o hay envión de cadera, volvé a 7,5.\n\nCURL · 15 kg × 8. Vos mismo lo escribiste el martes: 12,5 kg está bien trabajado y para subir hay que bajar reps. Ahí está — 15 kg y 8 reps.\n\nTRÍCEPS EN POLEA · 30 kg × 12. Referencia de tus poleas: face pull 35 kg justo, polea al pecho 65 kg. Si no hay polea libre, press francés con barra 20 kg × 12 o fondos 3 × 10.\n\nESTO ES LO QUE MÁS GANÁS CON EL GIMNASIO. En casa tenés techo de 27,5 kg por mano en press y ya lo tocás. Con barra y mancuernas de gimnasio, el tren superior tiene años de progresión por delante.", "items": [{"id": "e-v-f1", "t": "Press banca · set 1", "d": "4 × 6 · 68% del bench", "tipo": "car", "lift": "bench", "pct": 0.68, "reps": 6}, {"id": "e-v-f1b", "t": "Press banca · set 2", "d": "72% del bench", "tipo": "car", "lift": "bench", "pct": 0.72, "reps": 6}, {"id": "e-v-f1c", "t": "Press banca · sets 3-4", "d": "76% del bench", "tipo": "car", "lift": "bench", "pct": 0.76, "reps": 6}, {"id": "e-v-f2", "t": "Remo con barra · 4 × 8", "d": "kg · las 4 series al mismo peso", "tipo": "car", "peso": 75, "reps": 8}, {"id": "e-v-f6", "t": "Polea al pecho · 4 × 8", "d": "kg · las 4 series al mismo peso", "tipo": "car", "peso": 55, "reps": 8}, {"id": "e-v-f3", "t": "Press inclinado con mancuernas · 3 × 10", "d": "kg por mancuerna", "tipo": "car", "peso": 20, "reps": 10}, {"id": "e-v-f4", "t": "Dominadas 3 × máximas", "d": "anotá las tres en notas", "tipo": "chk"}, {"id": "e-v-f5a", "t": "Elevaciones laterales · 3 × 12", "d": "kg por mancuerna", "tipo": "car", "peso": 10, "reps": 12}, {"id": "e-v-f5b", "t": "Curl con mancuernas · 3 × 8", "d": "kg por mancuerna", "tipo": "car", "peso": 15, "reps": 8}, {"id": "e-v-f5c", "t": "Tríceps en polea · 3 × 12", "d": "kg de la polea", "tipo": "car", "peso": 30, "reps": 12}, {"id": "e-v-f7", "t": "Cuánto duró todo", "d": "minutos · para calibrar", "tipo": "rep", "reps": 60}]}, {"nombre": "SESIÓN 2 · 4 km continuos", "pres": "20 h · suaves, sin bici", "nota": "4 KM CONTINUOS A 5:40-5:50/km. Nada de bici antes. Salís, corrés los cuatro y volvés.\n\nRITMO: es rodaje, no calidad. El miércoles hiciste 4 × 1000 a 5:21 / 5:24 / 5:25 / 5:07 — esto tiene que ir medio minuto por kilómetro más lento que eso. Si el primer kilómetro sale en 5:20 estás corriendo mal el día.\n\nPOR QUÉ CORTOS: pedís precaución y corresponde. Segunda corrida de la semana, tres horas después de una hora de press, gemelo recién limpio y mañana hay metcon. Cuatro kilómetros suaves acá valen más que ocho forzados.\n\nSI EL GEMELO DICE ALGO, CORTÁS. No hay nada que ganar hoy. Estamos a 30 días de la carrera y la larga de verdad es el jueves 17.", "items": [{"id": "e-j-r1", "t": "Distancia", "d": "km · objetivo 4", "tipo": "dist", "km": 4}, {"id": "e-j-r2", "t": "Tiempo total", "d": "mm:ss", "tipo": "tim", "seg": 1400}, {"id": "e-j-r3", "t": "Esfuerzo", "d": "0 = charlando · 10 = duro", "tipo": "rep", "reps": 4}, {"id": "e-j-r4", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 0}]}, {"nombre": "Cierre", "pres": "Post sesión · mañana hay metcon", "items": [{"id": "e-j-z1", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}]}]}, {"dia": "Sáb", "num": "12", "titulo": "Crossfit · chipper", "sub": "En lugar del partido · gimnasio", "mes": "septiembre", "obj": "Un chipper largo y continuo, cero impacto, en el lugar que dejó el fútbol.", "secciones": [{"nombre": "Por qué crossfit hoy", "pres": "Leer una vez", "nota": "NO HAY PARTIDO, así que el sábado queda libre y lo mejor que puede entrar ahí es crossfit. Con esto la semana cierra con dos días de crossfit (jueves y hoy) en lugar de uno, que es exactamente hacia dónde va el plan después del 11/10.\n\nQUÉ NO ES: no es un día de fuerza. Ayer fue el día pesado de press y anoche corriste. Hoy es metabólico, continuo, con pesos que te dejan moverte sin parar.\n\nCERO IMPACTO. Nada de box jumps ni burpees con salto: el gemelo derecho todavía está en observación desde el 28/8 y las bajadas excéntricas repetidas son justo lo que lo despertó.\n\nRITMO CONTINUO, NO SPRINT. Venís de correr anoche. El objetivo es terminar los siete bloques sin quedarte parado más de 10 segundos entre uno y otro, no romper un récord.", "items": [{"id": "e-s-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "08:00", "pres": "Antes del chipper", "nota": "2' de bici suave, después: 10 pasadas de cadera con la barra vacía, 10 press de hombro con barra vacía, 10 goblet squat con 10 kg, 10 remos con mancuerna liviana. Una vuelta sola, sin apuro.\n\nMOVILIDAD DE TOBILLO Y GEMELO antes de empezar, 60\" por lado. Es lo único que no se salta.", "items": [{"id": "e-s-w1", "t": "Warm up completo", "d": "marcar", "tipo": "chk"}, {"id": "e-s-w2", "t": "Movilidad de tobillo y gemelo", "d": "60\" por lado", "tipo": "chk"}]}, {"nombre": "EL CHIPPER · 7 bloques en orden", "dur": "28:00", "pres": "Cap 28' · una sola vuelta", "nota": "Se hace en orden, de arriba a abajo, una sola vez. No hay rondas.\n\n500 m SKI\n50 GOBLET SQUAT · 22,5 kg\n40 DB SNATCH ALTERNADO · 22,5 kg (20 por brazo)\n1000 m REMO\n30 PUSH PRESS · barra 40 kg\n20 BURPEES SIN SALTO\n2000 m BICI\n\nPOR QUÉ ESE ORDEN: el ski es el bloque más caro en pulso y conviene gastarlo fresco; además te calienta el hombro para el push press. La bici va al final porque es lo más amable con el gemelo y te deja bajar el pulso mientras todavía trabajás.\n\nSI EL DISPLAY DEL REMO NO ANDA (o cualquiera de los tres), vas por tiempo:\nSki 500 m → 2' a ritmo firme, no sprint.\nRemo 1000 m → 4'30\" a 24-26 paladas por minuto.\nBici 2000 m → 4' con cadencia alta y resistencia media.\nSon 10'30\" de máquina en total. Si tenés que recortar algo, recortás la bici del final — nunca el remo.\n\nBURPEES SIN SALTO: bajás al piso, subís, y al pararte hacés un step up en lugar de saltar. No hay salto en ningún momento y no hay palmada arriba.\n\nLOS PESOS SON PARA MOVERSE. Goblet 22,5 y DB snatch 22,5 con la misma mancuerna, así no perdés tiempo cambiando. Push press con 40 kg, que el miércoles te salió duro a 10 reps pero acá van en sets de 5-6 con pausa. Si a los 15 se parte, bajás a 35 y seguís.", "items": [{"id": "e-s-c1", "t": "Tiempo total del chipper", "d": "mm:ss · cap 28'", "tipo": "tim", "seg": 1680}, {"id": "e-s-c2", "t": "Goblet squat · peso usado", "d": "kg", "tipo": "car", "peso": 22.5, "reps": 50}, {"id": "e-s-c3", "t": "DB snatch · peso usado", "d": "kg", "tipo": "car", "peso": 22.5, "reps": 40}, {"id": "e-s-c4", "t": "Push press · peso usado", "d": "kg de la barra", "tipo": "car", "peso": 40, "reps": 30}, {"id": "e-s-c5", "t": "Display del remo · anduvo", "d": "marcar si anduvo", "tipo": "chk"}, {"id": "e-s-c6", "t": "Dónde se te partió", "d": "0 = nunca · 10 = todo el tiempo", "tipo": "rep", "reps": 5}, {"id": "e-s-c7", "t": "RPE del chipper", "d": "0-10 · objetivo 8", "tipo": "rep", "reps": 8}]}, {"nombre": "Cierre", "pres": "Post sesión · mañana descanso", "nota": "Estiramiento de gemelo y sóleo, 60\" por lado, y nada más. Mañana es descanso completo y el lunes arranca la semana tipo con pierna bilateral pesada.", "items": [{"id": "e-s-z1", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}, {"id": "e-s-p2", "t": "Cómo quedaste", "d": "0 = entero · 10 = fundido", "tipo": "rep", "reps": 5}, {"id": "e-s-p3", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 0}]}]}, {"dia": "Dom", "num": "13", "titulo": "Descanso", "sub": "Cierre de semana 1", "mes": "septiembre", "obj": "No entrenar. Y pasarme lo que falta de jueves, viernes y sábado.", "secciones": [{"nombre": "Descanso", "pres": "Nada", "nota": "Sin caminata obligatoria, sin nada. Seis días de entrenamiento necesitan un día entero libre.\n\nY sin fútbol el sábado, la semana cerró con más trabajo de gimnasio del previsto: descansá de verdad, que el lunes arranca la semana tipo con pierna bilateral pesada.", "items": [{"id": "e-d-z1", "t": "Cómo te levantaste", "d": "0 = entero · 10 = roto", "tipo": "rep", "reps": 3}]}, {"nombre": "Lo que necesito de la semana", "pres": "Para escribir la semana 2", "nota": "LO QUE YA TENGO: el gimnasio medido el 7/9, la fuerza de pierna del lunes, la tracción del martes, el empuje del miércoles y los cuatro tiempos del 4 × 1000. Con eso ya reescribí el mapa de las cinco semanas y los kilos del viernes y del sábado.\n\nLO QUE FALTA, CUATRO COSAS:\n\n1. El WOD del jueves: tiempo total y con qué peso hiciste el push press en cada ronda. Define si el conditioning de la semana 2 sube de carga o de rondas.\n2. Los kilos reales del press del viernes. Los escribí desde tu bench estimado de 110, que nunca testeamos — si el 76% salió liviano o imposible, corrijo el estimado.\n3. Cuánto duraron el jueves, el viernes y el sábado. Con tres números dejo de adivinar cuánto contenido entra en tu hora.\n4. El tiempo total del chipper del sábado y con qué pesos lo hiciste. Es el primer metcon largo escrito por mí en el gimnasio nuevo — con eso calibro los dos días de crossfit del ciclo post-10K.\n\nY si los seis días fueron demasiado, decilo: la semana 2 sale con cinco.\n\nEstamos a 28 días de la carrera.", "items": [{"id": "e-d-z2", "t": "Semana completada", "d": "días de 6", "tipo": "rep", "reps": 6}, {"id": "e-d-z3", "t": "Datos del jueves al sábado pasados", "d": "marcar", "tipo": "chk"}]}]}], "label": "7–13 sep", "nombre": "híbrido · semana 1 de 5 al 10K", "obj": "Arrancar el híbrido y calibrar. La corrida de ritmo se movió al miércoles y la pierna pasa a repartirse en tres días."}, {"s": 6, "dias": [{"dia": "Lun", "num": "14", "titulo": "Fuerza general · pierna moderada", "sub": "~1h15 · sin correr", "mes": "septiembre", "obj": "Único día dedicado de pierna. Moderado, dejando reserva para el martes de ritmo.", "secciones": [{"nombre": "Cómo se lee la semana", "pres": "Leer una vez", "nota": "SEGUNDA SEMANA DEL HÍBRIDO. Baja la intensidad por sesión: nada al fallo salvo el press de banca del viernes.\n\nLA PIERNA SE MANTIENE   if(r.seg!=null&&r.seg!=="")p.push(mmss(r.seg));
  if(r.rondas!=null&&r.rondas!=="")p.push(r.rondas+" rondas");
  if(r.km!=null&&r.km!=="")p.push(r.km+" km");
  if(r.sens)p.push(r.sens);
  return p.join(" · ");
}
function mmss(s){s=+s;if(!s)return"0s";const m=Math.floor(s/60),x=s%60;return m?(m+":"+String(x).padStart(2,"0")):(x+"s")}
function kg(lift,pct){const rm=(S.rms||{})[lift]||0;return Math.round(rm*pct*2)/2}
function pesoTgt(it){return it.lift?kg(it.lift,it.pct):(it.peso!=null?it.peso:"")}
function tgt(it){ // prescribed target line (muted), computed from current RMs
  if(it.tipo==="car"){const p=pesoTgt(it);const a=[];if(p!==""&&p!=null)a.push("→ "+p+" kg");if(it.reps)a.push(it.reps+" reps");return a.join(" · ")}
  if(it.tipo==="dist")return it.km?("→ "+it.km+" km"):"";
  return "";
}

function renderMain(){
  const w=PLAN[W];let h="";
  h+='<div class="wkhead"><div class="t">'+w.label+'</div><div class="n">'+(w.nombre||"")+'</div></div>';
  if(w.obj)h+='<div class="obj">'+w.obj+'</div>';
  h+='<div class="days">';
  w.dias.forEach((d,i)=>{ h+='<div class="day'+(i===D?' sel':'')+'" onclick="pickD('+i+')"><b>'+d.dia+' '+d.num+'</b><small>'+shortTitle(d.titulo)+'</small></div>'; });
  h+='</div><div id="dayv"></div>';
  document.getElementById("main").innerHTML=h;
  renderDay();
}
function shortTitle(t){return (t||"").split(/[·(]/)[0].trim().slice(0,16)}
function pickD(i){D=i;renderMain()}

function renderDay(){
  const w=PLAN[W],d=w.dias[D];let h="";
  if(d.sub)h+='<div class="dsub">'+esc(d.sub)+'</div>';
  d.secciones.forEach((s,si)=>{
    h+='<div class="sec"><h3>'+esc(s.nombre)+(s.dur?'<span>'+esc(s.dur)+'</span>':'')+'</h3>';
    if(s.pres)h+='<div class="spres">'+esc(s.pres)+'</div>';
    if(s.nota)h+='<div class="snote">'+esc(s.nota)+'</div>';
    s.items.forEach(it=>{
      const done=!!S.done2[it.id],sum=fmtSum(it),pre=tgt(it);
      const metric=it.tipo!=="chk"&&it.tipo!=="ron";
      h+='<div class="it'+(done?' done':'')+'" data-id="'+it.id+'">';
      h+='<div class="itr" onclick="tog(event,\''+it.id+'\')"><div class="cb" onclick="chk(event,\''+it.id+'\')">'+(done?'✓':'')+'</div>';
      h+='<div class="itx"><div class="t">'+esc(it.t)+'</div>'+(it.d&&it.d!=="hecho"?'<div class="d">'+esc(it.d)+'</div>':'')+(pre?'<div class="pre">'+esc(pre)+'</div>':'')+(sum?'<div class="sum">'+esc(sum)+'</div>':'')+'</div></div>';
      if(metric){
        h+='<div class="ed">';
        if(it.tipo==="car")h+=fld(it.id,"peso","Peso (kg)","f","number",pesoTgt(it))+fld(it.id,"reps","Reps","f","number",it.reps);
        else if(it.tipo==="rep")h+=fld(it.id,"reps","Reps","f","number",it.reps)+fld(it.id,"peso","Peso (kg)","f","number","");
        else if(it.tipo==="tim")h+=fld(it.id,"seg","Tiempo (seg)","f","number",it.seg);
        else if(it.tipo==="dist")h+=fld(it.id,"km","Km","f","number",it.km);
        else h+=fld(it.id,"peso","Peso (kg)","f","number","")+fld(it.id,"reps","Reps","f","number","");
        h+=fld(it.id,"rondas","Rondas","f","number","")+self_sens(it.id)+
           '<label class="nt">Nota<textarea oninput="setf(\''+it.id+'\',\'nota\',this.value)">'+esc((S.reg[it.id]||{}).nota||"")+'</textarea></label></div>';
      } else {
        h+='<div class="ed"><label class="nt">Nota<textarea oninput="setf(\''+it.id+'\',\'nota\',this.value)">'+esc((S.reg[it.id]||{}).nota||"")+'</textarea></label></div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  // nota del día
  const dk="diaNota-"+W+"-"+D;
  h+='<div class="dn"><label>Notas del día</label><textarea oninput="setDN(\''+dk+'\',this.value)">'+esc((S.reg[dk]||{}).nota||"")+'</textarea></div>';
  document.getElementById("dayv").innerHTML=h;
}
function fld(id,k,lab,cls,ty,ph){const v=(S.reg[id]||{})[k];const p=(ph==null||ph==="")?"":(' placeholder="'+esc(ph)+'"');return '<label>'+lab+'<input class="'+cls+'" type="'+ty+'" inputmode="decimal"'+p+' value="'+(v==null?"":v)+'" oninput="setf(\''+id+'\',\''+k+'\',this.value)"></label>'}
function self_sens(id){const v=(S.reg[id]||{}).sens||"";let o="";SENS.forEach(x=>o+='<option'+(x===v?' selected':'')+'>'+x+'</option>');return '<label>Sensación<select class="s" onchange="setf(\''+id+'\',\'sens\',this.value)">'+o+'</select></label>'}
function esc(s){return(s==null?"":""+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function chk(e,id){e.stopPropagation();S.done2[id]=!S.done2[id];if(!S.done2[id])delete S.done2[id];save();renderDay();renderNav()}
function tog(e,id){const it=e.currentTarget.closest(".it");it.classList.toggle("ex")}
function setf(id,k,v){if(!S.reg[id])S.reg[id]={};if(v===""){delete S.reg[id][k]}else{S.reg[id][k]=(k==="sens"||k==="nota")?v:(v.match(/,/)?parseFloat(v.replace(",","."))||v:(isNaN(+v)?v:+v))}if(Object.keys(S.reg[id]).length===0)delete S.reg[id];save();const el=document.querySelector('.it[data-id="'+id+'"] .sum');const sum=fmtSum({id});/*update summary live*/ const box=document.querySelector('.it[data-id="'+id+'"] .itx');if(box){let s=box.querySelector(".sum");if(sum){if(!s){s=document.createElement("div");s.className="sum";box.appendChild(s)}s.textContent=sum}else if(s)s.remove()}renderNav()}
function setDN(k,v){if(!S.reg[k])S.reg[k]={};if(v===""){delete S.reg[k]}else S.reg[k]={nota:v};save()}

function expObj(){return{app:KEY,fecha:new Date().toISOString(),done2:S.done2,reg:S.reg,rms:S.rms,rmsOrigen:S.rmsOrigen||"",edad:S.edad||32,paso:S.paso||0,semana:S.semana||W}}
function copiar(){const t=JSON.stringify(expObj(),null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copiado")).catch(()=>{prompt("Copiá:",t)})}
function bajar(){const b=new Blob([JSON.stringify(expObj(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="respaldo-entrenos-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Respaldo bajado")}
function restaurar(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);S.done2=Object.assign(S.done2||{},o.done2||{});S.reg=Object.assign(S.reg||{},o.reg||{});if(o.rms)S.rms=Object.assign(S.rms||{},o.rms);if(o.rmsOrigen!=null)S.rmsOrigen=o.rmsOrigen;if(o.edad)S.edad=o.edad;save();renderNav();renderMain();toast("Respaldo restaurado ✓")}catch(e){toast("Archivo inválido")}inp.value=""};rd.readAsText(f)}

// editar RM
document.getElementById("rm").addEventListener("click",()=>{
  const map=[["snatch","Snatch"],["clean","Clean"],["backsquat","Back Squat"],["frontsquat","Front Squat"],["deadlift","Deadlift"],["bench","Bench"]];
  for(const[k,n]of map){const v=prompt("1RM "+n,(S.rms||{})[k]||"");if(v===null)return;if(v!=="")S.rms[k]=parseFloat(v.replace(",","."))||v}
  save();renderNav()
});

renderNav();renderMain();save();
if("serviceWorker"in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
