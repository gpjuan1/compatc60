<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#201e1d;--mut:#6c6a66;--line:#e7e4dd;--red:#d6002a;--ok:#1a7f45;--chip:#efece6}
@media(prefers-color-scheme:dark){:root{--bg:#161514;--card:#201e1d;--ink:#f1efe9;--mut:#9a968e;--line:#322f2c;--chip:#2a2825}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.hd b{font-size:16px}
.rm{font-size:11px;color:var(--mut);padding:0 14px 8px;cursor:pointer}
.ver{font-size:9.5px;color:var(--mut);opacity:.6;padding:0 14px 6px}
.ciclos{padding:8px 10px 2px}
.cic{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.cic>.ch{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;font-weight:600}
.cic>.ch .ar{color:var(--mut);transition:transform .15s}
.cic.op>.ch .ar{transform:rotate(90deg)}
.weeks{display:none;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.cic.op .weeks{display:flex}
.wk{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.wk.sel{background:var(--red);color:#fff;border-color:var(--red)}
.wkhead{padding:12px 14px 4px}
.wkhead .t{font-weight:700;font-size:17px}
.wkhead .n{color:var(--mut);font-size:12.5px;margin-top:2px}
.obj{margin:8px 14px;padding:9px 11px;background:var(--chip);border-radius:10px;font-size:12.5px;color:var(--mut)}
.days{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px}
.day{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;text-align:center;background:var(--card)}
.day small{display:block;color:var(--mut);font-size:10px}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.sel small{color:var(--bg)}
.sec{margin:0 10px 12px}
.sec h3{font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--red);margin:14px 4px 6px;display:flex;justify-content:space-between}
.sec h3 span{color:var(--mut);font-weight:500}
.spres{font-size:11px;color:var(--mut);margin:0 4px 6px;font-weight:600}
.snote{font-size:13px;color:var(--ink);background:var(--chip);border-radius:9px;padding:9px 11px;margin:0 2px 9px;white-space:pre-line;line-height:1.5}
.dsub{font-size:12px;color:var(--mut);margin:2px 12px 8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;overflow:hidden}
.itr{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;cursor:pointer}
.cb{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.it.done .cb{background:var(--ok);border-color:var(--ok)}
.itx{flex:1;min-width:0}
.itx .t{font-weight:600}
.itx .d{color:var(--mut);font-size:12px}
.pre{font-size:12px;color:var(--mut);margin-top:3px;font-weight:600}
.sum{font-size:12px;color:var(--red);margin-top:3px;font-weight:600}
.ed{display:none;gap:8px;flex-wrap:wrap;padding:0 11px 11px}
.it.ex .ed{display:flex}
.ed label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.ed input,.ed select,.ed textarea{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ed .f{width:78px}.ed .s{width:110px}.ed .nt{flex:1 1 100%}
.dn{margin:4px 10px 20px}
.dn textarea{width:100%;min-height:54px;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.dn label{font-size:11px;color:var(--mut)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:7px;padding:9px 12px;max-width:720px;margin:0 auto}
footer button{flex:1;font:inherit;font-size:12.5px;padding:10px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
footer .pri{background:var(--red);color:#fff;border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
</style>

ghted GHD Hip Extension", "d": "15 reps", "tipo": "car", "peso": 10, "reps": 15}, {"id": "c-x-e2", "t": "Dynamic Short Lever Copenhagen Plank", "d": "10/10 × 3 sets", "tipo": "chk"}]}, {"nombre": "Conditioning", "dur": "—", "pres": "FUERA esta semana", "nota": "PLANI: 3 sets de 7.5 m single arm OH walking lunge · 10 m HSW · 14 alternating DB hang clean and jerk · 10 m HSW · 7.5 m OH walking lunge, DB 22.5 kg.\nAHORA: el bloque entero afuera.\nPOR QUÉ: quince metros de zancada con peso en alto por set, dos veces por set, tres sets. Es el ejercicio con más carga excéntrica de glúteo e isquio de toda la semana y va 18 horas antes del test de trote. Vuelve en la fase post-10K.", "items": [{"id": "c-x-d1", "t": "Bloque saltado", "d": "marcar para registro", "tipo": "chk"}]}]}, {"dia": "Jue", "num": "27", "titulo": "Z2 + test de trote", "sub": "Adaptado · 60' · sesión clave", "secciones": [{"nombre": "Warm Up", "dur": "06:00", "pres": "2 rounds", "items": [{"id": "c-j-w1", "t": "Alternating Standing Knee Hugs", "d": "10 reps", "tipo": "chk"}, {"id": "c-j-w2", "t": "Alternating Table Tops", "d": "10 reps", "tipo": "chk"}, {"id": "c-j-w3", "t": "Alternating Scoop Hamstrings", "d": "10 reps", "tipo": "chk"}, {"id": "c-j-w4", "t": "Alternating Quad Pulls", "d": "10 reps", "tipo": "chk"}]}, {"nombre": "Bloque A · Z2 sin impacto", "dur": "30:00", "pres": "Remo, bici o ski · RPE 4/10 · ADAPTADO", "nota": "PLANI: 40' de trote continuo.\nAHORA: 30' sin impacto + 12' de trote al final.\nPOR QUÉ: 40' de impacto entre el deadlift del miércoles y el partido del sábado es carga excéntrica que el remo da igual sin el costo.\n\nRitmo conversacional de punta a punta: si no podés hablar de corrido, bajá.", "items": [{"id": "c-j-b1", "t": "Tiempo total", "d": "duración real", "tipo": "tim", "seg": 1800}, {"id": "c-j-b2", "t": "RPE del bloque", "d": "0-10 · objetivo 4", "tipo": "rep", "reps": 4}]}, {"nombre": "Bloque B · Test de trote", "dur": "12:00", "pres": "Semana 1 de 7 hacia el 10K", "nota": "Primer trote desde el tirón. Va al final y con la sesión ya hecha, a propósito: sin nada en juego. Muy suave, ritmo de conversación, sobre superficie plana. Si aparece cualquier molestia se corta en el acto — la semana que viene volvemos a remo y perdemos una semana de las siete, que es un costo aceptable.", "items": [{"id": "c-j-b3", "t": "Tiempo trotado", "d": "objetivo 12'", "tipo": "tim", "seg": 720}, {"id": "c-j-b6", "t": "Distancia trotada", "d": "para calcular el ritmo", "tipo": "dist", "km": 2}, {"id": "c-j-b4", "t": "Molestia durante el trote", "d": "0-10 · si pasa de 2, cortar", "tipo": "rep", "reps": 0}, {"id": "c-j-b5", "t": "Molestia el viernes al levantarte", "d": "decide la semana 2", "tipo": "rep", "reps": 0}]}, {"nombre": "Core", "dur": "10:00", "pres": "3 rondas · AGREGADO", "nota": "No está en la plani. Va al final porque no interfiere con nada, y sostiene la postura de carrera cuando los kilómetros suban. Sin flexión de cadera cargada.", "items": [{"id": "c-j-k1", "t": "Plancha · ronda 1", "d": "40 seg", "tipo": "tim", "seg": 40}, {"id": "c-j-k2", "t": "Dead bug", "d": "10/10 × 3 rondas", "tipo": "chk"}, {"id": "c-j-k3", "t": "Hollow hold", "d": "20\" × 3 rondas", "tipo": "chk"}]}, {"nombre": "Tren superior liviano", "dur": "12:00", "pres": "3 sets · rest 1:30 · opcional", "nota": "Solo si el bloque Z2 salió cómodo.", "items": [{"id": "c-j-t1", "t": "DB shoulder press sentado", "d": "10 reps · RIR 2", "tipo": "car", "peso": 15, "reps": 10}, {"id": "c-j-t2", "t": "Ring rows / remo con DB", "d": "12 reps · RIR 2", "tipo": "car", "peso": 20, "reps": 12}, {"id": "c-j-t3", "t": "3 sets completos", "d": "marcar al terminar", "tipo": "chk"}]}]}, {"dia": "Vie", "num": "28", "titulo": "Clean técnico + Back Squat", "sub": "Adaptado · 58' · sin partido · vuelve pierna", "secciones": [{"nombre": "Warm Up", "dur": "05:00", "pres": "2 rounds", "items": [{"id": "c-v-w1", "t": "Full T Hip Opener", "d": "10 reps", "tipo": "chk"}, {"id": "c-v-w2", "t": "Deep Squat w/ Internal-External Hip Rotation", "d": "10 reps", "tipo": "chk"}, {"id": "c-v-w3", "t": "Shoulder External Rotation con PVC", "d": "10/10", "tipo": "chk"}]}, {"nombre": "Weightlifting · Bloque A", "dur": "12:00", "pres": "Cada 2'30\" × 4 sets · sin cambios", "nota": "1 segment clean deadlift + 1 power clean into front squat + 1 hang power clean + 1 hang squat clean. Este bloque queda tal cual: es técnico y no llega a carga alta.", "items": [{"id": "c-v-a1", "t": "Set 1", "d": "55% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.55, "reps": 4}, {"id": "c-v-a2", "t": "Set 2", "d": "60% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.6, "reps": 4}, {"id": "c-v-a3", "t": "Set 3", "d": "65% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.65, "reps": 4}, {"id": "c-v-a4", "t": "Set 4", "d": "70% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.7, "reps": 4}]}, {"nombre": "Weightlifting · Bloque B", "dur": "—", "pres": "FUERA esta semana", "nota": "PLANI: cada 2'30\" × 4 sets al 75-83% del clean (2 hang squat clean + drop + 1 squat clean).\nAHORA: no se hace.\nPOR QUÉ: ya no es por el partido — es porque el bloque de pierna del día ahora es el back squat, y squat clean al 83% más 4×5 de squat son dos bloques pesados de pierna en la misma sesión. Elegí uno: el squat, que es el que construye fuerza.", "items": [{"id": "c-v-b1", "t": "Bloque saltado", "d": "marcar para registro", "tipo": "chk"}]}, {"nombre": "Fuerza · Back Squat", "dur": "10:00", "pres": "4 sets · 5 reps · rest 2:00 · AGREGADO", "nota": "PLANI: 3 sets de 3 reps de 1¼ front squat al 70%.\nAHORA: back squat 4×5 al 65-72%, bajá en 3 segundos y subí normal. RIR 3: la quinta rep tiene que salir sola.\n\nPOR QUÉ VUELVE: sin fútbol el sábado se cae la razón por la que el viernes era taper. Y el lunes fueron 4×3 — doce reps de squat en toda la semana es poco estímulo para fortalecer.\n\nPOR QUÉ BACK Y NO FRONT: mismo objetivo con muchísima menos tensión específica de cuádriceps que el 1¼ front squat, y hoy el cuádriceps te avisó en la corrida. Además el sábado vas al box y todavía no sabés qué hay: esto te deja el sábado disponible.\n\nSi el sábado el WOD viene cargado de pierna, se arregla el sábado, no acá.", "items": [{"id": "c-v-f1", "t": "Set 1", "d": "5 reps · 65%", "tipo": "car", "lift": "backsq", "pct": 0.65, "reps": 5}, {"id": "c-v-f2", "t": "Set 2", "d": "5 reps · 68%", "tipo": "car", "lift": "backsq", "pct": 0.68, "reps": 5}, {"id": "c-v-f3", "t": "Set 3", "d": "5 reps · 72%", "tipo": "car", "lift": "backsq", "pct": 0.72, "reps": 5}, {"id": "c-v-f4", "t": "Set 4", "d": "5 reps · 72%", "tipo": "car", "lift": "backsq", "pct": 0.72, "reps": 5}]}, {"nombre": "Leaderboard", "dur": "09:00", "pres": "3 sets · AMRAP 2' × 1' rest · ADAPTADO", "nota": "PLANI: 12 cal bike o 100 m run · 15 toes to bar · max clean and jerk.\nAHORA: 12 cal bike · 10 toes to bar · max clean and jerk 55 kg con tope de 8 reps.\n\nPOR QUÉ: la bici en vez de correr, porque es impacto la víspera del partido. T2B de 15 a 10 — el kip es un latigazo de cadera y con 15 son 45 reps en total. Y tope de 8 clean and jerk por set con carga moderada: \"max reps\" pesado es el bloque de más fatiga de cadera de la semana.", "items": [{"id": "c-v-l1", "t": "Set 1 · Clean and jerk", "d": "reps 55 kg · tope 8", "tipo": "rep", "reps": 6}, {"id": "c-v-l2", "t": "Set 2 · Clean and jerk", "d": "reps 55 kg · tope 8", "tipo": "rep", "reps": 6}, {"id": "c-v-l3", "t": "Set 3 · Clean and jerk", "d": "reps 55 kg · tope 8", "tipo": "rep", "reps": 6}]}, {"nombre": "Accesorio", "dur": "08:00", "pres": "3 sets por calidad · rest 2:00", "nota": "10/10 single arm DB upright row (liviano) · 10 banded external rotation face pull. Sin cambios: es hombro, no molesta al sábado.", "items": [{"id": "c-v-e1", "t": "Upright row", "d": "10/10 · liviano", "tipo": "car", "peso": 10, "reps": 10}, {"id": "c-v-e2", "t": "Banded Face Pull", "d": "10 reps × 3 sets", "tipo": "chk"}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "LO QUE PASÓ (registrado):\n· Bloque B NO se saltó — lo hiciste igual, cada 2'30\" × 4 sets hasta el 83%: 78 · 82 · 85 · 88 kg.\n· Back squat 4×5: no se hizo.\n· Leaderboard con 60 kg (no 55) y T2B en 15 (no 10): 12 cal bike + 15 T2B + clean and jerk → 10 · 8 · 11.\n· En la rep 10 del set 3 el gemelo derecho quiso tirar. Terminaste el set y no pasó nada.\n\nBalance: el día quedó al revés de como estaba escrito — se hizo el clean pesado y se cayó el squat. No es un problema en sí (el squat vuelve el lunes), pero el aviso del gemelo con 60 kg y 45 T2B es el dato que arrastro a la semana nueva: el lunes el box jump baja de un paso y los burpees over the bar van con paso.", "items": [{"id": "c-v-z1", "t": "Piernas al terminar", "d": "0 = frescas · 10 = fundidas", "tipo": "rep", "reps": 3}]}]}, {"dia": "Sáb", "num": "29", "titulo": "Solo rodaje", "sub": "No fuiste al box · 30' de corrida a la siesta", "secciones": [{"nombre": "Lo que pasó", "pres": "Registro real", "nota": "No hubo box. Solo la corrida: 30' a la siesta, nada más.\n\nEl bloque de jerk y el leaderboard de abajo no se hicieron — los dejo visibles como referencia de lo que estaba planificado.\n\nBalance de la semana: cinco días de box (lun a vie) y dos corridas (jue 12' de test + sáb 30'). La sesión que se cayó es la que menos costaba perder. Lo que falta es frecuencia de carrera: esta semana van tres salidas.", "items": [{"id": "c-s-real1", "t": "Tiempo de corrida", "d": "30'", "tipo": "tim", "seg": 1800}, {"id": "c-s-real2", "t": "Box: no se hizo", "d": "confirmado", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "08:00", "pres": "2 rounds · NO SE HIZO", "nota": "10 active hinge mobility · 10 shoulder ER con PVC · 10/10 knight to hamstring stretch · 5/5 single arm DB thrusters livianos.\n\nEntrá en calor con tiempo en el hombro: el día son 57 reps de tracción y todo el weightlifting va por encima de la cabeza.", "items": [{"id": "c-s-w1", "t": "Active hinge mobility", "d": "10 reps", "tipo": "chk"}, {"id": "c-s-w2", "t": "Shoulder ER con PVC", "d": "10 reps", "tipo": "chk"}, {"id": "c-s-w3", "t": "Knight to hamstring stretch", "d": "10/10", "tipo": "chk"}, {"id": "c-s-w4", "t": "Single arm DB thrusters", "d": "5/5 liviano", "tipo": "chk"}]}, {"nombre": "Weightlifting · Jerk", "dur": "14:00", "pres": "4 sets · rest 2:00-3:00 · IGUAL", "nota": "1 jerk drive + 1 power jerk + 2 split jerk, entre el 70 y 80% del 1RM de jerk.\n\nSe hace entero. Es el bloque más valioso del día para vos: empuje vertical pesado, que es justo lo que la semana híbrida te venía sacando. El split jerk mete una zancada cargada, pero son 8 reps en total — no es un bloque de pierna.\n\nQuedate en el 70-75% en los dos primeros sets y subí solo si la recepción sale firme.", "items": [{"id": "c-s-j1", "t": "Set 1", "d": "complejo · 70%", "tipo": "car", "lift": "jerk", "pct": 0.7, "reps": 4}, {"id": "c-s-j2", "t": "Set 2", "d": "complejo · 73%", "tipo": "car", "lift": "jerk", "pct": 0.73, "reps": 4}, {"id": "c-s-j3", "t": "Set 3", "d": "complejo · 77%", "tipo": "car", "lift": "jerk", "pct": 0.77, "reps": 4}, {"id": "c-s-j4", "t": "Set 4", "d": "complejo · 80%", "tipo": "car", "lift": "jerk", "pct": 0.8, "reps": 4}]}, {"nombre": "Leaderboard · parte 1", "dur": "10:00", "pres": "3 rounds · IGUAL", "nota": "14 pull ups + 7 power snatch 50 kg.\n\nIgual. Si en la segunda ronda las pull ups se te parten en series de menos de 5, bajá a 10 por ronda: te guardás el hombro para la parte 2, que es la que tiene los muscle ups.", "items": [{"id": "c-s-l1", "t": "Ronda 1 · Pull ups", "d": "14 reps", "tipo": "rep", "reps": 14}, {"id": "c-s-l2", "t": "Ronda 2 · Pull ups", "d": "14 reps", "tipo": "rep", "reps": 14}, {"id": "c-s-l3", "t": "Ronda 3 · Pull ups", "d": "14 reps", "tipo": "rep", "reps": 14}, {"id": "c-s-l4", "t": "Power snatch · carga", "d": "7 reps por ronda", "tipo": "car", "peso": 50, "reps": 7}, {"id": "c-s-l5", "t": "Tiempo parte 1", "d": "3 rondas", "tipo": "tim", "seg": 480}]}, {"nombre": "Double unders", "dur": "03:00", "pres": "60 reps · RECORTADO", "nota": "PLANI: 100 double unders.\nAHORA: 60.\nPOR QUÉ: es el único bloque de impacto puro de la semana y cae 24 horas después del back squat del viernes. Faltan seis semanas para el 10K y el gemelo y el aquiles son lo que menos tolera saltos acumulados sin haber vuelto a correr en volumen.\n\nNo es fatiga: es la única concesión del día. Los otros 40 saltos no te dan nada que no te dé el resto de la sesión.", "items": [{"id": "c-s-d1", "t": "Double unders", "d": "60 en lugar de 100", "tipo": "rep", "reps": 60}, {"id": "c-s-d2", "t": "Tiempo", "d": "", "tipo": "tim", "seg": 120}]}, {"nombre": "Leaderboard · parte 2", "dur": "10:00", "pres": "3 rounds · IGUAL", "nota": "5/4 bar muscle ups (o 10 pull ups) + 4 squat snatch 50 kg.\n\nIgual. Los 12 squat snatch son el único trabajo de sentadilla del día y son técnicos, no cargados: no chocan con el viernes.\n\nSi la parte 1 te dejó el dorsal cansado, tomá la opción de 10 pull ups sin culpa — el estímulo del día ya está cubierto.", "items": [{"id": "c-s-l6", "t": "Ronda 1 · BMU o pull ups", "d": "5 BMU · o 10 pull ups", "tipo": "rep", "reps": 5}, {"id": "c-s-l7", "t": "Ronda 2 · BMU o pull ups", "d": "5 BMU · o 10 pull ups", "tipo": "rep", "reps": 4}, {"id": "c-s-l8", "t": "Ronda 3 · BMU o pull ups", "d": "5 BMU · o 10 pull ups", "tipo": "rep", "reps": 4}, {"id": "c-s-l9", "t": "Squat snatch · carga", "d": "4 reps por ronda", "tipo": "car", "peso": 50, "reps": 4}, {"id": "c-s-l10", "t": "Tiempo parte 2", "d": "3 rondas", "tipo": "tim", "seg": 480}]}, {"nombre": "Registro", "pres": "Al terminar", "nota": "Dos datos que necesito para armar la semana que viene: cómo quedó el hombro con 57 reps de tracción en un día, y cómo quedaron las piernas con squat el viernes y jerk el sábado.\n\nEl de gemelo y aquiles es el que decide la corrida de la tarde: si pasa de 4, el rodaje baja a 20'.", "items": [{"id": "c-s-z1", "t": "Hombro al terminar", "d": "0 = bien · 10 = fundido", "tipo": "rep", "reps": 4}, {"id": "c-s-z2", "t": "Piernas al terminar", "d": "0 = frescas · 10 = fundidas", "tipo": "rep", "reps": 3}, {"id": "c-s-z3", "t": "Gemelo y aquiles", "d": "post double unders · decide la tarde", "tipo": "rep", "reps": 1}]}, {"nombre": "Rodaje Z2", "dur": "30:00", "pres": "15:00-16:00 h · sesión 2 de 2 · AGREGADO", "nota": "Cuatro o cinco horas después del box, no antes: comé algo y dejá que baje el sistema nervioso. La separación es lo que hace que esto funcione como doble sesión y no como un bloque más del WOD.\n\nPOR QUÉ ACÁ: esta semana corriste una sola vez, el martes se cayó el rodaje de 20'. Con el 10K el 11/10 lo único que me preocupa es la frecuencia, y un domingo que quizás no puedas es peor que un sábado a la tarde que sí.\n\n30' continuos, ritmo de conversación — el jueves hiciste 6:52/km con 20' de remo encima, así que esto sale en 6:30-6:50 y está perfecto. Si el gemelo quedó en 5 o más después de los double unders, hacé 20' y ya está cumplido.\n\nArrancar lento los primeros 5': las piernas vienen de jerk y snatch, no de la cama.", "items": [{"id": "c-s-r1", "t": "Tiempo", "d": "30' objetivo · 20' si el gemelo avisó", "tipo": "tim", "seg": 1800}, {"id": "c-s-r2", "t": "Distancia", "d": "km", "tipo": "car", "peso": 4.5, "reps": 1}, {"id": "c-s-r3", "t": "Sensación", "d": "0 = fácil · 10 = duro", "tipo": "rep", "reps": 5}, {"id": "c-s-r4", "t": "Horas desde el box", "d": "objetivo 4-5", "tipo": "rep", "reps": 4}]}]}, {"dia": "Dom", "num": "30", "titulo": "Descanso", "sub": "Libre · la corrida ya está hecha", "secciones": [{"nombre": "Descanso", "pres": "Sin plan", "nota": "El rodaje se movió al sábado a la tarde. Si te queda ganas, caminata de 30' en llano y nada más.\n\nAnotá cómo te levantás: es el dato que dice si la doble sesión del sábado se puede repetir todas las semanas o fue de una vez.", "items": [{"id": "c-d-z1", "t": "Cómo te levantaste", "d": "0 = entero · 10 = roto", "tipo": "rep", "reps": 3}, {"id": "c-d-z2", "t": "Caminata 30'", "d": "opcional", "tipo": "chk"}]}]}], "label": "24–29 ago", "nombre": "semana 24 al 29 de agosto", "obj": ""}, {"s": 4, "dias": [{"dia": "Lun", "num": "31", "titulo": "Snatch completo + Back Squat", "sub": "Adaptado · 58' · llegás fresco", "secciones": [{"nombre": "Warm up", "dur": "05:00", "pres": "2 rounds · IGUAL", "items": [{"id": "d-l-w1", "t": "90-90 hip rotation w/ hip thrust", "d": "10 reps", "tipo": "chk"}, {"id": "d-l-w2", "t": "Full T Hip Opener", "d": "10/10", "tipo": "chk"}, {"id": "d-l-w3", "t": "Shoulders Global", "d": "10 reps", "tipo": "chk"}, {"id": "d-l-w4", "t": "Overhead Squat con banda", "d": "10 reps", "tipo": "chk"}]}, {"nombre": "Activación · Pliometría", "dur": "05:00", "pres": "Box jump 3-2-2-1-1 · ADAPTADO", "nota": "PLANI: construir altura en el salto al cajón, por calidad.\nAHORA: misma progresión pero con techo de altura y BAJANDO CAMINANDO del cajón en cada rep, sin rebote.\n\nPOR QUÉ: el viernes en la rep 10 del último set el gemelo derecho te avisó. La bajada de un box jump alto es el pico de carga excéntrica de gemelo y aquiles de toda la semana, y faltan seis semanas para el 10K. Subir por altura sirve igual; bajar de un salto no te suma nada.\n\nElegí la altura donde llegás sin estirar la cadera en el aire y quedate ahí. Si el gemelo dice algo, cortás la progresión y pasás al snatch.", "items": [{"id": "d-l-p1", "t": "Altura alcanzada", "d": "cm del cajón", "tipo": "rep", "reps": 60}, {"id": "d-l-p2", "t": "Gemelo derecho durante el bloque", "d": "0-10 · si pasa de 2, cortar", "tipo": "rep", "reps": 0}, {"id": "d-l-p3", "t": "Bajada caminando en todas las reps", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Weightlifting · Bloque A", "dur": "06:00", "pres": "Cada 2' × 3 sets · 45-65% Snatch · IGUAL", "nota": "1 slow pull power snatch + 1 hang squat snatch con pausa en la recepción.\n\nSin cambios. Son tres sets técnicos y el más pesado es el 65%.", "items": [{"id": "d-l-a1", "t": "Set 1", "d": "45% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.45, "reps": 2}, {"id": "d-l-a2", "t": "Set 2", "d": "55% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.55, "reps": 2}, {"id": "d-l-a3", "t": "Set 3", "d": "65% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.65, "reps": 2}]}, {"nombre": "Weightlifting · Bloque B", "dur": "06:00", "pres": "Cada 2' × 3 sets · 70-80% Snatch · VUELVE", "nota": "1 snatch pull + 1 low hang squat snatch + 1 overhead squat.\n\nPOR QUÉ VUELVE (dos semanas seguidas afuera): el viernes lo hiciste igual, subiste hasta 88 y salió bien. Y el bloque de pierna de hoy es 3×2, no 4×3 — seis reps de squat dejan lugar para tres sets de snatch. Además el sábado no fuiste al box: llegás al lunes sin nada acumulado.\n\nEl overhead squat al final del complejo es el juez. Si a los 60 se te va la barra adelante o el codo cede, ese es tu tope del día: no subas al 80%.", "items": [{"id": "d-l-b1", "t": "Set 1", "d": "70% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.7, "reps": 3}, {"id": "d-l-b2", "t": "Set 2", "d": "75% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.75, "reps": 3}, {"id": "d-l-b3", "t": "Set 3", "d": "80% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.8, "reps": 3}]}, {"nombre": "Fuerza · Back Squat", "dur": "09:00", "pres": "Cada 3' × 3 sets · 2 reps · RPE 8-8.5 · IGUAL", "nota": "80-85% del 1RM. Sin cambios: es el bloque más importante del día.\n\nReferencia: el lunes pasado cerraste 112 × 3 en Justo, y el viernes el back squat no se hizo, así que la pierna viene de una sola sesión de squat en nueve días. 119 × 2 tiene que salir.", "items": [{"id": "d-l-f1", "t": "Set 1", "d": "2 reps · 80%", "tipo": "car", "lift": "backsq", "pct": 0.8, "reps": 2}, {"id": "d-l-f2", "t": "Set 2", "d": "2 reps · 82%", "tipo": "car", "lift": "backsq", "pct": 0.82, "reps": 2}, {"id": "d-l-f3", "t": "Set 3", "d": "2 reps · 85%", "tipo": "car", "lift": "backsq", "pct": 0.85, "reps": 2}]}, {"nombre": "Conditioning", "dur": "12:00", "pres": "EMOM 3' × 4 sets · 45/30 kg · ADAPTADO", "nota": "12 burpees over the bar · 9 deadlift · 7 hang power snatch · 5 overhead squats. Ritmo fluido en la barra (barbell cycling).\n\nÚNICO CAMBIO: los burpees over the bar van LATERALES CON PASO por encima de la barra, no salto. Son 48 burpees en el bloque; con salto son 48 despegues y 48 aterrizajes de gemelo el mismo día del box jump. Con paso, el estímulo cardiovascular es idéntico.\n\nEl resto queda: 45 kg en deadlift, hang power snatch y overhead squat es carga liviana y el trabajo es de ciclado de barra, que es justo lo que te falta.\n\nSi no cierran las rondas dentro de los 3', recortá los burpees a 9 y mantené la barra entera.", "items": [{"id": "d-l-c1", "t": "Set 1", "d": "reps completadas en 3'", "tipo": "ron"}, {"id": "d-l-c2", "t": "Set 2", "d": "reps completadas en 3'", "tipo": "ron"}, {"id": "d-l-c3", "t": "Set 3", "d": "reps completadas en 3'", "tipo": "ron"}, {"id": "d-l-c4", "t": "Set 4", "d": "reps completadas en 3'", "tipo": "ron"}]}, {"nombre": "Accesorio", "dur": "08:00", "pres": "3 sets · rest 2:00 · IGUAL", "nota": "10/10 three point dumbbell row · 8 YTW. Liviano, por calidad. Sin cambios: es hombro y dorsal, no interfiere con nada.", "items": [{"id": "d-l-e1", "t": "Three point DB row", "d": "10/10 · liviano", "tipo": "car", "peso": 22.5, "reps": 10}, {"id": "d-l-e2", "t": "YTW", "d": "8 reps × 3 sets", "tipo": "chk"}, {"id": "d-l-e3", "t": "3 sets completos", "d": "marcar al terminar", "tipo": "chk"}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "El gemelo derecho es el dato de la semana. Si termina en 3 o más, el martes el rodaje se cambia por remo o bici y no se discute.\n\nY la corrida: esta semana necesito tres salidas, no dos. El plan es martes rodaje, jueves Z2 + trote, sábado o domingo el largo. Hoy no se corre.", "items": [{"id": "d-l-z1", "t": "Gemelo derecho al terminar", "d": "0 = bien · 10 = avisando", "tipo": "rep", "reps": 1}, {"id": "d-l-z2", "t": "Piernas al terminar", "d": "0 = frescas · 10 = fundidas", "tipo": "rep", "reps": 4}]}]}, {"dia": "Mar", "num": "1", "titulo": "Empuje / Tracción + Rodaje", "sub": "PROPIA · 55' + 25' de corrida", "mes": "septiembre", "secciones": [{"nombre": "Cómo armé este día", "pres": "Sin plani del coach", "nota": "Este día lo escribí yo, con la estructura de las cuatro semanas que ya registramos: warm up → activación → weightlifting → fuerza → conditioning → accesorio, dentro de la hora.\n\nCRITERIO DEL MARTES: es el día que menos toca la pierna en toda la semana. El lunes fue snatch + back squat + EMOM con barra, y el jueves es la sesión de carrera. Entonces el martes es torso: empuje vertical, tracción, y un conditioning que no tenga ni un salto. Así la pierna descansa 48 hs entre el back squat del lunes y el trote del jueves, y el rodaje de hoy entra sin pelearse con nada.\n\nSé lo que no sé: no vi tu técnica ni tengo tus RM de press. Los kilos de abajo son un punto de partida — si el primer set sale fácil, subilo y anotá el número real; eso es lo que hace que la próxima semana salga mejor calibrada.", "items": [{"id": "d-m-x1", "t": "Leído antes de entrenar", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "06:00", "pres": "2 rounds", "items": [{"id": "d-m-w1", "t": "Scap pull ups", "d": "10 reps", "tipo": "chk"}, {"id": "d-m-w2", "t": "Push up to down dog", "d": "8 reps", "tipo": "chk"}, {"id": "d-m-w3", "t": "Rotación torácica en cuadrupedia", "d": "10/10", "tipo": "chk"}, {"id": "d-m-w4", "t": "Band pull apart", "d": "15 reps", "tipo": "chk"}]}, {"nombre": "Activación", "dur": "04:00", "pres": "2 rounds · sin salto", "nota": "Nada de pliometría hoy. El gemelo derecho avisó el viernes y la carga de impacto de la semana va toda al jueves.", "items": [{"id": "d-m-p1", "t": "Hollow hold", "d": "30 segundos", "tipo": "chk"}, {"id": "d-m-p2", "t": "Ring row con pausa 2\" arriba", "d": "8 reps", "tipo": "chk"}]}, {"nombre": "Fuerza A · Strict Press", "dur": "12:00", "pres": "Cada 2'30\" × 4 sets · 5 reps · RPE 7-8", "nota": "Empuje vertical estricto, sin ayuda de pierna. El overhead squat del lunes y el jerk del viernes te piden hombro estable arriba; el strict press es lo que lo construye y es lo que menos aparece en las planis que vi.\n\nSubí 2.5 kg por set mientras las 5 reps salgan sin quiebre de lumbar. Si el set 3 se pone feo, repetí el peso en el 4 y listo.", "items": [{"id": "d-m-f1", "t": "Set 1", "d": "5 reps", "tipo": "car", "peso": 40, "reps": 5}, {"id": "d-m-f2", "t": "Set 2", "d": "5 reps", "tipo": "car", "peso": 42.5, "reps": 5}, {"id": "d-m-f3", "t": "Set 3", "d": "5 reps", "tipo": "car", "peso": 45, "reps": 5}, {"id": "d-m-f4", "t": "Set 4", "d": "5 reps", "tipo": "car", "peso": 45, "reps": 5}]}, {"nombre": "Fuerza B · Tracción", "dur": "08:00", "pres": "4 sets · alternado con el press", "nota": "Va intercalado en los descansos del press: mientras la barra descansa, hacés la tracción. Así el bloque entra en 12' en vez de 20'.\n\nSi las strict pull ups no salen en series de 5, hacé negativas de 4\" o usá banda. La cuenta es de reps buenas, no de reps.", "items": [{"id": "d-m-t1", "t": "Set 1 · strict pull ups", "d": "reps", "tipo": "rep", "reps": 5}, {"id": "d-m-t2", "t": "Set 2 · strict pull ups", "d": "reps", "tipo": "rep", "reps": 5}, {"id": "d-m-t3", "t": "Set 3 · strict pull ups", "d": "reps", "tipo": "rep", "reps": 4}, {"id": "d-m-t4", "t": "Set 4 · strict pull ups", "d": "reps", "tipo": "rep", "reps": 4}]}, {"nombre": "Conditioning", "dur": "15:00", "pres": "3 rounds · descanso 1' · CERO IMPACTO", "nota": "500 m remo · 12 DB push press (2×15 kg) · 12 ring rows.\n\nRitmo objetivo: el remo a 2:15-2:20/500 m, más rápido que tu Z2 de 2:40, pero son 500 m sueltos con descanso. La idea es respirar fuerte sin que la pierna trabaje.\n\nAnotá el tiempo total de cada round: es el número que compara semana contra semana.", "items": [{"id": "d-m-c1", "t": "Round 1", "d": "tiempo total", "tipo": "tim", "seg": 300}, {"id": "d-m-c2", "t": "Round 2", "d": "tiempo total", "tipo": "tim", "seg": 300}, {"id": "d-m-c3", "t": "Round 3", "d": "tiempo total", "tipo": "tim", "seg": 300}]}, {"nombre": "Accesorio", "dur": "06:00", "pres": "3 sets", "nota": "Hombro posterior y core. Liviano, por calidad.", "items": [{"id": "d-m-e1", "t": "Face pull con banda", "d": "15 reps × 3 sets", "tipo": "chk"}, {"id": "d-m-e2", "t": "Dead bug", "d": "10/10 × 3 sets", "tipo": "chk"}, {"id": "d-m-e3", "t": "3 sets completos", "d": "marcar al terminar", "tipo": "chk"}]}, {"nombre": "Rodaje Z2", "pres": "20-25' · aparte de la sesión", "nota": "Salida 1 de 3 de la semana. Suave: tenés que poder hablar. Si el gemelo terminó el lunes en 3 o más, esto se hace en remo o bici al mismo RPE y no se discute.\n\nSi podés, separalo del box por unas horas — a la siesta, como el sábado, funcionó bien.", "items": [{"id": "d-m-r1", "t": "Tiempo de rodaje", "d": "objetivo 20-25'", "tipo": "tim", "seg": 1320}, {"id": "d-m-r2", "t": "Distancia", "d": "km", "tipo": "dist", "km": 3.5}, {"id": "d-m-r3", "t": "Gemelo durante el rodaje", "d": "0-10 · si pasa de 2, cortar", "tipo": "rep", "reps": 0}]}]}, {"dia": "Mié", "num": "2", "titulo": "Corrida + Tren superior en casa", "sub": "HOY · 25' de corrida + 40' de pesas pesadas", "mes": "septiembre", "secciones": [{"nombre": "El orden: correr primero", "pres": "Respuesta corta · sí", "nota": "Corré primero, después las pesas. Tres razones:\n\n1. La corrida es la prioridad de las próximas seis semanas. Lo que va primero es lo que hacés con las piernas frescas y la cabeza entera.\n2. El trabajo de pesas es todo de tren superior. No le saca nada a la corrida: no hay competencia entre los dos bloques, que es justo por qué esta combinación funciona.\n3. Al revés sí molesta un poco. Después de 40' de press y remo el tronco está cansado, y correr con el torso fatigado te empeora la postura — hombro adelante, respiración más corta.\n\nDejá 5-10 minutos entre los dos. Tomás agua, se te normaliza la respiración, y arrancás las pesas.\n\nSi por horario tenés que hacer las pesas primero, no es un desastre: bajá la corrida a 20' y andá suave.", "items": [{"id": "d-xc-ord", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Corrida", "dur": "25:00", "pres": "Salida 1 de 3 · Z2 · reemplaza la de ayer", "nota": "Ayer no se corrió, así que esta es la primera de las tres salidas de la semana. Sigue siendo la de rodaje suave: ritmo conversado, 6:50-7:10/km. Nada de apretar.\n\nEl jueves — mañana — es la sesión grande de carrera (25' sin impacto + 15-18' de trote). Así que hoy 25' y suave; hoy no es el día de sacar un ritmo.\n\nGemelo derecho: si aparece algo de 3 o más, parás. El aviso del viernes sigue siendo el dato que cuido toda la semana.", "items": [{"id": "d-xc-r1", "t": "Tiempo", "d": "objetivo 25'", "tipo": "tim", "seg": 1500}, {"id": "d-xc-r2", "t": "Distancia", "d": "km", "tipo": "dist", "km": 3.5}, {"id": "d-xc-r3", "t": "Gemelo durante la corrida", "d": "0-10 · si pasa de 2, cortar", "tipo": "rep", "reps": 0}]}, {"nombre": "Tu material · la matemática de los discos", "pres": "Leer una vez", "nota": "LO QUE TENÉS: dos mancuernas armables de 2,5 kg cada barra, y 50 kg de discos en total — 8 de 5 kg (40 kg) y 4 de 2,5 kg (10 kg).\n\nLA CUENTA QUE MANDA: los discos son un solo juego. Si cargás las dos mancuernas, cada una se lleva la mitad. Si cargás una sola, se lleva todo. De ahí salen dos escalas distintas y son las únicas que existen en tu casa:\n\nLAS DOS IGUALES — peso real de cada mancuerna:\n7,5 · 12,5 · 17,5 · 22,5 · 27,5 kg\n(discos: 5 · 10 · 15 · 20 · 25, más los 2,5 de la barra)\nTecho: 27,5 kg por mano. Las dos manos juntas, 55 kg.\n\nUNA SOLA CON TODO — peso real:\n32,5 · 37,5 · 42,5 · 47,5 · 52,5 kg\n(discos: 30 · 35 · 40 · 45 · 50, más la barra)\nTecho: 52,5 kg.\n\nEsos diez números son todo tu gimnasio. No hay nada en el medio: el salto mínimo es de 5 kg porque los discos entran de a dos, uno por lado.\n\nCONSECUENCIA PARA ENTRENAR PESADO: el peso de verdad está en el trabajo a un brazo. Con las dos cargadas llegás a 27,5 por mano — que para press estricto ya es pesado para vos: 55 kg entre las dos manos, diez arriba de los 45 que movés en barra. Pero para remo, 27,5 por mano es liviano. El remo pesado va a un brazo: 52,5 kg.\n\nY UNA REGLA PRÁCTICA: no armes superseries que mezclen las dos escalas. Cambiar de 52,5 a un brazo a 27,5 por mano te hace desarmar los discos entre set y set y se te va la sesión en eso. Un bloque, una configuración. Abajo está ordenado así: se cambian los discos dos veces en todo el entrenamiento.", "items": [{"id": "d-xc-m1", "t": "Barra de mancuerna: 2,5 kg", "d": "confirmado · ya está en los números", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "04:00", "pres": "2 rounds · liviano", "nota": "Corto, ya venís caliente de la corrida. Esto es solo para dejar el hombro listo para cargar.", "items": [{"id": "d-xc-cw1", "t": "Band pull apart (o brazos en cruz)", "d": "15 reps", "tipo": "chk"}, {"id": "d-xc-cw2", "t": "Círculos de hombro adelante y atrás", "d": "10/10", "tipo": "chk"}, {"id": "d-xc-cw3", "t": "Push up lento", "d": "8 reps", "tipo": "chk"}, {"id": "d-xc-cw4", "t": "Remo liviano a un brazo", "d": "10/10 con 17,5 kg", "tipo": "chk"}]}, {"nombre": "Bloque 1 · Tracción pesada", "dur": "14:00", "pres": "CONFIG: una mancuerna, todo · hasta 52,5 kg · 5 sets · descanso 2'", "nota": "DB Row a un brazo. Armá UNA sola mancuerna y ponele todo lo que tengas.\n\nSubida por sets, peso real: 42,5 → 47,5 → 52,5 → 52,5 → 52,5 kg. Los últimos tres sets al techo, 6 reps por brazo, RPE 8. Si los 52,5 salen con margen, la próxima subimos reps antes que peso — no tenés más discos, así que de acá en adelante la progresión es tempo y reps.\n\nCÓMO: una mano y una rodilla apoyadas en una silla o el borde de la cama, espalda plana, tirás con el codo pegado al cuerpo y aguantás 1 segundo arriba. Ese segundo es lo que convierte 52,5 kg en trabajo de dorsal y no en un envión de cadera.\n\nEste es el bloque más pesado del día y por eso va primero.", "items": [{"id": "d-xc-a1", "t": "Set 1 · DB Row 1 brazo", "d": "6/6 · 40 de discos + barra", "tipo": "car", "peso": 42.5, "reps": 6}, {"id": "d-xc-a2", "t": "Set 2 · DB Row 1 brazo", "d": "6/6 · 45 de discos + barra", "tipo": "car", "peso": 47.5, "reps": 6}, {"id": "d-xc-a3", "t": "Set 3 · DB Row 1 brazo", "d": "6/6 · todo · techo", "tipo": "car", "peso": 52.5, "reps": 6}, {"id": "d-xc-a4", "t": "Set 4 · DB Row 1 brazo", "d": "6/6 · todo · techo", "tipo": "car", "peso": 52.5, "reps": 6}, {"id": "d-xc-a5", "t": "Set 5 · DB Row 1 brazo", "d": "6/6 · todo · techo", "tipo": "car", "peso": 52.5, "reps": 6}]}, {"nombre": "Bloque 2 · Empuje pesado", "dur": "16:00", "pres": "CONFIG: las dos al techo, 27,5 kg cada una · descanso 2'", "nota": "Repartí los discos: 2 de 5 kg + 1 de 2,5 kg por lado en cada mancuerna. Eso da 27,5 kg por mano contando la barra. Con esa configuración se hacen los dos ejercicios seguidos, sin volver a tocar los discos.\n\nB1 · DB STRICT PRESS de pie — 5 sets × 5 reps, RPE 8. Estricto: sin flexión de rodilla, sin arquear la lumbar. Son 55 kg entre las dos manos, diez kilos arriba de tu press en barra — para vos esto es pesado de verdad, tratalo como tal.\n\nB2 · DB FLOOR PRESS — 4 sets × 6 reps. En el piso, codos a 45°, bajás hasta que el tríceps toca y empujás. El piso te corta el rango abajo, que es exactamente lo que hace que puedas cargar el techo sin hombro comprometido y sin banco.\n\nSi las 5 reps del press no salen limpias, sacá el disco de 2,5 de cada lado (quedás en 22,5 por mano) y hacé los 5 sets ahí. Bajar el peso para mantener la técnica es progreso; forzar 25 con la lumbar arqueada no.", "items": [{"id": "d-xc-b1", "t": "Strict Press · sets 1-5", "d": "5 reps · por mano, con barra", "tipo": "car", "peso": 27.5, "reps": 5}, {"id": "d-xc-b2", "t": "Sets de press completados a 27,5", "d": "de 5", "tipo": "rep", "reps": 5}, {"id": "d-xc-b3", "t": "Floor Press · sets 1-4", "d": "6 reps · por mano, con barra", "tipo": "car", "peso": 27.5, "reps": 6}]}, {"nombre": "Bloque 3 · Vertical + accesorio", "dur": "08:00", "pres": "CONFIG: 7,5 o 12,5 kg · 3 sets seguidos", "nota": "Último cambio de discos: dejá 5 o 10 kg de discos por mancuerna (7,5 o 12,5 kg reales) y hacé los tres ejercicios seguidos, sin descanso entre ellos y 90\" entre vueltas.\n\nAcá no se busca peso. Es hombro lateral, bíceps y core después de dos bloques pesados.\n\nY si tenés barra de dominadas: cambiá el lateral raise por pull ups estrictas al fallo técnico. Es mejor uso de los 8 minutos que te quedan.", "items": [{"id": "d-xc-c1", "t": "DB Lateral Raise (o pull ups)", "d": "12 reps × 3 sets", "tipo": "chk"}, {"id": "d-xc-c2", "t": "DB Curl", "d": "12 reps × 3 sets", "tipo": "chk"}, {"id": "d-xc-c3", "t": "Hollow hold 30\" + Plancha 30\"", "d": "3 sets", "tipo": "chk"}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "Anotá los discos reales de cada bloque. Tenés 52,5 kg de techo y punto: no hay más para agregar nunca, así que a partir de la semana que viene la progresión sale de otro lado — más reps al mismo peso, bajada más lenta, pausa arriba, menos descanso, o un set más. Eso solo funciona si los números de hoy quedan escritos.\n\nEl bloque de clean & jerk y deadlift que había escrito para hoy queda abajo, sin hacer. Lo muevo al viernes si querés, o lo dejamos afuera de esta semana: son dos días pesados de pierna en cinco días y ya tuviste back squat el lunes.", "items": [{"id": "d-xc-z1", "t": "Hombro al terminar", "d": "0 = bien · 10 = muy cargado", "tipo": "rep", "reps": 4}, {"id": "d-xc-z2", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 1}]}, {"nombre": "— Plan original del miércoles (no se hace hoy) —", "pres": "Referencia", "nota": "Lo de abajo es la sesión de box que había escrito para este día. Queda como referencia.", "items": [{"id": "d-xc-ref", "t": "Sesión de box: no se hizo", "d": "confirmado", "tipo": "chk"}]}, {"nombre": "Cómo estaba armado el miércoles de box", "pres": "Sin plani del coach", "nota": "CRITERIO DEL MIÉRCOLES: el lunes fue snatch, así que el segundo día pesado va al clean & jerk — es el levantamiento que más usás en los WOD (el viernes hiciste 29 reps con 60 kg) y el que más se te repite en el leaderboard.\n\nLa cadena posterior va acá y no el jueves ni el viernes: el deadlift pesado deja los isquios cargados 24-36 hs, y mañana se corre. Cuatro reps por set, no más — series largas de deadlift dejan la lumbar frita y no te suman nada para el 10K.\n\nEl accesorio de isquio y aductor es fijo del miércoles: es lo que sostiene el aumento de kilómetros sin que aparezca una molestia nueva.", "items": [{"id": "d-x-x1", "t": "Leído antes de entrenar", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "06:00", "pres": "2 rounds", "items": [{"id": "d-x-w1", "t": "90-90 hip rotation", "d": "10 reps", "tipo": "chk"}, {"id": "d-x-w2", "t": "Front rack stretch con barra", "d": "30 segundos", "tipo": "chk"}, {"id": "d-x-w3", "t": "Good morning con barra vacía", "d": "10 reps", "tipo": "chk"}, {"id": "d-x-w4", "t": "Muñeca y codo para el front rack", "d": "30 segundos", "tipo": "chk"}]}, {"nombre": "Activación", "dur": "04:00", "pres": "2 rounds", "items": [{"id": "d-x-p1", "t": "Glute bridge con banda", "d": "15 reps", "tipo": "chk"}, {"id": "d-x-p2", "t": "Bird dog", "d": "8/8", "tipo": "chk"}]}, {"nombre": "Weightlifting · Clean & Jerk", "dur": "12:00", "pres": "Cada 2' × 5 sets · 60-78% Clean", "nota": "1 power clean + 1 hang squat clean + 1 split jerk.\n\nNo es un día de buscar máximo: es de repetir el mismo complejo cinco veces y que las cinco se vean iguales. El split jerk al final es el que cuenta — si el pie de adelante aterriza corto, bajá el peso.\n\nEl salto del jerk es bajo y controlado, no un salto vertical. Con el gemelo avisando, esto importa: aterrizás en tijera, no rebotás.", "items": [{"id": "d-x-a1", "t": "Set 1", "d": "60% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.6, "reps": 3}, {"id": "d-x-a2", "t": "Set 2", "d": "65% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.65, "reps": 3}, {"id": "d-x-a3", "t": "Set 3", "d": "70% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.7, "reps": 3}, {"id": "d-x-a4", "t": "Set 4", "d": "74% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.74, "reps": 3}, {"id": "d-x-a5", "t": "Set 5", "d": "78% del 1RM Clean", "tipo": "car", "lift": "clean", "pct": 0.78, "reps": 3}]}, {"nombre": "Fuerza · Deadlift", "dur": "12:00", "pres": "Cada 3' × 4 sets · 4 reps · RPE 7.5-8", "nota": "70-80% del 1RM. Reps de a una, bajando controlado, sin rebote en el piso.\n\nTope: si el set 4 te obliga a redondear la espalda, ese es el techo del día y el número que anotás es el bueno. Mañana se corre 15-18 minutos; no vale la pena ganar 5 kg acá y perder la sesión de carrera.", "items": [{"id": "d-x-f1", "t": "Set 1", "d": "4 reps · 70%", "tipo": "car", "lift": "dead", "pct": 0.7, "reps": 4}, {"id": "d-x-f2", "t": "Set 2", "d": "4 reps · 74%", "tipo": "car", "lift": "dead", "pct": 0.74, "reps": 4}, {"id": "d-x-f3", "t": "Set 3", "d": "4 reps · 77%", "tipo": "car", "lift": "dead", "pct": 0.77, "reps": 4}, {"id": "d-x-f4", "t": "Set 4", "d": "4 reps · 80%", "tipo": "car", "lift": "dead", "pct": 0.8, "reps": 4}]}, {"nombre": "Conditioning", "dur": "12:00", "pres": "AMRAP 12' · 40 kg · sin salto", "nota": "10 cal bike · 8 hang power clean (40 kg) · 10 T2B.\n\nPOR QUÉ ASÍ: es el mismo formato del leaderboard que ya hiciste (bike + T2B + barra), con peso liviano para que puedas ciclar la barra sin bajarla. El viernes con 60 kg hiciste series de 8-11 reps; con 40 tenés que poder hacer las 8 de un tirón, y ese es el punto.\n\nT2B: si a los 45 del viernes te agarró el abdomen, cortá a 8 por ronda. Nada de burpees hoy — la pierna tiene que llegar entera a mañana.\n\nObjetivo: 5 rondas o más.", "items": [{"id": "d-x-c1", "t": "Rondas completas", "d": "en 12'", "tipo": "ron"}, {"id": "d-x-c2", "t": "Reps sueltas de la ronda parcial", "d": "reps", "tipo": "rep", "reps": 0}]}, {"nombre": "Accesorio · Fijo del miércoles", "dur": "08:00", "pres": "3 sets · rest 2:00", "nota": "Isquio y aductor. Este bloque no se saltea: es el que hace que el aumento de kilómetros no termine en una molestia.", "items": [{"id": "d-x-e1", "t": "Weighted GHD Hip Extension", "d": "15 reps", "tipo": "car", "peso": 10, "reps": 15}, {"id": "d-x-e2", "t": "Copenhagen Plank", "d": "10/10 × 3 sets", "tipo": "chk"}, {"id": "d-x-e3", "t": "3 sets completos", "d": "marcar al terminar", "tipo": "chk"}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "El número de isquios de acá abajo decide el jueves: si sale en 6 o más, el trote de mañana se queda en 12' y el bloque sin impacto sube a 30'.", "items": [{"id": "d-x-z1", "t": "Isquios al terminar", "d": "0 = frescos · 10 = cargados", "tipo": "rep", "reps": 5}, {"id": "d-x-z2", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 1}]}]}, {"dia": "Jue", "num": "3", "titulo": "Z2 + Trote · sesión de carrera", "sub": "PROPIA · 50' · semana 2 de 7 al 10K", "mes": "septiembre", "secciones": [{"nombre": "Cómo armé este día", "pres": "El día más importante de la semana", "nota": "CRITERIO DEL JUEVES: esta es la sesión que define si llegás al 10K, y por eso es el único día donde no hay nada pesado antes. Ni squat, ni deadlift, ni pliometría.\n\nLA PROGRESIÓN: la semana pasada fueron 30' de remo + 12' de trote, y salió a 6:52/km sin molestias. Esta semana el trote sube a 15-18' y el bloque sin impacto baja a 25'. Es la regla que voy a seguir las siete semanas: el tiempo de impacto sube de a 3-4 minutos por semana y el tiempo sin impacto baja para compensar, así el total cardiovascular se mantiene mientras el tejido se adapta de a poco.\n\nSi el gemelo dio problema el lunes o el martes, o los isquios del miércoles cerraron en 6 o más: el trote se queda en 12' y no sube. Perder una semana de progresión no cuesta nada; perder tres semanas por una molestia sí.", "items": [{"id": "d-j-x1", "t": "Leído antes de entrenar", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "08:00", "pres": "Movilidad de tobillo y gemelo", "nota": "Esto es específico para el gemelo derecho. No lo saltees hoy.", "items": [{"id": "d-j-w1", "t": "Ankle dorsiflexion contra la pared", "d": "10/10", "tipo": "chk"}, {"id": "d-j-w2", "t": "Calf raise lento (3\" arriba, 3\" abajo)", "d": "15/15", "tipo": "chk"}, {"id": "d-j-w3", "t": "Leg swings adelante y al costado", "d": "10/10 cada dirección", "tipo": "chk"}, {"id": "d-j-w4", "t": "Caminata en punta de pie", "d": "30 metros", "tipo": "chk"}]}, {"nombre": "Bloque sin impacto", "dur": "25:00", "pres": "Remo, bici o ski · Zona 2", "nota": "25' continuos, sin bajar del rango. Tu referencia de remo es 2:40/500 m en Z2 — si el pulsómetro no está, ese ritmo es el ancla.\n\nEs aeróbico puro: nada de sprints, nada de intervalos. El pulso lo tenés arriba en el panel de zona 2 según tu edad.", "items": [{"id": "d-j-b1", "t": "Tiempo", "d": "objetivo 25'", "tipo": "tim", "seg": 1500}, {"id": "d-j-b2", "t": "Esfuerzo", "d": "0 = fácil · 10 = duro", "tipo": "rep", "reps": 4}]}, {"nombre": "Trote", "dur": "18:00", "pres": "15-18' continuos · el bloque que sube", "nota": "Continuo, no por intervalos. Ritmo conversado: 6:50-7:10/km está perfecto — no busques bajar el ritmo esta semana, el objetivo es el tiempo en los pies.\n\nREGLA DE CORTE: si aparece una molestia de 3 o más en el gemelo, parás en ese momento. No hay versión de esto donde terminarlo valga la pena.\n\nAnotá tiempo y distancia: de ahí sale el ritmo real y con eso ajusto la semana que viene.", "items": [{"id": "d-j-t1", "t": "Tiempo trotado", "d": "objetivo 15-18'", "tipo": "tim", "seg": 1000}, {"id": "d-j-t2", "t": "Distancia trotada", "d": "km", "tipo": "dist", "km": 2.6}, {"id": "d-j-t3", "t": "Molestia durante el trote", "d": "0-10 · si pasa de 2, cortar", "tipo": "rep", "reps": 0}]}, {"nombre": "Torso", "dur": "09:00", "pres": "3 sets · nada de pierna", "nota": "Lo único de fuerza del día, y es todo de la cintura para arriba. Va después de correr, no antes.", "items": [{"id": "d-j-g1", "t": "Strict pull ups", "d": "reps por set", "tipo": "rep", "reps": 6}, {"id": "d-j-g2", "t": "Push ups", "d": "12 reps × 3 sets", "tipo": "chk"}, {"id": "d-j-g3", "t": "Hollow hold 30\"", "d": "3 sets", "tipo": "chk"}]}, {"nombre": "Cierre", "pres": "Post sesión", "nota": "Estiramiento de gemelo y sóleo, 60\" por lado. Dos minutos hoy te ahorran tres semanas después.", "items": [{"id": "d-j-z1", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}, {"id": "d-j-z2", "t": "Gemelo al terminar", "d": "0-10", "tipo": "rep", "reps": 1}]}]}, {"dia": "Vie", "num": "4", "titulo": "Front Squat + Leaderboard", "sub": "PROPIA · 57' · cierre de semana", "mes": "septiembre", "secciones": [{"nombre": "Cómo armé este día", "pres": "Sin plani del coach", "nota": "CRITERIO DEL VIERNES: el viernes es el día de test — así lo usa el box con el leaderboard y así lo dejo. Es el único día de la semana que te dice si algo mejoró.\n\nPIERNA: front squat, no back squat. El lunes ya hiciste back squat al 85% y el miércoles deadlift al 80%; un tercer día de cadena posterior pesada en cinco días es demasiado con la carrera arriba. El front squat carga menos lumbar, cuida la posición de recepción del clean y del snatch, y te deja el sábado disponible para el rodaje largo.\n\nSin fútbol, así que no hay taper: el día va completo.\n\nEl leaderboard de abajo es la versión medible de lo que ya hiciste el viernes 28 — misma estructura, con el gemelo protegido.", "items": [{"id": "d-v-x1", "t": "Leído antes de entrenar", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Warm up", "dur": "06:00", "pres": "2 rounds", "items": [{"id": "d-v-w1", "t": "Front rack con barra + squat hold", "d": "30 segundos", "tipo": "chk"}, {"id": "d-v-w2", "t": "Cossack squat", "d": "8/8", "tipo": "chk"}, {"id": "d-v-w3", "t": "Shoulders global", "d": "10 reps", "tipo": "chk"}, {"id": "d-v-w4", "t": "Air squat con pausa abajo", "d": "10 reps", "tipo": "chk"}]}, {"nombre": "Weightlifting · Snatch liviano", "dur": "06:00", "pres": "Cada 2' × 3 sets · 60-70% Snatch", "nota": "1 power snatch + 1 overhead squat.\n\nLiviano a propósito: el lunes ya trabajaste snatch hasta el 80%. Esto es para mantener el patrón fresco antes del front squat, no para cargar.", "items": [{"id": "d-v-a1", "t": "Set 1", "d": "60% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.6, "reps": 2}, {"id": "d-v-a2", "t": "Set 2", "d": "65% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.65, "reps": 2}, {"id": "d-v-a3", "t": "Set 3", "d": "70% del 1RM Snatch", "tipo": "car", "lift": "snatch", "pct": 0.7, "reps": 2}]}, {"nombre": "Fuerza · Front Squat", "dur": "12:00", "pres": "Cada 2'30\" × 4 sets · 3 reps · RPE 7.5-8", "nota": "70-82% del 1RM de front squat.\n\nCodos arriba en las tres reps. El set donde el codo empieza a caer es tu tope real, no el que dice el porcentaje. Anotá el peso del último set bueno.", "items": [{"id": "d-v-f1", "t": "Set 1", "d": "3 reps · 70%", "tipo": "car", "lift": "frontsq", "pct": 0.7, "reps": 3}, {"id": "d-v-f2", "t": "Set 2", "d": "3 reps · 74%", "tipo": "car", "lift": "frontsq", "pct": 0.74, "reps": 3}, {"id": "d-v-f3", "t": "Set 3", "d": "3 reps · 78%", "tipo": "car", "lift": "frontsq", "pct": 0.78, "reps": 3}, {"id": "d-v-f4", "t": "Set 4", "d": "3 reps · 82%", "tipo": "car", "lift": "frontsq", "pct": 0.82, "reps": 3}]}, {"nombre": "Leaderboard", "dur": "18:00", "pres": "3 sets · 5' de trabajo, 1' de descanso · 60 kg", "nota": "En cada set de 5': 12 cal bike + 12 T2B + máximo de clean and jerk con 60 kg en el tiempo que sobre.\n\nPOR QUÉ ESTE: es exactamente lo que hiciste el viernes 28, con dos cambios. Los T2B bajan de 15 a 12 (45 reps te dejó el abdomen al límite y quiero que la barra sea el limitante, no el core), y el clean and jerk queda en 60 kg — el mismo peso, así los números se comparan directo.\n\nTU MARCA A BATIR: 10 · 8 · 11, total 29 reps.\n\nEl aviso del gemelo apareció justo acá, en la rep 10 del set 3. Si vuelve a aparecer, el set se termina donde está: 29 es un buen número y no vale una lesión.", "items": [{"id": "d-v-c1", "t": "Set 1 · clean and jerk", "d": "reps con 60 kg", "tipo": "car", "peso": 60, "reps": 10}, {"id": "d-v-c2", "t": "Set 2 · clean and jerk", "d": "reps con 60 kg", "tipo": "car", "peso": 60, "reps": 8}, {"id": "d-v-c3", "t": "Set 3 · clean and jerk", "d": "reps con 60 kg", "tipo": "car", "peso": 60, "reps": 11}, {"id": "d-v-c4", "t": "Gemelo derecho durante el WOD", "d": "0-10", "tipo": "rep", "reps": 0}]}, {"nombre": "Accesorio", "dur": "06:00", "pres": "3 sets · liviano", "nota": "Dorsal y hombro, por calidad.", "items": [{"id": "d-v-e1", "t": "Three point DB row", "d": "10/10", "tipo": "car", "peso": 22.5, "reps": 10}, {"id": "d-v-e2", "t": "YTW", "d": "8 reps × 3 sets", "tipo": "chk"}, {"id": "d-v-e3", "t": "3 sets completos", "d": "marcar al terminar", "tipo": "chk"}]}, {"nombre": "Cierre de semana", "pres": "Post sesión", "nota": "Con esto cierra la primera semana escrita sin el coach. Lo que necesito de vuelta son tres cosas: los kilos reales que movieron los bloques de fuerza, el total del leaderboard, y cómo se portó el gemelo los cinco días.\n\nCon eso escribo la semana del 7 mejor que esta. Es así como la cosa se vuelve independiente: no porque el plan salga perfecto la primera vez, sino porque cada semana usa los datos de la anterior.", "items": [{"id": "d-v-z1", "t": "Total del leaderboard", "d": "reps · marca previa 29", "tipo": "rep", "reps": 29}, {"id": "d-v-z2", "t": "Piernas al terminar la semana", "d": "0 = frescas · 10 = fundidas", "tipo": "rep", "reps": 5}, {"id": "d-v-z3", "t": "Gemelo derecho · resumen de la semana", "d": "0 = nunca apareció · 10 = todos los días", "tipo": "rep", "reps": 1}]}]}, {"dia": "Sáb", "num": "5", "titulo": "Box + rodaje largo", "sub": "Pendiente · doble sesión", "mes": "septiembre", "secciones": [{"nombre": "Sin plani todavía", "pres": "Pendiente", "nota": "El sábado pasado la doble sesión no pasó: no fuiste al box y corriste 30' a la siesta. Eso está bien — la corrida es la que no se negocia.\n\nEste sábado el rodaje sube a 35-40' si la semana viene limpia. Si vas al box, la corrida va cuatro o cinco horas después, no pegada.", "items": [{"id": "d-s-r1", "t": "Tiempo de rodaje", "d": "objetivo 35-40'", "tipo": "tim", "seg": 2100}, {"id": "d-s-r2", "t": "Distancia", "d": "km", "tipo": "dist", "km": 5.5}, {"id": "d-s-r3", "t": "Sensación", "d": "0 = fácil · 10 = duro", "tipo": "rep", "reps": 5}]}]}, {"dia": "Dom", "num": "6", "titulo": "Descanso", "sub": "Libre", "mes": "septiembre", "secciones": [{"nombre": "Descanso", "pres": "Sin plan", "nota": "Si la corrida del sábado no salió, va acá. Si salió, caminata de 30' y nada más.", "items": [{"id": "d-d-z1", "t": "Cómo te levantaste", "d": "0 = entero · 10 = roto", "tipo": "rep", "reps": 3}, {"id": "d-d-z2", "t": "Caminata 30'", "d": "opcional", "tipo": "chk"}]}]}], "label": "31 ago–5 sep", "nombre": "semana 31 de agosto al 5 de septiembre", "obj": ""}, {"s": 5, "dias": [{"dia": "Lun", "num": "7", "titulo": "Prueba del gimnasio + Fuerza", "sub": "Híbrido · semana 1 de 5", "mes": "septiembre", "obj": "Medir qué hay en el gimnasio y dejar una referencia de fuerza de pierna.", "secciones": [{"nombre": "El esquema original · reemplazado el 9/9", "pres": "Histórico · el vigente está en el Mié 9", "nota": "OJO: ESTE ERA EL PLAN DEL LUNES. Se reescribió el miércoles 9 después de tus sensaciones — la corrida de ritmo pasó al miércoles, el crossfit al jueves, las zancadas se cayeron y la pierna se partió en tres días. EL MAPA VIGENTE ESTÁ EN EL MIÉ 9, sección \"Lo que pasó y qué cambio\". Esto queda solo como registro de lo que se había escrito.\n\n———\n\nARRANCA EL HÍBRIDO. Seis días: fuerza de gimnasio, dos corridas y fútbol el sábado.\n\nLA SEMANA:\nLun — Fuerza de tren inferior (squat, RDL, zancadas, oly)\nMar — Tracción a la tarde + CORRIDA DE RITMO a la noche ← la clave\nMié — Crossfit propio (lo escribo yo)\nJue — Empuje a la tarde + corrida larga 7-8 km a la noche\nVie — Torso pesado (press con % de bench) + las zancadas\nSáb — Torso corto a la mañana + fútbol al mediodía\nDom — Descanso\n\nEL TREN SUPERIOR VA REPARTIDO EN CUATRO DÍAS, no en dos: martes tracción liviana, jueves empuje moderado, viernes el pesado, sábado corto. Para masa magra la frecuencia rinde más que el volumen por sesión, y el torso no interfiere con correr — la interferencia real es pierna pesada contra carrera.\n\nLa pierna, en cambio, va concentrada: fuerte el lunes, las zancadas el viernes, y nada más. Los días de corrida no tocan pierna con peso.\n\nLO DEL CROSSFIT, RESUELTO: las clases del lugar son solo martes y jueves a las 18, y esos son justo tus dos días de corrida. El martes es la sesión que no se mueve, y el jueves la larga más una clase a las 18 es doble sesión en el día de más volumen. Así que el miércoles lo escribo yo, con la misma estructura de una hora y un WOD distinto cada semana.\n\nDespués del 11/10 se resuelve solo: cuando correr baje a una vez por semana, martes o jueves a las 18 queda libre y tomás clase.\n\nEL OBJETIVO: bajar de 55 minutos el 11/10. Eso es 5:30/km sostenido. Tu 5 km salió a 5:17, así que el ritmo está: lo que falta es sostenerlo el doble de tiempo. Todo el bloque de martes apunta a eso.", "items": [{"id": "e-l-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Las 5 semanas de carrera", "pres": "El mapa · corregido el 10/9 con tus tiempos", "nota": "Dos salidas por semana, martes y jueves. LA SEMANA DEL 8/9 FUE LA EXCEPCIÓN: el martes no se corrió, el ritmo salió el miércoles y la segunda corrida el viernes como bici y trote. Desde el 15/9 cada sesión vuelve a su día y no se mueve más.\n\nEL MAPA CAMBIÓ el 10/9. La versión del lunes estaba escrita antes de tener un solo dato tuyo de ritmo y apuntaba todo a 5:30. Sostuviste 5:23 de media a RPE 6, así que 5:30 ya no es un objetivo, es tu ritmo cómodo — el bloque sube.\n\nMARTES (ritmo) — es la que progresa:\nSem 1 · 4 × 1000 a 5:20 · HECHA: 5:21 · 5:24 · 5:25 · 5:07\nSem 2 (15/9) · 5 × 1000 a 5:15, trote 90\"\nSem 3 (22/9) · 3 × 2000 a 5:25, trote 3'\nSem 4 (29/9) · 2 × 3000 a 5:25, trote 4' ← la que te da el tiempo final\nSem 5 (6/10) · 4 × 800 a 5:10 (afinado)\n\nJUEVES (larga) — no progresa, se mantiene:\n8 km a 6:20-6:40 las semanas 2, 3 y 4. Semana 5, 5 km flojos.\n\nDOMINGO 11/10 — la carrera.\n\nNo hay progresión de distancia porque no la necesitás: ya corriste 21 km y venís corriendo todo el año. El tope de 8 km es a propósito. Lo que no tenés es tiempo sostenido a ritmo, y eso es exactamente lo que entrena el martes.", "items": [{"id": "e-l-x2", "t": "Mapa leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Hoy: probar el lugar", "pres": "Antes de entrenar · 5 cosas", "nota": "Marcá lo que encuentres. De esto depende cómo escribo los tres días de fuerza de la semana que viene — si no hay rack, el plan es otro.", "items": [{"id": "e-l-g1", "t": "Squat rack o jaula", "d": "¿hay?", "tipo": "chk"}, {"id": "e-l-g2", "t": "Tope de discos disponible", "d": "kg totales en barra", "tipo": "rep", "reps": 180}, {"id": "e-l-g3", "t": "Mancuerna más pesada", "d": "kg", "tipo": "rep", "reps": 40}, {"id": "e-l-g4", "t": "Remo / bici / cinta", "d": "¿hay cardio interno?", "tipo": "chk"}, {"id": "e-l-g5", "t": "Horarios de las clases de crossfit", "d": "anotados", "tipo": "chk"}]}, {"nombre": "Lo que hiciste · registrado", "pres": "Sesión real del 7/9 · 1 hora justa", "nota": "BACK SQUAT — 100×4 · 100×6 · 110×6 · 110×6\nDOUBLE DB LUNGE — 3 × 20 (10/10), mancuernas de 15 kg\nRDL — 60 · 80 · 100 × 8, todas fáciles\nOLY — complejo (clean pull + hang power clean + hang squat clean): 50 · 60 · 70 · 75, todas fáciles\nGEMELOS — 3 × 15 con 75 kg totales\n\nLO BUENO: te autocorregiste bien en el squat. Estaba escrito 4×6 hasta RPE 8 y viste que 100 era liviano, así que subiste a 110 y ahí sí quedó. Ese es exactamente el criterio que quiero que uses.\n\nLO QUE APRENDÍ: los 1RM que tenía cargados estaban bajos. Ya están tus números (snatch 80 · clean 105 · back squat 140 · front squat 125 · deadlift 160 · bench 110), y cierran bien: 110 × 6 es el 78% de 140, que para 6 reps es justo lo que se siente cómodo-pero-no-fácil.\n\nOJO CON ESTO: son estimaciones y hace mucho que no testeás. Así que el kilo que te muestra la app es una SUGERENCIA de arranque, no una orden — el que manda es el RPE. Si el set sale liviano, subís y lo anotás, como hiciste hoy. No vamos a testear 1RM antes del 11/10 (singles máximos con la carrera encima no van); después de la carrera sí, con una semana de test en serio.\n\nLO QUE SOBRÓ: RDL y oly quedaron livianos (dijiste 'easy' en las dos). No es un error tuyo, es que yo los calibré bajo. La semana que viene el RDL arranca en 90 y el complejo en 65.\n\nLAS ZANCADAS: 10/10 son 10 POR PIERNA, o sea 20 por serie. Lo leíste bien, y las 3 series estaban bien. Como el glúteo trabajó bien, la dosis queda igual.\n\nCONVENCIÓN, PARA QUE NO HAYA DUDA: una barra siempre significa por lado. 10/10 = 10 por pierna. Si escribo '20 reps' sin barra, son 20 en total. En el remo a un brazo, 6/6 = 6 por brazo.\n\nLO ÚNICO QUE CAMBIO ES EL DÍA: 60 zancadas 24 horas antes de la sesión de ritmo es mala ubicación, no mala dosis — es el ejercicio que más agujetas deja a 24-48 hs y mañana son 4 × 1000 a 5:20. La semana que viene van al viernes, con las mismas 3 × 20.\n\nPARA MAÑANA: fijate en el calentamiento. Si el primer tramo a 5:20 te cuesta como si fuera 5:40, hacé tres en vez de cuatro y no pasa nada.", "items": [{"id": "e-l-r1", "t": "Sesión registrada", "d": "leído", "tipo": "chk"}]}, {"nombre": "Cómo estaba escrito", "dur": "45:00", "pres": "Referencia", "nota": "No escribo los ejercicios todavía porque no sé qué hay. Para hoy, si el lugar tiene rack y barra, hacé esto y con eso alcanza para medir:\n\n· Back squat — 4 × 6, subiendo hasta RPE 8. Tu referencia es 112 × 3, así que 4 × 6 debería caer entre 95 y 105.\n· Peso muerto rumano — 3 × 8, moderado.\n· Zancadas caminando — 3 × 10/10, con mancuernas livianas.\n· Gemelo de pie — 3 × 15, lento en la bajada.\n\nEl gemelo va al final y no es opcional: corriste 5 km a 5:17 con el gemelo en cero y lo quiero mantener así hasta el 11/10.\n\nSi el lugar es de máquinas nomás, hacé prensa, extensión, femoral y gemelo con el mismo esquema de series y anotalo. Con lo que registres hoy escribo la semana 2 en serio.", "items": [{"id": "e-l-f1", "t": "Back squat (o prensa) · 4 × 6", "d": "kg del set más pesado", "tipo": "car", "peso": 100, "reps": 6}, {"id": "e-l-f2", "t": "Peso muerto rumano 3 × 8", "d": "hecho", "tipo": "chk"}, {"id": "e-l-f3", "t": "Zancadas 3 × 10/10", "d": "hecho", "tipo": "chk"}, {"id": "e-l-f4", "t": "Gemelo de pie 3 × 15", "d": "no saltear", "tipo": "chk"}, {"id": "e-l-f5", "t": "Qué te pareció el lugar", "d": "0 = malo · 10 = excelente", "tipo": "rep", "reps": 7}]}]}, {"dia": "Mar", "num": "8", "titulo": "Torso + Ritmo · 4 × 1000", "sub": "Doble · torso a la tarde, ritmo a la noche", "mes": "septiembre", "obj": "Tracción a la tarde, y a la noche los cuatro tramos entre 5:15 y 5:25 — el cuarto igual que el segundo.", "secciones": [{"nombre": "Por qué esta sesión", "pres": "Semana 1 de 5", "nota": "Es la única sesión del plan que no se negocia ni se mueve. Todo lo demás puede correrse un día; esta no.\n\nEL PUNTO: tenés ritmo (5:17 en 5 km) pero no tenés tiempo sostenido a ritmo. Cortar el trabajo en cuatro tramos de 1000 m te deja acumular 4 km a un ritmo que todavía no podrías sostener seguido — y en cinco semanas eso se convierte en sostenerlo.\n\nA 5:20 el kilómetro, cada tramo son 5 minutos y 20 segundos. Si el primero sale mucho más rápido, salió mal: la idea es que los cuatro salgan iguales.\n\nEL DÍA VA EN DOS PARTES: tren superior en el gimnasio a la tarde, merienda, y el trote a la noche. Buen orden — el torso no toca pierna, así que corrés con las piernas frescas y a temperatura más baja.\n\nUNA REGLA: 90 minutos entre la merienda y el trote. Si salís antes con yogur y fruta encima, te agarra flato en el segundo tramo.", "items": [{"id": "e-m-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "SESIÓN 1 · Tren superior · TRACCIÓN", "dur": "22:00", "pres": "A la tarde, en el gimnasio", "nota": "POR QUÉ ACÁ: el tren superior no interfiere con correr. La interferencia real es entre pierna pesada y carrera, no entre press y carrera. Así que los días de corrida son lugar libre para el torso, y eso te da cuatro estímulos de tren superior por semana en vez de dos — que para masa magra rinde más que dos sesiones largas.\n\nPOR QUÉ TRACCIÓN Y NO EMPUJE: entre el miércoles (push jerk + 45 push press), el viernes y el sábado ya tenés tres días de hombro. Sumar empuje acá serían cinco y se funde. Tracción es lo que casi todos entrenan de menos, y es lo que sostiene la postura al correr.\n\nESTE BLOQUE VA PRIMERO, A LA TARDE. Nada de pierna acá, así que llegás al trote de la noche con las piernas enteras. Son 22 minutos, no una sesión larga: dejá algo en el tanque.", "items": [{"id": "e-m-t1", "t": "Dominadas · 4 sets", "d": "reps por set · lastradas si salen 10+", "tipo": "rep", "reps": 8}, {"id": "e-m-t2", "t": "Remo con barra · 4 × 8", "d": "kg", "tipo": "car", "peso": 60, "reps": 8}, {"id": "e-m-t3", "t": "Curl con mancuernas", "d": "12 reps × 3 sets", "tipo": "chk"}, {"id": "e-m-t4", "t": "Face pull o pájaros", "d": "15 reps × 3 sets", "tipo": "chk"}, {"id": "e-m-t5", "t": "Hombro al terminar", "d": "0 = bien · 10 = cargado", "tipo": "rep", "reps": 3}]}, {"nombre": "SESIÓN 2 · NO SE HIZO · movida al miércoles", "dur": "12:00", "pres": "Bien decidido", "nota": "No se corrió: piernas cansadas del lunes. Decisión correcta y no hace falta discutirla — correr 4 × 1000 a 5:20 con las piernas del lunes encima sale mal y encima ensucia el dato.\n\nLa sesión se movió entera al miércoles 9. El error fue de programación, no tuyo: está explicado arriba de todo en el miércoles.", "items": [{"id": "e-m-w1", "t": "Trote suave", "d": "10-12' bien flojo", "tipo": "tim", "seg": 660}, {"id": "e-m-w2", "t": "Leg swings adelante y al costado", "d": "10/10", "tipo": "chk"}, {"id": "e-m-w3", "t": "3 aceleraciones de 60 m", "d": "progresivas, sin sprint", "tipo": "chk"}]}, {"nombre": "SESIÓN 2 · Serie principal", "dur": "22:00", "pres": "4 × 1000 m a 5:20 · trote 90\"", "nota": "Cuatro tramos de 1000 m. Objetivo 5:20 cada uno (rango bueno: 5:15 a 5:25).\n\nEntre tramo y tramo, 90 segundos de trote muy flojo. Trote, no caminata — mantener las piernas en movimiento es parte del estímulo.\n\nCÓMO LEER LA SESIÓN: si los cuatro salen entre 5:15 y 5:25 y el último no te costó más que el segundo, el sub-55 del 11/10 está bien encaminado. Si el cuarto se te va a 5:40, el ritmo objetivo es 5:35 y no 5:20, y ajusto el resto del bloque.\n\nAnotá los cuatro tiempos. Son el dato con el que escribo la semana que viene.", "items": [{"id": "e-m-s1", "t": "Tramo 1", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-m-s2", "t": "Tramo 2", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-m-s3", "t": "Tramo 3", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-m-s4", "t": "Tramo 4", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-m-s5", "t": "Cuánto costó el último", "d": "0 = fácil · 10 = al límite", "tipo": "rep", "reps": 7}]}, {"nombre": "Vuelta a la calma", "dur": "10:00", "pres": "Sin apuro", "items": [{"id": "e-m-z1", "t": "Trote flojo", "d": "8-10'", "tipo": "tim", "seg": 540}, {"id": "e-m-z2", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}, {"id": "e-m-z3", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 0}]}]}, {"dia": "Mié", "num": "9", "titulo": "Empuje + Ritmo · 4 × 1000", "sub": "Doble · la sesión del martes, hoy", "mes": "septiembre", "obj": "Recuperar la sesión de ritmo con las piernas descansadas. Cuatro tramos entre 5:15 y 5:25, el cuarto igual que el segundo.", "secciones": [{"nombre": "Lo que pasó y qué cambio", "pres": "Leer antes de entrenar", "nota": "EL ERROR FUE MÍO. Metí 4 × 6 de back squat + 60 zancadas + RDL + gemelo en un mismo día, o sea el volumen de pierna de una sesión de hipertrofia, y lo puse 24 horas antes de la única sesión que no se negocia. Vos entrenaste bien el lunes; el problema era el calendario.\n\nNO CORRER ESTUVO BIEN. Un martes flojo no arruina nada, un martes corrido con las piernas rotas sí: sale lento, te deja peor y encima el dato no sirve para calibrar el ritmo del 11/10. Preservar y pasarme la sensación es exactamente lo que necesito.\n\nCÓMO QUEDA LA SEMANA:\nMié 9 — empuje corto a la tarde + 4 × 1000 a la noche (la del martes)\nJue 10 — crossfit propio, 60' (excepción: su día es el miércoles)\nVie 11 — torso pesado a la tarde + bici Z2 y trote corto a la noche\nSáb 12 — torso corto AM + fútbol\nDom 13 — descanso\n\nESTA SEMANA NO HAY MÁS PIERNA. Ya tuvo su dosis el lunes, y de sobra. Las zancadas que estaban el viernes se caen; vuelven la semana que viene con el esquema nuevo.", "items": [{"id": "e-w-x1", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "La pierna se parte en tres", "pres": "Cambio fijo desde la semana 2", "nota": "Tenías razón: un solo día de pierna fuerte es demasiado en un plan con dos corridas. Se reparte en tres dosis chicas.\n\nLUNES · bilateral pesado y CORTO (~20' de pierna)\nBack squat 4 × 5 pesado + gemelo. Nada más. El squat a pocas reps casi no deja agujetas: el daño muscular viene del volumen y de lo excéntrico, no del kilo. Por eso lo pesado puede quedar 24 h antes de correr.\n\nMIÉRCOLES · pierna técnica y liviana, dentro del crossfit (~15')\nComplex de clean, con el front squat adentro. Poco volumen, mucha posición.\n\nVIERNES · el día excéntrico (~20')\nZancadas, RDL, hip thrust, gemelo lento. Todo lo que deja agujetas va acá: 48 horas después del ritmo del martes, y lo único que viene después es el partido del sábado.\n\nEL TOTAL SEMANAL DE PIERNA NO BAJA — se reparte. Tres estímulos por semana rinden más para masa magra que uno grande, y ninguno le pega a una corrida.\n\nDÓNDE VIVE EL CROSSFIT: los miércoles, desde el 15/9 y hasta la carrera. Esta semana fue la excepción — el ritmo se comió el miércoles, así que el crossfit pasó al jueves 10. Desde el 15 la semana queda: lunes fuerza de pierna, martes ritmo, miércoles crossfit, jueves larga, viernes torso pesado más el bloque excéntrico, sábado fútbol.\n\nLA REGLA QUE ORDENA TODO: excéntrico y unilateral nunca dentro de las 24 h previas a correr. Pesado bilateral sí puede.\n\nESTO VALE HASTA EL 11/10. Después, con dos días de crossfit, la pierna se reparte distinto y está en el plan estratégico.", "items": [{"id": "e-w-x2", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "Los 50 minutos", "pres": "Lo del tiempo, resuelto", "nota": "Anotaste 48' el martes con todo incluido, y te dan 60-75'. Bien el dato — sin eso yo sigo escribiendo sesiones cortas.\n\nQUÉ HAGO CON ESO: los días de torso pasan de 4-5 ejercicios a 6-7, y sumo un bloque de core o de carry al final. La sesión de tracción del martes, por ejemplo, ya la tenías resuelta sola: le agregaste polea al pecho 47-53-59-65 en pirámide, que es exactamente el ejercicio que faltaba. A partir de ahora va escrito.\n\nHOY Y EL SÁBADO SON PRUEBA. Anotá los minutos en el campo del final de cada bloque y si te quedó sabor a poco decímelo: sumar es fácil, lo que no quiero es inflar la sesión antes de tener el dato.\n\nQUÉ NO HAGO: no lleno la hora en los días dobles. Hoy y el viernes son torso + corrida, y ahí la parte de gimnasio se queda en 25-30 minutos a propósito — lo que sobra del tiempo se lo lleva la corrida.", "items": [{"id": "e-w-x3", "t": "Leído", "d": "marcar", "tipo": "chk"}]}, {"nombre": "SESIÓN 1 · Tren superior · EMPUJE", "dur": "28:00", "pres": "A la tarde · corto, la corrida manda", "nota": "Empuje moderado, series de 10-12 con margen. El día pesado de press es el viernes; acá el objetivo es frecuencia y llegar entero a la noche.\n\nCERO PIERNA. Ni sentadilla de calentamiento.\n\nSi algo tiene que salir por tiempo, sacá los laterales, nunca el press.", "items": [{"id": "e-j-g1", "t": "DB Bench Press · 4 × 10", "d": "kg por mancuerna", "tipo": "car", "peso": 25, "reps": 10}, {"id": "e-w-g2", "t": "Press militar de pie · 3 × 10", "d": "kg de la barra", "tipo": "car", "peso": 35, "reps": 10}, {"id": "e-j-g2", "t": "Elevaciones laterales", "d": "15 reps × 3 sets", "tipo": "chk"}, {"id": "e-j-g3", "t": "Fondos o press francés", "d": "12 reps × 3 sets", "tipo": "chk"}, {"id": "e-w-g5", "t": "Face pull", "d": "15 reps × 3 sets", "tipo": "chk"}, {"id": "e-j-g4", "t": "Hollow hold 40\"", "d": "3 sets", "tipo": "chk"}, {"id": "e-w-g6", "t": "Hombro al terminar", "d": "0 = bien · 10 = cargado", "tipo": "rep", "reps": 3}, {"id": "e-w-g7", "t": "Cuánto duró el bloque", "d": "minutos · con calentamiento y descansos", "tipo": "rep", "reps": 28}]}, {"nombre": "Cinta o calle", "pres": "Hay cinta en el gimnasio", "nota": "HOY LA CINTA CONVIENE. Tu riesgo número uno en esta sesión es salir a 5:05 el primer tramo y terminar a 5:45; la cinta te lo hace imposible y te enseña qué se siente 5:20 sostenido.\n\nPONELA AL 1% DE INCLINACIÓN. Sin viento en contra, la cinta a 0% es más fácil que la calle y el ritmo te queda inflado — el 1% empareja las dos cosas y hace que el dato sirva para calibrar el 11/10.\n\nDESDE LA SEMANA 3 EL RITMO VUELVE A LA CALLE. El día de la carrera nadie te fija la cinta: tenés que sostener 5:30 por sensación, y eso solo se entrena afuera. La cinta queda para clima malo, o para cuando quiera que un ritmo salga exacto sí o sí.\n\nLA LARGA SIEMPRE AFUERA. Ahí lo que se entrena es tiempo en los pies sobre terreno real.\n\nEQUIVALENCIAS EN KM/H:\n5:20/km = 11,3\n5:25/km = 11,1\n5:30/km = 10,9\n6:20/km = 9,5\n6:40/km = 9,0\n\nEl trote de recuperación entre tramos, 8,0 km/h (7:30/km).", "items": [{"id": "e-w-c1", "t": "Dónde corriste", "d": "cinta o calle", "tipo": "chk"}, {"id": "e-w-c2", "t": "Inclinación al 1%", "d": "si fue en cinta", "tipo": "chk"}]}, {"nombre": "SESIÓN 2 · Entrada en calor", "dur": "12:00", "pres": "A la noche · no la saltees", "nota": "Las series en frío son la forma más rápida de terminar con el gemelo tirante. Diez minutos acá valen la sesión.\n\n90 minutos entre la merienda y el trote.", "items": [{"id": "e-w-w1", "t": "Trote suave", "d": "10-12' bien flojo", "tipo": "tim", "seg": 660}, {"id": "e-w-w2", "t": "Leg swings adelante y al costado", "d": "10/10", "tipo": "chk"}, {"id": "e-w-w3", "t": "3 aceleraciones de 60 m", "d": "progresivas, sin sprint", "tipo": "chk"}]}, {"nombre": "SESIÓN 2 · Serie principal", "dur": "22:00", "pres": "4 × 1000 m a 5:20 · trote 90\"", "nota": "Cuatro tramos de 1000 m. Objetivo 5:20 cada uno (rango bueno: 5:15 a 5:25).\n\nEntre tramo y tramo, 90 segundos de trote muy flojo. Trote, no caminata.\n\nARRANCÁ CONTENIDO. El primer tramo con las piernas descansadas se va a sentir fácil y ahí es donde se sale a 5:05 y se termina a 5:45. Si los cuatro salen iguales, la sesión salió perfecta aunque el promedio sea 5:25.\n\nCÓMO LA LEO: si los cuatro caen entre 5:15 y 5:25 y el último no costó más que el segundo, el sub-55 está encaminado. Si el cuarto se va a 5:40, el ritmo objetivo real es 5:35 y reescribo el bloque.\n\nSI HOY LAS PIERNAS SIGUEN PESADAS en el calentamiento: hacé 3 × 1000 en vez de 4 y anotalo. No hay que forzar dos veces la misma sesión.", "items": [{"id": "e-w-s1", "t": "Tramo 1", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-w-s2", "t": "Tramo 2", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-w-s3", "t": "Tramo 3", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-w-s4", "t": "Tramo 4", "d": "mm:ss del km", "tipo": "tim", "seg": 320}, {"id": "e-w-s5", "t": "Cuánto costó el último", "d": "0 = fácil · 10 = al límite", "tipo": "rep", "reps": 7}, {"id": "e-w-s6", "t": "Cómo estaban las piernas al empezar", "d": "0 = frescas · 10 = pesadas", "tipo": "rep", "reps": 4}]}, {"nombre": "Vuelta a la calma", "dur": "10:00", "pres": "Sin apuro", "items": [{"id": "e-w-z1", "t": "Trote flojo", "d": "8-10'", "tipo": "tim", "seg": 540}, {"id": "e-w-z2", "t": "Estiramiento gemelo y sóleo", "d": "60\" por lado", "tipo": "chk"}, {"id": "e-w-z3", "t": "Gemelo derecho", "d": "0-10", "tipo": "rep", "reps": 0}]}]}, {"dia": "Jue", "num": "10", "titulo": "Crossfit propio · Clean + Row", "sub": "Escrito por mí · 60' en el gimnasio", "mes": "septiembre", "obj": "Oly + WOD + accesorio. Cero salto: mañana hay press pesado y trote.", "secciones": [{"nombre": "Lo que dio el miércoles", "pres": "Tu 4 × 1000, leído", "nota": "5:21 · 5:24 · 5:25 · 5:07.\n\nLOS TRES PRIMEROS SON EXACTOS. Pediste 5:20 en un rango de 5:15 a 5:25 y clavaste tres seguidos con 4 segundos de dispersión. Eso es control de ritmo, que es justo lo que te faltaba para el 10K.\n\nEL CUARTO A 5:07 ES EL ÚNICO ERROR, y es de los buenos: te sobró. Marcaste el último como duro y el costo en 6/10, o sea que a 5:25 estabas lejos del límite. Pero el objetivo de la sesión era que los cuatro salieran iguales, no que el último volara: 18 segundos de diferencia significa que los tres primeros podían haber sido más rápidos.\n\nEL NÚMERO QUE SACO: si sostenés 5:25 a RPE 6 con las piernas a 5/10, el 10K a 5:25 son 54:10. El sub-55 está adentro, y con margen.\n\nLA SEMANA QUE VIENE SUBE: 5 × 1000 a 5:15, mismo trote de 90\" entre tramos. Un tramo más y 10 segundos más rápido. Y la misma instrucción: los cinco iguales.\n\nEL HOLLOW HOLD SALE. Calambre de abdomen en la segunda serie porque 40 segundos es mucho para un patrón que no venías haciendo. Baja a 3 × 20\" o dead bug 10/10 — mismo trabajo, sin el calambre. Ya lo cambié en los días que quedan.", "items": [{"id": "e-x-x0", "t": "Leíd
