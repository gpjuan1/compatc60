<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#201e1d;--mut:#6c6a66;--line:#e7e4dd;--red:#d6002a;--ok:#1a7f45;--chip:#efece6}
@media(prefers-color-scheme:dark){:root{--bg:#161514;--card:#201e1d;--ink:#f1efe9;--mut:#9a968e;--line:#322f2c;--chip:#2a2825}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.hd b{font-size:16px}
.rm{font-size:11px;color:var(--mut);padding:0 14px 8px;cursor:pointer}
.ciclos{padding:8px 10px 2px}
.cic{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.cic>.ch{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;font-weight:600}
.cic>.ch .ar{color:var(--mut);transition:transform .15s}
.cic.op>.ch .ar{transform:rotate(90deg)}
.weeks{display:none;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.cic.op .weeks{display:flex}
.wk{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.wk.sel{background:var(--red);color:#fff;border-color:var(--red)}
.wkhead{padding:12px 14px 4px}
.wkhead .t{font-weight:700;font-size:17px}
.wkhead .n{color:var(--mut);font-size:12.5px;margin-top:2px}
.obj{margin:8px 14px;padding:9px 11px;background:var(--chip);border-radius:10px;font-size:12.5px;color:var(--mut)}
.days{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px}
