document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle><style>\nhtml,body{height:100%}\nbody{margin:0;background:#f3f2f2;font-family:\"Archivo\",system-ui,sans-serif;-webkit-text-size-adjust:100%}\n.app{min-height:100dvh;display:flex;flex-direction:column;background:#f3f2f2}\n.top{position:sticky;top:0;z-index:5;background:#f3f2f2;border-bottom:2px solid rgba(32,30,29,.4)}\n.dchip{flex:1;padding:11px 0;border:0;border-right:1px solid rgba(32,30,29,.4);background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:center}\n.dchip:last-child{border-right:0}\n.dchip.on{background:#201e1d;color:#f3f2f2}\n.setrow{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:0;padding:15px 18px 15px 0;border-bottom:1px solid rgba(32,30,29,.4);background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit;min-height:56px}\n.setrow:active{background:color-mix(in srgb,#201e1d 8%,transparent)}\n.rowchk{width:52px;min-height:56px;display:grid;place-items:center start;background:transparent;border:0;padding:0 0 0 18px;box-sizing:border-box;cursor:pointer}\n.rowchk:active{background:color-mix(in srgb,#ec3013 12%,transparent)}\n.rowbody{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:8px 0;min-height:44px;text-align:left;font:inherit;color:inherit;cursor:pointer}\n.objbox{padding:14px 18px;background:#201e1d;color:#f3f2f2;border-bottom:2px solid rgba(32,30,29,.4)}\n.objlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(243,242,242,.55);margin-bottom:4px}\n.notatxt{width:100%;min-height:9 ,system-ui,sans-serif;color:#201e1d;cursor:pointer;text-align:left}\n.crbtn:active{background:#ec3013;color:#f3f2f2;border-color:#ec3013}\n.crbtn.on{background:#201e1d;color:#f3f2f2;border-color:#201e1d}\n.crbar{position:sticky;bottom:0;z-index:6;background:#fff2ef;border-top:2px solid rgba(32,30,29,.4);padding:12px 18px}\n.crx{width:44px;height:44px;border:2px solid rgba(32,30,29,.4);background:transparent;font:600 13px \"Archivo\",system-ui,sans-serif;color:#201e1d;cursor:pointer}\n<\u002Fstyle><\u002Fhelmet>\n\n<div class=\"app\">\n  <div class=\"top\">\n    <div style=\"display:flex;border-bottom:1px solid rgba(32,30,29,.4)\">\n      <sc-for list=\"{{ semanasTabs }}\" as=\"w\" hint-placeholder-count=\"2\">\n        <button class=\"{{ w.cls }}\" sc-camel-on-click=\"{{ w.pick }}\">{{ w.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex\">\n      <sc-for list=\"{{ diasSem }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <button class=\"dchip {{ d.cls }}\" sc-camel-on-click=\"{{ d.pick }}\">\n          <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7\">{{ d.dia }}<\u002Fdiv>\n          <div style=\"font:800 17px 'Archivo',system-ui,sans-serif\">{{ d.num }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:14px 18px 12px\">\n      <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#ec3013;margin-bottom:4px\">{{ diaFecha }}<\u002Fdiv>\n      <h2 style=\"font-size:26px;margin:0 0 8px\">{{ diaTit }}<\u002Fh2>\n      <div style=\"display:flex;gap:10px;align-items:center;justify-content:space-between\">\n        <span style=\"font-size:12px;color:rgba(32,30,29,.6)\">{{ diaSubT2 }}<\u002Fspan>\n        <span class=\"tag tag-accent\" style=\"flex:none\">{{ progreso }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1\">\n    <sc-if value=\"{{ esHoy }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ esJueves }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px 18px;background:#fff2ef;border-bottom:1px solid rgba(32,30,29,.4)\">\n          <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(32,30,29,.55);margin-bottom:8px\">Zona 2 según tu edad<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <button class=\"stepsm\" sc-camel-on-click=\"{{ menosEdad }}\">−<\u002Fbutton>\n            <div style=\"font:800 24px 'Archivo',system-ui,sans-serif\">{{ edad }}<\u002Fdiv>\n            <button class=\"stepsm\" sc-camel-on-click=\"{{ masEdad }}\">+<\u002Fbutton>\n            <div style=\"margin-left:auto;text-align:right\">\n              <div style=\"font-size:11px;color:rgba(32,30,29,.55)\">FCM {{ fcm }}<\u002Fdiv>\n              <div style=\"font:800 20px 'Archivo',system-ui,sans-serif;color:#ec3013\">&lt; {{ z2 }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ tieneObjs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"objbox\">\n          <sc-if value=\"{{ tieneObjSem }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"objlbl\">Objetivo de la semana<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.4;font-weight:600;margin-bottom:12px;text-wrap:pretty\">{{ objSem }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ tieneObjDia }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"objlbl\" style=\"color:#ff7a63\">Objetivo de hoy<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.4;font-weight:600;text-wrap:pretty\">{{ objDia }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ secciones }}\" as=\"sec\" hint-placeholder-count=\"4\">\n        <div class=\"sechd\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n            <strong style=\"font-size:15px\">{{ sec.nombre }}<\u002Fstrong>\n            <span style=\"font-size:11px;color:rgba(32,30,29,.55)\">{{ sec.dur }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#ae1800;margin-top:2px\">{{ sec.pres }}<\u002Fdiv>\n          <sc-if value=\"{{ sec.tieneNota }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12px;line-height:1.45;color:rgba(32,30,29,.65);margin-top:6px;text-wrap:pretty;white-space:pre-line\">{{ sec.nota }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <div class=\"setrow\">\n            <button class=\"rowchk\" sc-camel-on-click=\"{{ it.toggle }}\"><span class=\"chk {{ it.chkClass }}\">✓<\u002Fspan><\u002Fbutton>\n            <button class=\"rowbody\" sc-camel-on-click=\"{{ it.abrir }}\">\n              <span>\n                <span style=\"display:block;font-size:15px;font-weight:600\">{{ it.titulo }}<\u002Fspan>\n                <span style=\"display:block;font-size:12px;color:rgba(32,30,29,.55)\">{{ it.detalle }}<\u002Fspan>\n                <sc-if value=\"{{ it.tieneUltima }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"display:block;font-size:11px;color:#ae1800;margin-top:3px\">{{ it.ultima }}<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ it.tieneNota }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"display:block;font-size:11.5px;line-height:1.4;color:rgba(32,30,29,.7);margin-top:5px;padding-left:8px;border-left:2px solid #ec3013;white-space:pre-line\">{{ it.notaPrev }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"font:800 16px 'Archivo',system-ui,sans-serif;color:{{ it.color }}\">{{ it.valor }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ it.abierto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"regbox\">\n              <sc-if value=\"{{ it.tienePaso }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap\">\n                  <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);margin-right:2px\">Disco<\u002Fspan>\n                  <sc-for list=\"{{ pasos }}\" as=\"p\" hint-placeholder-count=\"5\">\n                    <button class=\"{{ p.cls }}\" sc-camel-on-click=\"{{ p.pick }}\">{{ p.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ it.campos }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">\n                  <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);width:74px\">{{ c.label }}<\u002Fspan>\n                  <sc-if value=\"{{ c.dobles }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"stepsm\" style=\"width:48px;font-size:14px\" sc-camel-on-click=\"{{ c.menos10 }}\">−10<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <button class=\"stepsm\" sc-camel-on-click=\"{{ c.menos }}\">−<\u002Fbutton>\n                  <div style=\"flex:1;text-align:center;font:800 34px/1 'Archivo',system-ui,sans-serif\">{{ c.valor }}<\u002Fdiv>\n                  <button class=\"stepsm\" sc-camel-on-click=\"{{ c.mas }}\">+<\u002Fbutton>\n                  <sc-if value=\"{{ c.dobles }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"stepsm\" style=\"width:48px;font-size:14px\" sc-camel-on-click=\"{{ c.mas10 }}\">+10<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin:14px 0\">\n                <sc-for list=\"{{ it.sensaciones }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <button class=\"{{ s.cls }}\" sc-camel-on-click=\"{{ s.pick }}\">{{ s.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin:16px 0 0\">\n                <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);margin-bottom:7px\">Sensaciones de este ejercicio<\u002Fdiv>\n                <textarea class=\"notatxt\" placeholder=\"{{ it.notaPlaceholder }}\" sc-camel-default-value=\"{{ it.nota }}\" sc-camel-on-change=\"{{ it.setNota }}\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary btn-block\" style=\"min-height:52px;font-size:16px;margin-top:14px\" sc-camel-on-click=\"{{ it.guardar }}\">{{ it.guardarLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fsc-for>\n      <div style=\"padding:18px\">\n        <div class=\"field\">\n          <label>Notas de la sesión<\u002Flabel>\n          <textarea class=\"input\" style=\"min-height:110px;font-size:16px\" placeholder=\"Molestias, sensaciones, qué cambiarías…\" value=\"{{ diaNota }}\" sc-camel-on-change=\"{{ setDiaNota }}\"><\u002Ftextarea>\n          <p style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:7px 0 0;color:{{ diaNotaColor }}\">{{ diaNotaEstado }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esMarcas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:16px 18px;border-bottom:2px solid rgba(32,30,29,.4)\">\n        <h3 style=\"margin:0 0 6px\">1RM estimados<\u002Fh3>\n        <p style=\"font-size:13px;margin:0;color:rgba(32,30,29,.65);text-wrap:pretty\">De estos números salen todos los kg de los porcentajes de la plani. Ajustalos cuando un set te quede corto o pesado.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid rgba(32,30,29,.4)\">\n        <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);margin-right:2px\">Disco<\u002Fspan>\n        <sc-for list=\"{{ pasos }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <button class=\"{{ p.cls }}\" sc-camel-on-click=\"{{ p.pick }}\">{{ p.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ lifts }}\" as=\"l\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(32,30,29,.4)\">\n          <span style=\"flex:1\">\n            <span style=\"display:block;font-size:15px;font-weight:600\">{{ l.nombre }}<\u002Fspan>\n            <span style=\"display:block;font-size:11px;color:rgba(32,30,29,.55)\">{{ l.base }}<\u002Fspan>\n          <\u002Fspan>\n          <button class=\"stepsm\" sc-camel-on-click=\"{{ l.menos }}\">−<\u002Fbutton>\n          <span style=\"width:82px;text-align:right;font:800 22px 'Archivo',system-ui,sans-serif\">{{ l.valor }}<\u002Fspan>\n          <button class=\"stepsm\" sc-camel-on-click=\"{{ l.mas }}\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:14px 18px;border-bottom:1px solid rgba(32,30,29,.4)\">\n        <p style=\"font-size:12.5px;line-height:1.45;margin:0 0 10px;color:rgba(32,30,29,.65);text-wrap:pretty\">Tus seis estimaciones. Usalo si te falta el bench press o si querés volver al punto de partida.<\u002Fp>\n        <button class=\"btn btn-secondary btn-block\" style=\"min-height:48px;font-size:15px\" sc-camel-on-click=\"{{ aplicarSugeridos }}\">{{ sugeridosLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-top:2px solid rgba(32,30,29,.4)\">\n        <h3 style=\"margin:0 0 6px\">Pasar los resultados<\u002Fh3>\n        <p style=\"font-size:13px;margin:0 0 12px;color:rgba(32,30,29,.65);text-wrap:pretty\">Copiá esto y pegámelo en el chat. Es todo lo que registraste.<\u002Fp>\n        <button class=\"btn btn-primary btn-block\" style=\"min-height:52px;font-size:16px\" sc-camel-on-click=\"{{ copiar }}\">{{ copiarLabel }}<\u002Fbutton>\n        <pre class=\"input\" style=\"margin-top:12px;max-height:260px;overflow:auto;font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;text-wrap:wrap\">{{ resumenTexto }}<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-top:2px solid rgba(32,30,29,.4)\">\n        <h3 style=\"margin:0 0 6px\">Respaldo de tus datos<\u002Fh3>\n        <p style=\"font-size:13px;margin:0 0 12px;color:rgba(32,30,29,.65);text-wrap:pretty\">Bajá el respaldo antes de cambiar de dirección web o de teléfono. Guarda tus RM, series y registros en un archivo.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <button class=\"btn btn-primary btn-block\" style=\"min-height:52px;font-size:16px\" sc-camel-on-click=\"{{ bajarRespaldo }}\">Bajar respaldo<\u002Fbutton>\n          <button class=\"btn btn-secondary btn-block\" style=\"min-height:52px;font-size:16px\" sc-camel-on-click=\"{{ abrirRestaurar }}\">{{ restaurarLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ restaurando }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;padding:14px;background:#fff2ef;border:1px solid rgba(32,30,29,.4)\">\n            <p style=\"font-size:12.5px;line-height:1.45;margin:0 0 10px;color:rgba(32,30,29,.7);text-wrap:pretty\">Elegí el archivo de respaldo. Reemplaza todo lo que hay ahora en este teléfono.<\u002Fp>\n            <input class=\"input\" type=\"file\" accept=\"application/json,.json\" style=\"font-size:15px;padding:10px\" sc-camel-on-change=\"{{ subirRespaldo }}\">\n            <sc-if value=\"{{ tieneAvisoRest }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:12.5px;font-weight:600;margin:10px 0 0;color:#ae1800\">{{ avisoRest }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:0 18px 18px\">\n        <p style=\"font-size:12px;margin:0;color:rgba(32,30,29,.55);text-wrap:pretty\">Todo lo que registrás queda guardado en este teléfono, atado a la dirección web desde la que abrís la app. Si cambiás de dirección, restaurá el respaldo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div class=\"tabbar\">\n    <button class=\"{{ tabHoyCls }}\" sc-camel-on-click=\"{{ verHoy }}\">Entrenamiento<\u002Fbutton>\n    <button class=\"{{ tabMarcasCls }}\" sc-camel-on-click=\"{{ verMarcas }}\">Marcas<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    done: {a1:true,a2:true,a3:false,a4:false,a5:false,b1:false,b2:false,b3:false},\n    serieN: 3, peso: 62.5, reps: 3, sensacion: \"Justo\", corriendo: false, seg: 154, dia: 0,\n    dia2: 0, done2: {}, reg: {}, abierto: null, edad: 30, paso: 2.5, tab: \"hoy\",\n    copiado: false, semana: 4, restaurando: false, avisoRest: \"\",\n    rms: {snatch:80, clean:105, backsq:140, frontsq:125, dead:160, bench:110},\n    rmsOrigen: {snatch:\"tu estimación\", clean:\"tu estimación\", backsq:\"tu estimación\", frontsq:\"tu estimación\", dead:\"tu estimación\", bench:\"tu estimación\"}\n  };\n  componentDidMount(){\n    this.t = setInterval(()=>{\n      if (this.state.corriendo) this.setState(s=>({seg:s.seg+1}));\n    },1000);\n    try {\n      const raw = localStorage.getItem(\"entrenos-v1\");\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({\n          done2: d.done2 || this.state.done2, reg: d.reg || {},\n          rms: {...this.state.rms, ...(d.rms || {})}, rmsOrigen: {...this.state.rmsOrigen, ...(d.rmsOrigen || {})}, edad: d.edad || this.state.edad,\n          paso: d.paso || this.state.paso,\n          semana: Math.max(d.semana === undefined ? 0 : d.semana, this.semanas().length - 1)\n        });\n      }\n    } catch(e){}\n  }\n  componentDidUpdate(){\n    clearTimeout(this._sv);\n    this._sv = setTimeout(()=>this.guardar(), 400);\n  }\n  guardar(){\n    try {\n      const {done2, reg, rms, rmsOrigen, edad, paso, semana} = this.state;\n      localStorage.setItem(\"entrenos-v1\", JSON.stringify({done2, reg, rms, rmsOrigen, edad, paso, semana}));\n    } catch(e){}\n  }\n  componentWillUnmount(){ clearInterval(this.t); }\n  mmss(n){ return Math.floor(n/60)+\":\"+String(n%60).padStart(2,\"0\"); }\n  serie(id, titulo, detalle, valor){\n    const on = this.state.done[id];\n    return { id, titulo, detalle, valor: on ? valor : \"—\", chkClass: on ? \"on\" : \"\",\n      color: on ? \"#201e1d\" : \"rgba(32,30,29,.35)\",\n      toggle: () => this.setState(s=>({ done: {...s.done, [id]: !s.done[id]} })) };\n  }\n  kg(lift, pct){\n    const rm = this.state.rms[lift] || 0;\n    return Math.round(rm * pct * 2) / 2;\n  }\n  mm(n){ return Math.floor(n/60)+\":\"+String(n%60).padStart(2,\"0\"); }\n  semanas(){\n    if (this._sem) return this._sem;\n    this._sem = [\n      {label:\"10–15 ago\", nombre:\"semana 10 al 15 de agosto\", dias:this.planS1()},\n      {label:\"17–22 ago\", nombre:\"semana 17 al 22 de agosto\", dias:this.planS2()},\n      {label:\"24–29 ago\", nombre:\"semana 24 al 29 de agosto\", dias:this.planS3()},\n      {label:\"31 ago–5 sep\", nombre:\"semana 31 de agosto al 5 de septiembre\", dias:this.planS4()},\n      {label:\"7–13 sep\", nombre:\"híbrido · semana 1 de 5 al 10K\", obj:\"Arrancar el híbrido y calibrar. La corrida de ritmo se movió al miércoles y la pierna pasa a repartirse en tres días.\", dias:this.planS5()},\n      {label:\"14–20 sep\", nombre:\"híbrido · semana 2 de 5 al 10K\", obj:\"Segunda semana del híbrido. Bajar la intensidad por sesión (nada al fallo salvo el press de banca del viernes) y sumar el primer bloque de ritmo con volumen. La pierna se mantiene, no se rompe: llegar fresco a cada corrida. Cero impacto (sin saltos) hasta que el gemelo esté limpio.\", dias:this.planS6()}\n    ];\n    return this._sem;\n  }\n  planS6(){\n    const dis = (id,t,d,km)=>({id,t,d,tipo:\"dist\",km});\n    const chk = (id,t,d)=>({id,t,d,tipo:\"chk\"});\n    const lib = (id,t,d,peso,reps)=>({id,t,d,tipo:\"car\",peso,reps});\n    const rep = (id,t,d,reps)=>({id,t,d,tipo:\"rep\",reps});\n    const tim = (id,t,d,seg)=>({id,t,d,tipo:\"tim\",seg});\n    const S = \"septiembre\";\n    return [\n      { dia:\"Lun\", num:\"14\", titulo:\"Fuerza general · pierna moderada\", sub:\"~1h15 · sin correr\", mes:S, obj:\"Único día dedicado de pierna. Moderado, dejando reserva para el martes de ritmo.\", secciones:[\n        {nombre:\"Cómo se lee la semana\", pres:\"Leer una vez\",\n          nota:\"SEGUNDA SEMANA DEL HÍBRIDO. Baja la intensidad por sesión: nada al fallo salvo el press de banca del viernes.\\n\\nLA PIERNA SE MANTIENE, NO SE ROMPE. El lunes es el único día dedicado de pierna y va moderado, para llegar fresco a cada corrida.\\n\\nCERO IMPACTO (sin saltos) hasta que el gemelo esté limpio.\\n\\n1RM de referencia: Snatch 80 · Clean 105 · Back Squat 140 · Front Squat 125 · Deadlift 160 · Bench 110.\", items:[\n          chk(\"f-l-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"Fuerza\", dur:\"75:00\", pres:\"RPE 7 · sin grinders\",\n          nota:\"Sentadilla trasera 4×6 a 105-110: RPE 7, te sobran 3 reps, sin grinders.\\n\\nEl resto, moderado y controlado. El gemelo es lento en la bajada.\", items:[\n          lib(\"f-l-f1\",\"Sentadilla trasera · 4 × 6\",\"kg · 105-110 · RPE 7\",105,6),\n          lib(\"f-l-f2\",\"Peso muerto rumano · 3 × 8\",\"kg de la barra\",85,8),\n          lib(\"f-l-f3\",\"Zancadas hacia atrás · 3 × 10/pierna\",\"kg por mancuerna · moderadas\",15,10),\n          lib(\"f-l-f4\",\"Gemelo de pie · 4 × 12\",\"kg · controlado\",75,12),\n          chk(\"f-l-f5\",\"Plancha Copenhague · 3 × 25\\\"/lado\",\"hecho\")]}\n      ]},\n      { dia:\"Mar\", num:\"15\", titulo:\"Tracción + Ritmo · 5 × 1000\", sub:\"Doble · gym ~1h + corrida\", mes:S, obj:\"Tracción submáxima y primer bloque de ritmo con volumen. El crono no se fuerza.\", secciones:[\n        {nombre:\"GYM · submáximo, RIR 2\", dur:\"60:00\", pres:\"Nada al fallo\",\n          nota:\"RIR 2 en todo: terminás cada serie con dos reps en el bolsillo. Hoy a la noche hay ritmo y el gimnasio no puede comerse esa sesión.\", items:[\n          rep(\"f-m-g1\",\"Dominadas · 4 × 6-8\",\"reps por set\",7),\n          lib(\"f-m-g2\",\"Remo con barra · 4 × 8\",\"kg de la barra\",75,8),\n          lib(\"f-m-g3\",\"Polea al pecho · 4 × 8\",\"kg de la polea\",59,8),\n          lib(\"f-m-g4\",\"Curl con mancuernas · 3 × 10\",\"kg por mancuerna\",12.5,10),\n          chk(\"f-m-g5\",\"Face pull · 3 × 15\",\"hecho\")]},\n        {nombre:\"CORRIDA · 5 × 1000 a 5:18\", dur:\"35:00\", pres:\"A la noche · trote 90\\\"\",\n          nota:\"Cinco tramos de 1000 m a 5:18, con 90 segundos de trote entre uno y otro.\\n\\nGUARDRAIL: tramo que pase de 5:22 o llegue a RPE 8 → cortás ahí. El crono no se fuerza.\", items:[\n          tim(\"f-m-s1\",\"Tramo 1\",\"mm:ss del km\",318),\n          tim(\"f-m-s2\",\"Tramo 2\",\"mm:ss del km\",318),\n          tim(\"f-m-s3\",\"Tramo 3\",\"mm:ss del km\",318),\n          tim(\"f-m-s4\",\"Tramo 4\",\"mm:ss del km\",318),\n          tim(\"f-m-s5\",\"Tramo 5\",\"mm:ss del km\",318),\n          rep(\"f-m-s6\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Mié\", num:\"16\", titulo:\"Crossfit propio · foco snatch\", sub:\"~1h · sin correr\", mes:S, obj:\"Estímulo de pierna vía olímpico, sin impacto.\", secciones:[\n        {nombre:\"Warm up\", dur:\"08:00\", pres:\"2 rounds\",\n          nota:\"2 rondas: 300 m row + 10 air squats con pausa abajo + 10 pass through + 5 inchworm + front rack stretch.\", items:[\n          chk(\"f-w-w1\",\"300 m row\",\"2 rounds\"),\n          chk(\"f-w-w2\",\"10 air squats con pausa abajo\",\"2 rounds\"),\n          chk(\"f-w-w3\",\"10 pass through\",\"2 rounds\"),\n          chk(\"f-w-w4\",\"5 inchworm\",\"2 rounds\"),\n          chk(\"f-w-w5\",\"Front rack stretch\",\"2 rounds\")]},\n        {nombre:\"Power snatch\", dur:\"15:00\", pres:\"6 × 2 · técnico\",\n          nota:\"Técnico, rápido bajo la barra. 50-55 kg, sin buscar peso.\", items:[\n          lib(\"f-w-a1\",\"Power snatch · 6 × 2\",\"kg · 50-55\",50,2)]},\n        {nombre:\"WOD\", dur:\"14:00\", pres:\"4 rounds · cap 14'\",\n          nota:\"4 rondas: 400 m row + 12 DB push press @22,5 + 10 pull ups.\", items:[\n          tim(\"f-w-c1\",\"Tiempo total\",\"mm:ss · cap 14'\",840),\n          lib(\"f-w-c2\",\"DB push press · peso usado\",\"kg por mancuerna\",22.5,12)]},\n        {nombre:\"Accesorio\", dur:\"08:00\", pres:\"Corto\", items:[\n          chk(\"f-w-e1\",\"Hollow hold · 4 × 20\\\"\",\"corto\"),\n          chk(\"f-w-e2\",\"Dead bug · 3 × 12\",\"hecho\")]}\n      ]},\n      { dia:\"Jue\", num:\"17\", titulo:\"Empuje + Larga 6 km\", sub:\"Doble · gym ~1h + corrida\", mes:S, obj:\"Empuje submáximo y primera larga de 6 km, puente hacia los 8.\", secciones:[\n        {nombre:\"GYM · submáximo, RIR 2\", dur:\"60:00\", pres:\"Nada al fallo\", items:[\n          lib(\"f-j-g1\",\"Press militar de pie · 4 × 8\",\"kg de la barra\",40,8),\n          lib(\"f-j-g2\",\"Press banca con mancuernas · 4 × 10\",\"kg por mancuerna\",25,10),\n          lib(\"f-j-g3\",\"Elevaciones laterales · 3 × 12\",\"kg por mancuerna · 7,5-10\",7.5,12),\n          chk(\"f-j-g4\",\"Fondos o press francés · 3 × 10\",\"hecho\"),\n          chk(\"f-j-g5\",\"Face pull · 3 × 15\",\"hecho\")]},\n        {nombre:\"CORRIDA · 6 km muy suaves\", dur:\"36:00\", pres:\"A la noche · 5:50-6:00\",\n          nota:\"6 km MUY suaves, a 5:50-6:00. Conversado, sin bici.\", items:[\n          dis(\"f-j-r1\",\"Distancia\",\"km · objetivo 6\",6),\n          tim(\"f-j-r2\",\"Tiempo total\",\"mm:ss\",2130),\n          rep(\"f-j-r3\",\"Esfuerzo\",\"0 = charlando · 10 = duro\",4),\n          rep(\"f-j-r4\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Vie\", num:\"18\", titulo:\"Torso pesado\", sub:\"Único día pesado · ~1h15 · sin correr\", mes:S, obj:\"Único día al que le exigís. Piernas descansan, mañana hay fútbol.\", secciones:[\n        {nombre:\"Fuerza tren superior\", dur:\"75:00\", pres:\"El único día pesado de la semana\",\n          nota:\"Press banca 4×6 a 82,5 con excéntrico de 3\\\" en las dos primeras series. Si sale limpio, 85 la próxima.\\n\\nDominadas a máximas: lastradas si hacés más de 8.\", items:[\n          lib(\"f-v-f1\",\"Press banca · 4 × 6\",\"kg · excéntrico 3\\\" en las 2 primeras\",82.5,6),\n          lib(\"f-v-f2\",\"Remo con barra · 4 × 8\",\"kg de la barra\",77.5,8),\n          rep(\"f-v-f3\",\"Dominadas · 4 × máximas\",\"reps del mejor set · lastradas si +8\",8),\n          lib(\"f-v-f4\",\"Press inclinado con mancuernas · 3 × 10\",\"kg por mancuerna\",22.5,10),\n          lib(\"f-v-f5\",\"Elevaciones laterales · 3 × 12\",\"kg por mancuerna\",10,12),\n          lib(\"f-v-f6\",\"Curl con mancuernas · 3 × 8\",\"kg por mancuerna\",15,8),\n          lib(\"f-v-f7\",\"Tríceps · 3 × 12\",\"kg\",22.5,12)]}\n      ]},\n      { dia:\"Sáb\", num:\"19\", titulo:\"Bombeo + fútbol o metcon\", sub:\"Dos versiones · registrá la que corresponda\", mes:S, obj:\"Pierna vía deporte, o metcon sin impacto si no hay fútbol. Tren superior liviano de bombeo.\", secciones:[\n        {nombre:\"Cuál de las dos\", pres:\"Leer primero\",\n          nota:\"VERSIÓN A si jugás fútbol: gym liviano ~45' + partido.\\nVERSIÓN B si no jugás: el mismo gym liviano + metcon sin impacto, ~1h en total.\\n\\nEl bloque de bombeo es el mismo en las dos. Registrá solo la parte que hiciste.\", items:[\n          chk(\"f-s-x1\",\"Versión que hiciste\",\"A con fútbol · B con metcon\")]},\n        {nombre:\"GYM · bombeo · las dos versiones\", dur:\"45:00\", pres:\"RIR 2-3 · sin acercarte al fallo\", items:[\n          lib(\"f-s-g1\",\"Press inclinado con mancuernas · 3 × 12\",\"kg por mancuerna\",17.5,12),\n          lib(\"f-s-g2\",\"Remo con mancuerna · 3 × 12/lado\",\"kg por mancuerna\",22.5,12),\n          lib(\"f-s-g3\",\"Elevaciones laterales · 3 × 15\",\"kg por mancuerna\",7.5,15),\n          lib(\"f-s-g4\",\"Curl con mancuernas · 3 × 12\",\"kg por mancuerna\",12.5,12),\n          chk(\"f-s-g5\",\"Tríceps · 3 × 15\",\"moderado\"),\n          chk(\"f-s-g6\",\"Face pull · 3 × 15\",\"hecho\")]},\n        {nombre:\"VERSIÓN A · Fútbol\", pres:\"Si jugás\",\n          nota:\"Entrada en calor larga de gemelo y tobillo. No salir a fondo los primeros minutos.\", items:[\n          chk(\"f-s-p0\",\"Entrada en calor de gemelo y tobillo\",\"larga\"),\n          tim(\"f-s-p1\",\"Minutos jugados\",\"mm:ss\",3600),\n          rep(\"f-s-p2\",\"Cómo quedaste\",\"0 = entero · 10 = fundido\",5),\n          rep(\"f-s-p3\",\"Gemelo derecho\",\"0-10\",0)]},\n        {nombre:\"VERSIÓN B · Metcon sin impacto\", dur:\"22:00\", pres:\"Si no jugás\",\n          nota:\"PARTE A — EMOM 12', 3 estaciones alternadas:\\nMin 1: 12 wall balls @9 (o goblet squat @22,5 si no hay pelota)\\nMin 2: 10 DB thrusters @17,5\\nMin 3: 12 cal bici\\n\\nDescanso 3'\\n\\nPARTE B — 3 rounds for time (cap 7'):\\n15 kettlebell swings @24 + 15 push ups + 200 m row\", items:[\n          chk(\"f-s-m1\",\"EMOM 12' completo\",\"marcar\"),\n          lib(\"f-s-m2\",\"Wall balls o goblet squat · peso usado\",\"kg\",9,12),\n          lib(\"f-s-m3\",\"DB thrusters · peso usado\",\"kg por mancuerna\",17.5,10),\n          tim(\"f-s-m4\",\"Parte B · tiempo total\",\"mm:ss · cap 7'\",420),\n          lib(\"f-s-m5\",\"Kettlebell swings · peso usado\",\"kg\",24,15),\n          rep(\"f-s-m6\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Dom\", num:\"20\", titulo:\"Descanso\", sub:\"Cierre de semana 2\", mes:S, obj:\"No entrenar.\", secciones:[\n        {nombre:\"Descanso\", pres:\"Nada\", items:[\n          rep(\"f-d-z1\",\"Cómo te levantaste\",\"0 = entero · 10 = roto\",3),\n          rep(\"f-d-z2\",\"Semana completada\",\"días de 6\",6)]}\n      ]}\n    ];\n  }\n  planS5(){\n    const dis = (id,t,d,km)=>({id,t,d,tipo:\"dist\",km});\n    const chk = (id,t,d)=>({id,t,d,tipo:\"chk\"});\n    const car = (id,t,d,lift,pct,reps)=>({id,t,d,tipo:\"car\",lift,pct,reps});\n    const lib = (id,t,d,peso,reps)=>({id,t,d,tipo:\"car\",peso,reps});\n    const rep = (id,t,d,reps)=>({id,t,d,tipo:\"rep\",reps});\n    const tim = (id,t,d,seg)=>({id,t,d,tipo:\"tim\",seg});\n    const S = \"septiembre\";\n    return [\n      { dia:\"Lun\", num:\"7\", titulo:\"Prueba del gimnasio + Fuerza\", sub:\"Híbrido · semana 1 de 5\", mes:S, obj:\"Medir qué hay en el gimnasio y dejar una referencia de fuerza de pierna.\", secciones:[\n        {nombre:\"El esquema original · reemplazado el 9/9\", pres:\"Histórico · el vigente está en el Mié 9\",\n          nota:\"OJO: ESTE ERA EL PLAN DEL LUNES. Se reescribió el miércoles 9 después de tus sensaciones — la corrida de ritmo pasó al miércoles, el crossfit al jueves, las zancadas se cayeron y la pierna se partió en tres días. EL MAPA VIGENTE ESTÁ EN EL MIÉ 9, sección \\\"Lo que pasó y qué cambio\\\". Esto queda solo como registro de lo que se había escrito.\\n\\n———\\n\\nARRANCA EL HÍBRIDO. Seis días: fuerza de gimnasio, dos corridas y fútbol el sábado.\\n\\nLA SEMANA:\\nLun — Fuerza de tren inferior (squat, RDL, zancadas, oly)\\nMar — Tracción a la tarde + CORRIDA DE RITMO a la noche ← la clave\\nMié — Crossfit propio (lo escribo yo)\\nJue — Empuje a la tarde + corrida larga 7-8 km a la noche\\nVie — Torso pesado (press con % de bench) + las zancadas\\nSáb — Torso corto a la mañana + fútbol al mediodía\\nDom — Descanso\\n\\nEL TREN SUPERIOR VA REPARTIDO EN CUATRO DÍAS, no en dos: martes tracción liviana, jueves empuje moderado, viernes el pesado, sábado corto. Para masa magra la frecuencia rinde más que el volumen por sesión, y el torso no interfiere con correr — la interferencia real es pierna pesada contra carrera.\\n\\nLa pierna, en cambio, va concentrada: fuerte el lunes, las zancadas el viernes, y nada más. Los días de corrida no tocan pierna con peso.\\n\\nLO DEL CROSSFIT, RESUELTO: las clases del lugar son solo martes y jueves a las 18, y esos son justo tus dos días de corrida. El martes es la sesión que no se mueve, y el jueves la larga más una clase a las 18 es doble sesión en el día de más volumen. Así que el miércoles lo escribo yo, con la misma estructura de una hora y un WOD distinto cada semana.\\n\\nDespués del 11/10 se resuelve solo: cuando correr baje a una vez por semana, martes o jueves a las 18 queda libre y tomás clase.\\n\\nEL OBJETIVO: bajar de 55 minutos el 11/10. Eso es 5:30/km sostenido. Tu 5 km salió a 5:17, así que el ritmo está: lo que falta es sostenerlo el doble de tiempo. Todo el bloque de martes apunta a eso.\", items:[\n          chk(\"e-l-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"Las 5 semanas de carrera\", pres:\"El mapa · corregido el 10/9 con tus tiempos\",\n          nota:\"Dos salidas por semana, martes y jueves. LA SEMANA DEL 8/9 FUE LA EXCEPCIÓN: el martes no se corrió, el ritmo salió el miércoles y la segunda corrida el viernes como bici y trote. Desde el 15/9 cada sesión vuelve a su día y no se mueve más.\\n\\nEL MAPA CAMBIÓ el 10/9. La versión del lunes estaba escrita antes de tener un solo dato tuyo de ritmo y apuntaba todo a 5:30. Sostuviste 5:23 de media a RPE 6, así que 5:30 ya no es un objetivo, es tu ritmo cómodo — el bloque sube.\\n\\nMARTES (ritmo) — es la que progresa:\\nSem 1 · 4 × 1000 a 5:20 · HECHA: 5:21 · 5:24 · 5:25 · 5:07\\nSem 2 (15/9) · 5 × 1000 a 5:15, trote 90\\\"\\nSem 3 (22/9) · 3 × 2000 a 5:25, trote 3'\\nSem 4 (29/9) · 2 × 3000 a 5:25, trote 4' ← la que te da el tiempo final\\nSem 5 (6/10) · 4 × 800 a 5:10 (afinado)\\n\\nJUEVES (larga) — no progresa, se mantiene:\\n8 km a 6:20-6:40 las semanas 2, 3 y 4. Semana 5, 5 km flojos.\\n\\nDOMINGO 11/10 — la carrera.\\n\\nNo hay progresión de distancia porque no la necesitás: ya corriste 21 km y venís corriendo todo el año. El tope de 8 km es a propósito. Lo que no tenés es tiempo sostenido a ritmo, y eso es exactamente lo que entrena el martes.\", items:[\n          chk(\"e-l-x2\",\"Mapa leído\",\"marcar\")]},\n        {nombre:\"Hoy: probar el lugar\", pres:\"Antes de entrenar · 5 cosas\",\n          nota:\"Marcá lo que encuentres. De esto depende cómo escribo los tres días de fuerza de la semana que viene — si no hay rack, el plan es otro.\", items:[\n          chk(\"e-l-g1\",\"Squat rack o jaula\",\"¿hay?\"),\n          rep(\"e-l-g2\",\"Tope de discos disponible\",\"kg totales en barra\",180),\n          rep(\"e-l-g3\",\"Mancuerna más pesada\",\"kg\",40),\n          chk(\"e-l-g4\",\"Remo / bici / cinta\",\"¿hay cardio interno?\"),\n          chk(\"e-l-g5\",\"Horarios de las clases de crossfit\",\"anotados\")]},\n        {nombre:\"Lo que hiciste · registrado\", pres:\"Sesión real del 7/9 · 1 hora justa\",\n          nota:\"BACK SQUAT — 100×4 · 100×6 · 110×6 · 110×6\\nDOUBLE DB LUNGE — 3 × 20 (10/10), mancuernas de 15 kg\\nRDL — 60 · 80 · 100 × 8, todas fáciles\\nOLY — complejo (clean pull + hang power clean + hang squat clean): 50 · 60 · 70 · 75, todas fáciles\\nGEMELOS — 3 × 15 con 75 kg totales\\n\\nLO BUENO: te autocorregiste bien en el squat. Estaba escrito 4×6 hasta RPE 8 y viste que 100 era liviano, así que subiste a 110 y ahí sí quedó. Ese es exactamente el criterio que quiero que uses.\\n\\nLO QUE APRENDÍ: los 1RM que tenía cargados estaban bajos. Ya están tus números (snatch 80 · clean 105 · back squat 140 · front squat 125 · deadlift 160 · bench 110), y cierran bien: 110 × 6 es el 78% de 140, que para 6 reps es justo lo que se siente cómodo-pero-no-fácil.\\n\\nOJO CON ESTO: son estimaciones y hace mucho que no testeás. Así que el kilo que te muestra la app es una SUGERENCIA de arranque, no una orden — el que manda es el RPE. Si el set sale liviano, subís y lo anotás, como hiciste hoy. No vamos a testear 1RM antes del 11/10 (singles máximos con la carrera encima no van); después de la carrera sí, con una semana de test en serio.\\n\\nLO QUE SOBRÓ: RDL y oly quedaron livianos (dijiste 'easy' en las dos). No es un error tuyo, es que yo los calibré bajo. La semana que viene el RDL arranca en 90 y el complejo en 65.\\n\\nLAS ZANCADAS: 10/10 son 10 POR PIERNA, o sea 20 por serie. Lo leíste bien, y las 3 series estaban bien. Como el glúteo trabajó bien, la dosis queda igual.\\n\\nCONVENCIÓN, PARA QUE NO HAYA DUDA: una barra siempre significa por lado. 10/10 = 10 por pierna. Si escribo '20 reps' sin barra, son 20 en total. En el remo a un brazo, 6/6 = 6 por brazo.\\n\\nLO ÚNICO QUE CAMBIO ES EL DÍA: 60 zancadas 24 horas antes de la sesión de ritmo es mala ubicación, no mala dosis — es el ejercicio que más agujetas deja a 24-48 hs y mañana son 4 × 1000 a 5:20. La semana que viene van al viernes, con las mismas 3 × 20.\\n\\nPARA MAÑANA: fijate en el calentamiento. Si el primer tramo a 5:20 te cuesta como si fuera 5:40, hacé tres en vez de cuatro y no pasa nada.\", items:[\n          chk(\"e-l-r1\",\"Sesión registrada\",\"leído\")]},\n        {nombre:\"Cómo estaba escrito\", dur:\"45:00\", pres:\"Referencia\",\n          nota:\"No escribo los ejercicios todavía porque no sé qué hay. Para hoy, si el lugar tiene rack y barra, hacé esto y con eso alcanza para medir:\\n\\n· Back squat — 4 × 6, subiendo hasta RPE 8. Tu referencia es 112 × 3, así que 4 × 6 debería caer entre 95 y 105.\\n· Peso muerto rumano — 3 × 8, moderado.\\n· Zancadas caminando — 3 × 10/10, con mancuernas livianas.\\n· Gemelo de pie — 3 × 15, lento en la bajada.\\n\\nEl gemelo va al final y no es opcional: corriste 5 km a 5:17 con el gemelo en cero y lo quiero mantener así hasta el 11/10.\\n\\nSi el lugar es de máquinas nomás, hacé prensa, extensión, femoral y gemelo con el mismo esquema de series y anotalo. Con lo que registres hoy escribo la semana 2 en serio.\", items:[\n          lib(\"e-l-f1\",\"Back squat (o prensa) · 4 × 6\",\"kg del set más pesado\",100,6),\n          chk(\"e-l-f2\",\"Peso muerto rumano 3 × 8\",\"hecho\"),\n          chk(\"e-l-f3\",\"Zancadas 3 × 10/10\",\"hecho\"),\n          chk(\"e-l-f4\",\"Gemelo de pie 3 × 15\",\"no saltear\"),\n          rep(\"e-l-f5\",\"Qué te pareció el lugar\",\"0 = malo · 10 = excelente\",7)]}\n      ]},\n      { dia:\"Mar\", num:\"8\", titulo:\"Torso + Ritmo · 4 × 1000\", sub:\"Doble · torso a la tarde, ritmo a la noche\", mes:S, obj:\"Tracción a la tarde, y a la noche los cuatro tramos entre 5:15 y 5:25 — el cuarto igual que el segundo.\", secciones:[\n        {nombre:\"Por qué esta sesión\", pres:\"Semana 1 de 5\",\n          nota:\"Es la única sesión del plan que no se negocia ni se mueve. Todo lo demás puede correrse un día; esta no.\\n\\nEL PUNTO: tenés ritmo (5:17 en 5 km) pero no tenés tiempo sostenido a ritmo. Cortar el trabajo en cuatro tramos de 1000 m te deja acumular 4 km a un ritmo que todavía no podrías sostener seguido — y en cinco semanas eso se convierte en sostenerlo.\\n\\nA 5:20 el kilómetro, cada tramo son 5 minutos y 20 segundos. Si el primero sale mucho más rápido, salió mal: la idea es que los cuatro salgan iguales.\\n\\nEL DÍA VA EN DOS PARTES: tren superior en el gimnasio a la tarde, merienda, y el trote a la noche. Buen orden — el torso no toca pierna, así que corrés con las piernas frescas y a temperatura más baja.\\n\\nUNA REGLA: 90 minutos entre la merienda y el trote. Si salís antes con yogur y fruta encima, te agarra flato en el segundo tramo.\", items:[\n          chk(\"e-m-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"SESIÓN 1 · Tren superior · TRACCIÓN\", dur:\"22:00\", pres:\"A la tarde, en el gimnasio\",\n          nota:\"POR QUÉ ACÁ: el tren superior no interfiere con correr. La interferencia real es entre pierna pesada y carrera, no entre press y carrera. Así que los días de corrida son lugar libre para el torso, y eso te da cuatro estímulos de tren superior por semana en vez de dos — que para masa magra rinde más que dos sesiones largas.\\n\\nPOR QUÉ TRACCIÓN Y NO EMPUJE: entre el miércoles (push jerk + 45 push press), el viernes y el sábado ya tenés tres días de hombro. Sumar empuje acá serían cinco y se funde. Tracción es lo que casi todos entrenan de menos, y es lo que sostiene la postura al correr.\\n\\nESTE BLOQUE VA PRIMERO, A LA TARDE. Nada de pierna acá, así que llegás al trote de la noche con las piernas enteras. Son 22 minutos, no una sesión larga: dejá algo en el tanque.\", items:[\n          rep(\"e-m-t1\",\"Dominadas · 4 sets\",\"reps por set · lastradas si salen 10+\",8),\n          lib(\"e-m-t2\",\"Remo con barra · 4 × 8\",\"kg\",60,8),\n          chk(\"e-m-t3\",\"Curl con mancuernas\",\"12 reps × 3 sets\"),\n          chk(\"e-m-t4\",\"Face pull o pájaros\",\"15 reps × 3 sets\"),\n          rep(\"e-m-t5\",\"Hombro al terminar\",\"0 = bien · 10 = cargado\",3)]},\n        {nombre:\"SESIÓN 2 · NO SE HIZO · movida al miércoles\", dur:\"12:00\", pres:\"Bien decidido\",\n          nota:\"No se corrió: piernas cansadas del lunes. Decisión correcta y no hace falta discutirla — correr 4 × 1000 a 5:20 con las piernas del lunes encima sale mal y encima ensucia el dato.\\n\\nLa sesión se movió entera al miércoles 9. El error fue de programación, no tuyo: está explicado arriba de todo en el miércoles.\", items:[\n          tim(\"e-m-w1\",\"Trote suave\",\"10-12' bien flojo\",660),\n          chk(\"e-m-w2\",\"Leg swings adelante y al costado\",\"10/10\"),\n          chk(\"e-m-w3\",\"3 aceleraciones de 60 m\",\"progresivas, sin sprint\")]},\n        {nombre:\"SESIÓN 2 · Serie principal\", dur:\"22:00\", pres:\"4 × 1000 m a 5:20 · trote 90\\\"\",\n          nota:\"Cuatro tramos de 1000 m. Objetivo 5:20 cada uno (rango bueno: 5:15 a 5:25).\\n\\nEntre tramo y tramo, 90 segundos de trote muy flojo. Trote, no caminata — mantener las piernas en movimiento es parte del estímulo.\\n\\nCÓMO LEER LA SESIÓN: si los cuatro salen entre 5:15 y 5:25 y el último no te costó más que el segundo, el sub-55 del 11/10 está bien encaminado. Si el cuarto se te va a 5:40, el ritmo objetivo es 5:35 y no 5:20, y ajusto el resto del bloque.\\n\\nAnotá los cuatro tiempos. Son el dato con el que escribo la semana que viene.\", items:[\n          tim(\"e-m-s1\",\"Tramo 1\",\"mm:ss del km\",320),\n          tim(\"e-m-s2\",\"Tramo 2\",\"mm:ss del km\",320),\n          tim(\"e-m-s3\",\"Tramo 3\",\"mm:ss del km\",320),\n          tim(\"e-m-s4\",\"Tramo 4\",\"mm:ss del km\",320),\n          rep(\"e-m-s5\",\"Cuánto costó el último\",\"0 = fácil · 10 = al límite\",7)]},\n        {nombre:\"Vuelta a la calma\", dur:\"10:00\", pres:\"Sin apuro\", items:[\n          tim(\"e-m-z1\",\"Trote flojo\",\"8-10'\",540),\n          chk(\"e-m-z2\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\"),\n          rep(\"e-m-z3\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Mié\", num:\"9\", titulo:\"Empuje + Ritmo · 4 × 1000\", sub:\"Doble · la sesión del martes, hoy\", mes:S, obj:\"Recuperar la sesión de ritmo con las piernas descansadas. Cuatro tramos entre 5:15 y 5:25, el cuarto igual que el segundo.\", secciones:[\n        {nombre:\"Lo que pasó y qué cambio\", pres:\"Leer antes de entrenar\",\n          nota:\"EL ERROR FUE MÍO. Metí 4 × 6 de back squat + 60 zancadas + RDL + gemelo en un mismo día, o sea el volumen de pierna de una sesión de hipertrofia, y lo puse 24 horas antes de la única sesión que no se negocia. Vos entrenaste bien el lunes; el problema era el calendario.\\n\\nNO CORRER ESTUVO BIEN. Un martes flojo no arruina nada, un martes corrido con las piernas rotas sí: sale lento, te deja peor y encima el dato no sirve para calibrar el ritmo del 11/10. Preservar y pasarme la sensación es exactamente lo que necesito.\\n\\nCÓMO QUEDA LA SEMANA:\\nMié 9 — empuje corto a la tarde + 4 × 1000 a la noche (la del martes)\\nJue 10 — crossfit propio, 60' (excepción: su día es el miércoles)\\nVie 11 — torso pesado a la tarde + bici Z2 y trote corto a la noche\\nSáb 12 — torso corto AM + fútbol\\nDom 13 — descanso\\n\\nESTA SEMANA NO HAY MÁS PIERNA. Ya tuvo su dosis el lunes, y de sobra. Las zancadas que estaban el viernes se caen; vuelven la semana que viene con el esquema nuevo.\", items:[\n          chk(\"e-w-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"La pierna se parte en tres\", pres:\"Cambio fijo desde la semana 2\",\n          nota:\"Tenías razón: un solo día de pierna fuerte es demasiado en un plan con dos corridas. Se reparte en tres dosis chicas.\\n\\nLUNES · bilateral pesado y CORTO (~20' de pierna)\\nBack squat 4 × 5 pesado + gemelo. Nada más. El squat a pocas reps casi no deja agujetas: el daño muscular viene del volumen y de lo excéntrico, no del kilo. Por eso lo pesado puede quedar 24 h antes de correr.\\n\\nMIÉRCOLES · pierna técnica y liviana, dentro del crossfit (~15')\\nComplex de clean, con el front squat adentro. Poco volumen, mucha posición.\\n\\nVIERNES · el día excéntrico (~20')\\nZancadas, RDL, hip thrust, gemelo lento. Todo lo que deja agujetas va acá: 48 horas después del ritmo del martes, y lo único que viene después es el partido del sábado.\\n\\nEL TOTAL SEMANAL DE PIERNA NO BAJA — se reparte. Tres estímulos por semana rinden más para masa magra que uno grande, y ninguno le pega a una corrida.\\n\\nDÓNDE VIVE EL CROSSFIT: los miércoles, desde el 15/9 y hasta la carrera. Esta semana fue la excepción — el ritmo se comió el miércoles, así que el crossfit pasó al jueves 10. Desde el 15 la semana queda: lunes fuerza de pierna, martes ritmo, miércoles crossfit, jueves larga, viernes torso pesado más el bloque excéntrico, sábado fútbol.\\n\\nLA REGLA QUE ORDENA TODO: excéntrico y unilateral nunca dentro de las 24 h previas a correr. Pesado bilateral sí puede.\\n\\nESTO VALE HASTA EL 11/10. Después, con dos días de crossfit, la pierna se reparte distinto y está en el plan estratégico.\", items:[\n          chk(\"e-w-x2\",\"Leído\",\"marcar\")]},\n        {nombre:\"Los 50 minutos\", pres:\"Lo del tiempo, resuelto\",\n          nota:\"Anotaste 48' el martes con todo incluido, y te dan 60-75'. Bien el dato — sin eso yo sigo escribiendo sesiones cortas.\\n\\nQUÉ HAGO CON ESO: los días de torso pasan de 4-5 ejercicios a 6-7, y sumo un bloque de core o de carry al final. La sesión de tracción del martes, por ejemplo, ya la tenías resuelta sola: le agregaste polea al pecho 47-53-59-65 en pirámide, que es exactamente el ejercicio que faltaba. A partir de ahora va escrito.\\n\\nHOY Y EL SÁBADO SON PRUEBA. Anotá los minutos en el campo del final de cada bloque y si te quedó sabor a poco decímelo: sumar es fácil, lo que no quiero es inflar la sesión antes de tener el dato.\\n\\nQUÉ NO HAGO: no lleno la hora en los días dobles. Hoy y el viernes son torso + corrida, y ahí la parte de gimnasio se queda en 25-30 minutos a propósito — lo que sobra del tiempo se lo lleva la corrida.\", items:[\n          chk(\"e-w-x3\",\"Leído\",\"marcar\")]},\n        {nombre:\"SESIÓN 1 · Tren superior · EMPUJE\", dur:\"28:00\", pres:\"A la tarde · corto, la corrida manda\",\n          nota:\"Empuje moderado, series de 10-12 con margen. El día pesado de press es el viernes; acá el objetivo es frecuencia y llegar entero a la noche.\\n\\nCERO PIERNA. Ni sentadilla de calentamiento.\\n\\nSi algo tiene que salir por tiempo, sacá los laterales, nunca el press.\", items:[\n          lib(\"e-j-g1\",\"DB Bench Press · 4 × 10\",\"kg por mancuerna\",25,10),\n          lib(\"e-w-g2\",\"Press militar de pie · 3 × 10\",\"kg de la barra\",35,10),\n          chk(\"e-j-g2\",\"Elevaciones laterales\",\"15 reps × 3 sets\"),\n          chk(\"e-j-g3\",\"Fondos o press francés\",\"12 reps × 3 sets\"),\n          chk(\"e-w-g5\",\"Face pull\",\"15 reps × 3 sets\"),\n          chk(\"e-j-g4\",\"Hollow hold 40\\\"\",\"3 sets\"),\n          rep(\"e-w-g6\",\"Hombro al terminar\",\"0 = bien · 10 = cargado\",3),\n          rep(\"e-w-g7\",\"Cuánto duró el bloque\",\"minutos · con calentamiento y descansos\",28)]},\n        {nombre:\"Cinta o calle\", pres:\"Hay cinta en el gimnasio\",\n          nota:\"HOY LA CINTA CONVIENE. Tu riesgo número uno en esta sesión es salir a 5:05 el primer tramo y terminar a 5:45; la cinta te lo hace imposible y te enseña qué se siente 5:20 sostenido.\\n\\nPONELA AL 1% DE INCLINACIÓN. Sin viento en contra, la cinta a 0% es más fácil que la calle y el ritmo te queda inflado — el 1% empareja las dos cosas y hace que el dato sirva para calibrar el 11/10.\\n\\nDESDE LA SEMANA 3 EL RITMO VUELVE A LA CALLE. El día de la carrera nadie te fija la cinta: tenés que sostener 5:30 por sensación, y eso solo se entrena afuera. La cinta queda para clima malo, o para cuando quiera que un ritmo salga exacto sí o sí.\\n\\nLA LARGA SIEMPRE AFUERA. Ahí lo que se entrena es tiempo en los pies sobre terreno real.\\n\\nEQUIVALENCIAS EN KM/H:\\n5:20/km = 11,3\\n5:25/km = 11,1\\n5:30/km = 10,9\\n6:20/km = 9,5\\n6:40/km = 9,0\\n\\nEl trote de recuperación entre tramos, 8,0 km/h (7:30/km).\", items:[\n          chk(\"e-w-c1\",\"Dónde corriste\",\"cinta o calle\"),\n          chk(\"e-w-c2\",\"Inclinación al 1%\",\"si fue en cinta\")]},\n        {nombre:\"SESIÓN 2 · Entrada en calor\", dur:\"12:00\", pres:\"A la noche · no la saltees\",\n          nota:\"Las series en frío son la forma más rápida de terminar con el gemelo tirante. Diez minutos acá valen la sesión.\\n\\n90 minutos entre la merienda y el trote.\", items:[\n          tim(\"e-w-w1\",\"Trote suave\",\"10-12' bien flojo\",660),\n          chk(\"e-w-w2\",\"Leg swings adelante y al costado\",\"10/10\"),\n          chk(\"e-w-w3\",\"3 aceleraciones de 60 m\",\"progresivas, sin sprint\")]},\n        {nombre:\"SESIÓN 2 · Serie principal\", dur:\"22:00\", pres:\"4 × 1000 m a 5:20 · trote 90\\\"\",\n          nota:\"Cuatro tramos de 1000 m. Objetivo 5:20 cada uno (rango bueno: 5:15 a 5:25).\\n\\nEntre tramo y tramo, 90 segundos de trote muy flojo. Trote, no caminata.\\n\\nARRANCÁ CONTENIDO. El primer tramo con las piernas descansadas se va a sentir fácil y ahí es donde se sale a 5:05 y se termina a 5:45. Si los cuatro salen iguales, la sesión salió perfecta aunque el promedio sea 5:25.\\n\\nCÓMO LA LEO: si los cuatro caen entre 5:15 y 5:25 y el último no costó más que el segundo, el sub-55 está encaminado. Si el cuarto se va a 5:40, el ritmo objetivo real es 5:35 y reescribo el bloque.\\n\\nSI HOY LAS PIERNAS SIGUEN PESADAS en el calentamiento: hacé 3 × 1000 en vez de 4 y anotalo. No hay que forzar dos veces la misma sesión.\", items:[\n          tim(\"e-w-s1\",\"Tramo 1\",\"mm:ss del km\",320),\n          tim(\"e-w-s2\",\"Tramo 2\",\"mm:ss del km\",320),\n          tim(\"e-w-s3\",\"Tramo 3\",\"mm:ss del km\",320),\n          tim(\"e-w-s4\",\"Tramo 4\",\"mm:ss del km\",320),\n          rep(\"e-w-s5\",\"Cuánto costó el último\",\"0 = fácil · 10 = al límite\",7),\n          rep(\"e-w-s6\",\"Cómo estaban las piernas al empezar\",\"0 = frescas · 10 = pesadas\",4)]},\n        {nombre:\"Vuelta a la calma\", dur:\"10:00\", pres:\"Sin apuro\", items:[\n          tim(\"e-w-z1\",\"Trote flojo\",\"8-10'\",540),\n          chk(\"e-w-z2\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\"),\n          rep(\"e-w-z3\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Jue\", num:\"10\", titulo:\"Crossfit propio · Clean + Row\", sub:\"Escrito por mí · 60' en el gimnasio\", mes:S, obj:\"Oly + WOD + accesorio. Cero salto: mañana hay press pesado y trote.\", secciones:[\n        {nombre:\"Lo que dio el miércoles\", pres:\"Tu 4 × 1000, leído\",\n          nota:\"5:21 · 5:24 · 5:25 · 5:07.\\n\\nLOS TRES PRIMEROS SON EXACTOS. Pediste 5:20 en un rango de 5:15 a 5:25 y clavaste tres seguidos con 4 segundos de dispersión. Eso es control de ritmo, que es justo lo que te faltaba para el 10K.\\n\\nEL CUARTO A 5:07 ES EL ÚNICO ERROR, y es de los buenos: te sobró. Marcaste el último como duro y el costo en 6/10, o sea que a 5:25 estabas lejos del límite. Pero el objetivo de la sesión era que los cuatro salieran iguales, no que el último volara: 18 segundos de diferencia significa que los tres primeros podían haber sido más rápidos.\\n\\nEL NÚMERO QUE SACO: si sostenés 5:25 a RPE 6 con las piernas a 5/10, el 10K a 5:25 son 54:10. El sub-55 está adentro, y con margen.\\n\\nLA SEMANA QUE VIENE SUBE: 5 × 1000 a 5:15, mismo trote de 90\\\" entre tramos. Un tramo más y 10 segundos más rápido. Y la misma instrucción: los cinco iguales.\\n\\nEL HOLLOW HOLD SALE. Calambre de abdomen en la segunda serie porque 40 segundos es mucho para un patrón que no venías haciendo. Baja a 3 × 20\\\" o dead bug 10/10 — mismo trabajo, sin el calambre. Ya lo cambié en los días que quedan.\", items:[\n          chk(\"e-x-x0\",\"Leído\",\"marcar\")]},\n        {nombre:\"Cómo se arma tu hora\", pres:\"Las partes rotan según el día y la fase\",\n          nota:\"Las clases te quedaron básicas, así que los miércoles y jueves de crossfit los sigo escribiendo yo, ahora y después del 11/10. Anotá lo que te falte y lo ajusto.\\n\\nLAS PARTES ROTAN, NO SON FIJAS. Escribí antes que la hora tenía cinco partes siempre iguales y eso es de manual de clase básica, justo lo que criticás del box. En una plani real los días varían: gym+oly+fuerza+cond+acc uno, oly+fuerza+cond otro, gym+oly+cond otro, según la fase del ciclo. Las piezas disponibles son seis:\\nWARM UP · GYMNASTICS · WEIGHTLIFTING · FUERZA · CONDITIONING · ACCESORIO\\n\\nCON UN SOLO DÍA DE CROSSFIT POR SEMANA el problema es más duro que rotar: no podés rotar nada, tenés que elegir qué dos o tres de esas seis entran, y esa elección se argumenta cada semana. No se hereda de la semana pasada.\\n\\nLO QUE ELEGÍ HOY: oly + conditioning + accesorio. Sin bloque de gimnasia y sin skill aparte.\\n\\nPOR QUÉ NO VA GIMNASIA, LA VERSIÓN CORRECTA: primero la agregué porque la preguntaste y después la saqué culpando al hombro. Las dos veces me equivoqué de razón. La razón real es que hacés crossfit desde 2015 y con años de competitivo: el kipping de T2B y la vertical de manos no son algo que tengas que aprender, ni algo que se te caiga en cuatro semanas de una sesión semanal. Escribirte 5 minutos de kipping es hacerte practicar algo que ya tenés.\\n\\nLO QUE SÍ SE CAE RÁPIDO con un solo día por semana es el ciclado de barra y la tolerancia al metcon. Ahí van los 60 minutos. El kipping de T2B queda en el warm up, que es su lugar real.\\n\\nCUANDO EL CROSSFIT PASE A DOS O TRES DÍAS, la gimnasia tiene un bloque propio con volumen que sirva — no 10 minutos de relleno.\\n\\nFUERZA NO VA ACÁ ESTA SEMANA, y confirmás bien: la fuerza pura está el lunes (pierna pesada), el viernes (press pesado) y repartida el martes y sábado. Meterla también el jueves sería el cuarto día de empuje en cinco. El weightlifting de acá es técnica con carga media, que es otra cosa.\\n\\nLOS TIEMPOS DE HOY: 60 minutos con todo. Si te vas a pasar, lo que se cae es el accesorio.\", items:[\n          chk(\"e-x-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"Reemplazos\", pres:\"Si el aparato está ocupado · tenelo a mano\",\n          nota:\"Buena idea. Esta lista sirve para cualquier sesión de crossfit, no solo hoy — el gimnasio está lleno y no se pierde la sesión por esperar una máquina.\\n\\n500 m DE REMO →\\n· 12 shuttle run de 10 m (ida y vuelta = 1)\\n· 400 m en bici\\n· 400 m de cinta al 1%\\n· 40 cal de ski\\n· 30 kettlebell swing\\n\\n300 m DE REMO (calentamiento) →\\n· 8 shuttle run · 250 m bici · 300 m cinta\\n\\nBARRA OLÍMPICA OCUPADA →\\n· El complex con mancuernas, mismo esquema, mitad del peso total\\n· DB clean + front squat + push press, 1+1+1\\n\\nBARRA DE DOMINADAS OCUPADA →\\n· Toes to bar → 20 V-up o 15 hanging knee raise en anillas\\n· Dominadas → remo invertido en barra baja, o polea al pecho\\n\\nSIN GHD NI BANCO ROMANO →\\n· RDL con mancuernas 12 reps\\n· Superman 20 reps\\n· Hip thrust 15 reps\\n\\nSIN ESPACIO PARA FARMER CARRY →\\n· Suitcase hold 45\\\" por lado (una sola mancuerna, la más pesada)\\n\\nCUANDO USES UN REEMPLAZO, anotalo en las notas del ejercicio. Cambia cómo leo el tiempo del WOD.\", items:[\n          chk(\"e-x-x2\",\"Leído\",\"marcar\")]},\n        {nombre:\"1 · Warm up\", dur:\"08:00\", pres:\"2 rounds\", items:[\n          chk(\"e-x-w1\",\"300 m de remo\",\"suave, subiendo · o 8 shuttle run\"),\n          chk(\"e-x-w2\",\"10 air squats con pausa abajo\",\"10 reps\"),\n          chk(\"e-x-w3\",\"10 pass through con barra vacía\",\"10 reps\"),\n          chk(\"e-x-w4\",\"5 inchworm\",\"5 reps\"),\n          chk(\"e-x-w5\",\"Front rack stretch\",\"30 segundos\"),\n          chk(\"e-x-w6\",\"5 kipping de toes to bar\",\"2da vuelta · preparación del WOD\")]},\n        {nombre:\"2 · Weightlifting · Complex de clean\", dur:\"16:00\", pres:\"Cada 2' × 6 sets · 60-75% del Clean\",\n          nota:\"1 power clean + 1 front squat + 1 push jerk. Los tres sin bajar la barra.\\n\\nPOR QUÉ ESTE COMPLEX: el power clean te da la tirada, el front squat la posición de recepción, y el push jerk el envío arriba — los tres aparecen en cualquier WOD.\\n\\nSubida suave: los dos primeros sets son de entrada, los últimos tres son el trabajo. No es día de máximo. Si el front squat te obliga a bajar el codo, ese es el tope y te quedás ahí.\\n\\nEl push jerk se recibe en tijera corta o con los pies parejos, apoyando. No hay salto vertical acá.\\n\\nSI LA BARRA ESTÁ OCUPADA: el mismo complex con mancuernas, la mitad del peso total, 1+1+1.\", items:[\n          car(\"e-x-a1\",\"Set 1\",\"60% del 1RM Clean\",\"clean\",.60,3),\n          car(\"e-x-a2\",\"Set 2\",\"65% del 1RM Clean\",\"clean\",.65,3),\n          car(\"e-x-a3\",\"Set 3\",\"70% del 1RM Clean\",\"clean\",.70,3),\n          car(\"e-x-a4\",\"Set 4\",\"73% del 1RM Clean\",\"clean\",.73,3),\n          car(\"e-x-a5\",\"Set 5\",\"75% del 1RM Clean\",\"clean\",.75,3),\n          car(\"e-x-a6\",\"Set 6\",\"75% del 1RM Clean\",\"clean\",.75,3)]},\n        {nombre:\"3 · Conditioning\", dur:\"14:00\", pres:\"3 rounds for time · cap 15'\",\n          nota:\"3 rondas, lo más rápido que puedas:\\n· 500 m de remo\\n· 15 DB push press\\n· 15 toes to bar\\n\\nTENÉS RAZÓN CON EL CAP. 20 minutos era demasiado colchón para este WOD: el objetivo real son 11-13 minutos y el cap baja a 15. Un cap que no aprieta no ordena nada.\\n\\nEL PESO: arrancá la primera ronda con 15 kg por mano como dijiste, y si sale liviano subí a 20 kg para las rondas 2 y 3. Anotá con qué hiciste cada ronda. Con 25 kg de DB bench cómodo a 10 reps, 20 kg de push press a 15 reps te va a dar el trabajo que buscás — el push press mueve menos peso que el bench pero son 15 reps con el hombro ya cansado del complex.\\n\\nCÓMO CORRERLO: el remo es el motor, no la carrera. Andá a un ritmo que te deje llegar a la barra respirando — si llegás fundido, los 15 push press se parten en tres tandas y perdés más de lo que ganaste remando.\\n\\nT2B: si a mitad de la segunda ronda se rompen, pasá a knees to elbow y terminá. Usá el kipping que hiciste en el warm up, no reps de a una.\\n\\nSE RE-TESTEA EL 14 DE OCTUBRE, después de la carrera. Los benchmarks se repiten cada 6-8 semanas, no cada semana.\\n\\nREEMPLAZOS: sin remo, 12 shuttle run de 10 m o 400 m de bici. Sin barra de dominadas, 20 V-up.\", items:[\n          tim(\"e-x-c1\",\"Tiempo total\",\"mm:ss · objetivo 11-13' · cap 15'\",780),\n          lib(\"e-x-c4\",\"Peso del push press\",\"kg por mancuerna\",20,15),\n          rep(\"e-x-c2\",\"Rondas completadas\",\"de 3\",3),\n          rep(\"e-x-c3\",\"Cuánto costó\",\"0 = fácil · 10 = al límite\",8)]},\n        {nombre:\"4 · Accesorio\", dur:\"10:00\", pres:\"3 sets · rest 90\\\"\",\n          nota:\"Cadena posterior e isquio, liviano. Esto es lo que sostiene el volumen de carrera sin que aparezca una molestia nueva — y mañana se corre. Liviano de verdad: no es un bloque de fuerza.\\n\\nEL CORE CAMBIA: dead bug en vez de hollow hold, por el calambre de ayer. Mismo trabajo de pared abdominal, sin la contracción larga que te lo disparó. El hollow vuelve más adelante en series de 20\\\".\\n\\nSI NO HAY GHD NI BANCO ROMANO: RDL con mancuernas 12 reps, o superman 20 reps.\\n\\nEL FARMER CARRY va con lo más pesado que agarres — con mancuernas hexagonales de 40 kg, esas. Si no hay 40 m de espacio libre, suitcase hold 45\\\" por lado.\", items:[\n          chk(\"e-x-e0\",\"¿Hay GHD o banco romano?\",\"fijate y marcá si hay\"),\n          chk(\"e-x-e1\",\"Extensión de espalda, GHD o RDL\",\"15 reps × 3 sets\"),\n          chk(\"e-x-e2\",\"Copenhagen plank\",\"10/10 × 3 sets\"),\n          chk(\"e-x-e3\",\"Dead bug\",\"10/10 × 3 sets · reemplaza al hollow\"),\n          lib(\"e-x-e4\",\"Farmer carry · 40 m × 4\",\"kg por mano\",40,4)]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"Estiramiento de gemelo y sóleo, 60\\\" por lado. Mañana hay trote.\", items:[\n          chk(\"e-x-z1\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\"),\n          rep(\"e-x-z2\",\"Piernas al terminar\",\"0 = frescas · 10 = fundidas\",5),\n          rep(\"e-x-z3\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Vie\", num:\"11\", titulo:\"Torso pesado + 4 km\", sub:\"Doble · gimnasio 17 h, 4 km a las 20\", mes:S, obj:\"Encontrar tus kilos de press y anotarlos todos. A la noche, 4 km continuos y suaves.\", secciones:[\n        {nombre:\"Cambió el fin de semana\", pres:\"Leer primero · reescrito el 11/9\",\n          nota:\"NO HAY FÚTBOL MAÑANA. Avisaste que no podés ir, y eso cambia dos días.\\n\\nHOY: se cae la bici de 30' en Z2. Ya tenés una hora de torso a las 17 y 4 km a las 20; la bici solo sumaba fatiga sin aportarle nada al 10K. Se justificaba cuando el viernes era tu única sesión aeróbica de la semana — ahora no lo es.\\n\\nLA CORRIDA BAJA A 4 KM, no 8. Decisión tuya y está bien: primera sema
