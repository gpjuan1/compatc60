na del bloque, gemelo recién limpio y mañana hay metcon. La larga de verdad arranca el jueves 17.\\n\\nEL PRESS SE QUEDA PESADO. Sin partido al mediodía de mañana no hay razón para hacerle taper al viernes, así que los porcentajes van completos. Es el dato que más me falta. Vale esto y no la lista corta que te pasé por chat antes de saber lo del fútbol.\\n\\nMAÑANA: crossfit en el gimnasio en lugar del partido. Chipper de 25-28', cero impacto.\", items:[\n          chk(\"e-v-x0\",\"Leído\",\"marcar\")]},\n        {nombre:\"El día pesado de tren superior\", pres:\"Leer una vez\",\n          nota:\"De los cuatro días de torso de la semana, este es el pesado. El martes fue tracción, el miércoles empuje moderado — acá van los kilos.\\n\\nCon tu bench estimado en 110, los porcentajes de abajo dan números reales. La regla de siempre: el kilo es sugerencia, el RPE manda. Si sale liviano, subís y lo anotás.\\n\\nLAS ZANCADAS NO VAN HOY. Estaban escritas acá, pero esta semana la pierna ya tuvo su dosis el lunes y a la noche corrés. Vuelven la semana que viene, en este mismo día, con el bloque excéntrico completo.\\n\\nCERO PIERNA HOY. Ni gemelo.\", items:[\n          chk(\"e-v-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"SESIÓN 1 · Fuerza tren superior\", dur:\"45:00\", pres:\"Superseries · a la tarde\",\n          nota:\"Empuje y tracción alternados, en superserie: te ahorra la mitad del tiempo y el hombro descansa mientras trabaja la espalda.\\n\\nLos tres primeros ítems son press banca con porcentajes de tu bench de 110. Si no hay banco plano libre, floor press con mancuernas y anotá el peso por mano.\\n\\nLA POLEA VA EN SERIES FIJAS, no en pirámide: 4 × 8 a 55 kg, las cuatro al mismo peso. El martes hiciste 47-53-59-65 bajando reps — lo improvisaste vos porque te sobraba tiempo y estaba bien, pero para prescribir no sirve: si se mueven el peso y las reps a la vez, nunca sé si mejoraste. Un solo número que comparás cada semana. Si la cuarta serie sale fácil, la que viene 60.\\n\\nEL REMO CON BARRA IGUAL: 4 × 8 a 75 kg, las cuatro iguales. 75 te salió cómodo el martes, así que es el punto de partida y no el techo del día.\\n\\nLOS KILOS DEL FINAL, SACADOS DE TUS DATOS (tenías razón, eran genéricos):\\n\\nPRESS INCLINADO · 20 kg por mancuerna × 10. El miércoles hiciste DB bench 25 kg × 10 cómodo; el inclinado rinde 15-20% menos, así que 20 kg te da las mismas 10 reps con el mismo margen. Si a la tercera serie sobra, 22,5.\\n\\nELEVACIONES LATERALES · 10 kg × 12. Con 7,5 kg × 15 anotaste justo. A menos reps entra un kilo más. Si el codo se dobla o hay envión de cadera, volvé a 7,5.\\n\\nCURL · 15 kg × 8. Vos mismo lo escribiste el martes: 12,5 kg está bien trabajado y para subir hay que bajar reps. Ahí está — 15 kg y 8 reps.\\n\\nTRÍCEPS EN POLEA · 30 kg × 12. Referencia de tus poleas: face pull 35 kg justo, polea al pecho 65 kg. Si no hay polea libre, press francés con barra 20 kg × 12 o fondos 3 × 10.\\n\\nESTO ES LO QUE MÁS GANÁS CON EL GIMNASIO. En casa tenés techo de 27,5 kg por mano en press y ya lo tocás. Con barra y mancuernas de gimnasio, el tren superior tiene años de progresión por delante.\", items:[\n          car(\"e-v-f1\",\"Press banca · set 1\",\"4 × 6 · 68% del bench\",\"bench\",.68,6),\n          car(\"e-v-f1b\",\"Press banca · set 2\",\"72% del bench\",\"bench\",.72,6),\n          car(\"e-v-f1c\",\"Press banca · sets 3-4\",\"76% del bench\",\"bench\",.76,6),\n          lib(\"e-v-f2\",\"Remo con barra · 4 × 8\",\"kg · las 4 series al mismo peso\",75,8),\n          lib(\"e-v-f6\",\"Polea al pecho · 4 × 8\",\"kg · las 4 series al mismo peso\",55,8),\n          lib(\"e-v-f3\",\"Press inclinado con mancuernas · 3 × 10\",\"kg por mancuerna\",20,10),\n          chk(\"e-v-f4\",\"Dominadas 3 × máximas\",\"anotá las tres en notas\"),\n          lib(\"e-v-f5a\",\"Elevaciones laterales · 3 × 12\",\"kg por mancuerna\",10,12),\n          lib(\"e-v-f5b\",\"Curl con mancuernas · 3 × 8\",\"kg por mancuerna\",15,8),\n          lib(\"e-v-f5c\",\"Tríceps en polea · 3 × 12\",\"kg de la polea\",30,12),\n          rep(\"e-v-f7\",\"Cuánto duró todo\",\"minutos · para calibrar\",60)]},\n        {nombre:\"SESIÓN 2 · 4 km continuos\", pres:\"20 h · suaves, sin bici\",\n          nota:\"4 KM CONTINUOS A 5:40-5:50/km. Nada de bici antes. Salís, corrés los cuatro y volvés.\\n\\nRITMO: es rodaje, no calidad. El miércoles hiciste 4 × 1000 a 5:21 / 5:24 / 5:25 / 5:07 — esto tiene que ir medio minuto por kilómetro más lento que eso. Si el primer kilómetro sale en 5:20 estás corriendo mal el día.\\n\\nPOR QUÉ CORTOS: pedís precaución y corresponde. Segunda corrida de la semana, tres horas después de una hora de press, gemelo recién limpio y mañana hay metcon. Cuatro kilómetros suaves acá valen más que ocho forzados.\\n\\nSI EL GEMELO DICE ALGO, CORTÁS. No hay nada que ganar hoy. Estamos a 30 días de la carrera y la larga de verdad es el jueves 17.\", items:[\n          dis(\"e-j-r1\",\"Distancia\",\"km · objetivo 4\",4),\n          tim(\"e-j-r2\",\"Tiempo total\",\"mm:ss\",1400),\n          rep(\"e-j-r3\",\"Esfuerzo\",\"0 = charlando · 10 = duro\",4),\n          rep(\"e-j-r4\",\"Gemelo derecho\",\"0-10\",0)]},\n        {nombre:\"Cierre\", pres:\"Post sesión · mañana hay metcon\", items:[\n          chk(\"e-j-z1\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\")]}\n      ]},\n      { dia:\"Sáb\", num:\"12\", titulo:\"Crossfit · chipper\", sub:\"En lugar del partido · gimnasio\", mes:S, obj:\"Un chipper largo y continuo, cero impacto, en el lugar que dejó el fútbol.\", secciones:[\n        {nombre:\"Por qué crossfit hoy\", pres:\"Leer una vez\",\n          nota:\"NO HAY PARTIDO, así que el sábado queda libre y lo mejor que puede entrar ahí es crossfit. Con esto la semana cierra con dos días de crossfit (jueves y hoy) en lugar de uno, que es exactamente hacia dónde va el plan después del 11/10.\\n\\nQUÉ NO ES: no es un día de fuerza. Ayer fue el día pesado de press y anoche corriste. Hoy es metabólico, continuo, con pesos que te dejan moverte sin parar.\\n\\nCERO IMPACTO. Nada de box jumps ni burpees con salto: el gemelo derecho todavía está en observación desde el 28/8 y las bajadas excéntricas repetidas son justo lo que lo despertó.\\n\\nRITMO CONTINUO, NO SPRINT. Venís de correr anoche. El objetivo es terminar los siete bloques sin quedarte parado más de 10 segundos entre uno y otro, no romper un récord.\", items:[\n          chk(\"e-s-x1\",\"Leído\",\"marcar\")]},\n        {nombre:\"Warm up\", dur:\"08:00\", pres:\"Antes del chipper\",\n          nota:\"2' de bici suave, después: 10 pasadas de cadera con la barra vacía, 10 press de hombro con barra vacía, 10 goblet squat con 10 kg, 10 remos con mancuerna liviana. Una vuelta sola, sin apuro.\\n\\nMOVILIDAD DE TOBILLO Y GEMELO antes de empezar, 60\\\" por lado. Es lo único que no se salta.\", items:[\n          chk(\"e-s-w1\",\"Warm up completo\",\"marcar\"),\n          chk(\"e-s-w2\",\"Movilidad de tobillo y gemelo\",\"60\\\" por lado\")]},\n        {nombre:\"EL CHIPPER · 7 bloques en orden\", dur:\"28:00\", pres:\"Cap 28' · una sola vuelta\",\n          nota:\"Se hace en orden, de arriba a abajo, una sola vez. No hay rondas.\\n\\n500 m SKI\\n50 GOBLET SQUAT · 22,5 kg\\n40 DB SNATCH ALTERNADO · 22,5 kg (20 por brazo)\\n1000 m REMO\\n30 PUSH PRESS · barra 40 kg\\n20 BURPEES SIN SALTO\\n2000 m BICI\\n\\nPOR QUÉ ESE ORDEN: el ski es el bloque más caro en pulso y conviene gastarlo fresco; además te calienta el hombro para el push press. La bici va al final porque es lo más amable con el gemelo y te deja bajar el pulso mientras todavía trabajás.\\n\\nSI EL DISPLAY DEL REMO NO ANDA (o cualquiera de los tres), vas por tiempo:\\nSki 500 m → 2' a ritmo firme, no sprint.\\nRemo 1000 m → 4'30\\\" a 24-26 paladas por minuto.\\nBici 2000 m → 4' con cadencia alta y resistencia media.\\nSon 10'30\\\" de máquina en total. Si tenés que recortar algo, recortás la bici del final — nunca el remo.\\n\\nBURPEES SIN SALTO: bajás al piso, subís, y al pararte hacés un step up en lugar de saltar. No hay salto en ningún momento y no hay palmada arriba.\\n\\nLOS PESOS SON PARA MOVERSE. Goblet 22,5 y DB snatch 22,5 con la misma mancuerna, así no perdés tiempo cambiando. Push press con 40 kg, que el miércoles te salió duro a 10 reps pero acá van en sets de 5-6 con pausa. Si a los 15 se parte, bajás a 35 y seguís.\", items:[\n          tim(\"e-s-c1\",\"Tiempo total del chipper\",\"mm:ss · cap 28'\",1680),\n          lib(\"e-s-c2\",\"Goblet squat · peso usado\",\"kg\",22.5,50),\n          lib(\"e-s-c3\",\"DB snatch · peso usado\",\"kg\",22.5,40),\n          lib(\"e-s-c4\",\"Push press · peso usado\",\"kg de la barra\",40,30),\n          chk(\"e-s-c5\",\"Display del remo · anduvo\",\"marcar si anduvo\"),\n          rep(\"e-s-c6\",\"Dónde se te partió\",\"0 = nunca · 10 = todo el tiempo\",5),\n          rep(\"e-s-c7\",\"RPE del chipper\",\"0-10 · objetivo 8\",8)]},\n        {nombre:\"Cierre\", pres:\"Post sesión · mañana descanso\",\n          nota:\"Estiramiento de gemelo y sóleo, 60\\\" por lado, y nada más. Mañana es descanso completo y el lunes arranca la semana tipo con pierna bilateral pesada.\", items:[\n          chk(\"e-s-z1\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\"),\n          rep(\"e-s-p2\",\"Cómo quedaste\",\"0 = entero · 10 = fundido\",5),\n          rep(\"e-s-p3\",\"Gemelo derecho\",\"0-10\",0)]}\n      ]},\n      { dia:\"Dom\", num:\"13\", titulo:\"Descanso\", sub:\"Cierre de semana 1\", mes:S, obj:\"No entrenar. Y pasarme lo que falta de jueves, viernes y sábado.\", secciones:[\n        {nombre:\"Descanso\", pres:\"Nada\",\n          nota:\"Sin caminata obligatoria, sin nada. Seis días de entrenamiento necesitan un día entero libre.\\n\\nY sin fútbol el sábado, la semana cerró con más trabajo de gimnasio del previsto: descansá de verdad, que el lunes arranca la semana tipo con pierna bilateral pesada.\", items:[\n          rep(\"e-d-z1\",\"Cómo te levantaste\",\"0 = entero · 10 = roto\",3)]},\n        {nombre:\"Lo que necesito de la semana\", pres:\"Para escribir la semana 2\",\n          nota:\"LO QUE YA TENGO: el gimnasio medido el 7/9, la fuerza de pierna del lunes, la tracción del martes, el empuje del miércoles y los cuatro tiempos del 4 × 1000. Con eso ya reescribí el mapa de las cinco semanas y los kilos del viernes y del sábado.\\n\\nLO QUE FALTA, CUATRO COSAS:\\n\\n1. El WOD del jueves: tiempo total y con qué peso hiciste el push press en cada ronda. Define si el conditioning de la semana 2 sube de carga o de rondas.\\n2. Los kilos reales del press del viernes. Los escribí desde tu bench estimado de 110, que nunca testeamos — si el 76% salió liviano o imposible, corrijo el estimado.\\n3. Cuánto duraron el jueves, el viernes y el sábado. Con tres números dejo de adivinar cuánto contenido entra en tu hora.\\n4. El tiempo total del chipper del sábado y con qué pesos lo hiciste. Es el primer metcon largo escrito por mí en el gimnasio nuevo — con eso calibro los dos días de crossfit del ciclo post-10K.\\n\\nY si los seis días fueron demasiado, decilo: la semana 2 sale con cinco.\\n\\nEstamos a 28 días de la carrera.\", items:[\n          rep(\"e-d-z2\",\"Semana completada\",\"días de 6\",6),\n          chk(\"e-d-z3\",\"Datos del jueves al sábado pasados\",\"marcar\")]}\n      ]}\n    ];\n  }\n  plan(){ return this.semanas()[this.state.semana].dias; }\n  planS4(){\n    const dis = (id,t,d,km)=>({id,t,d,tipo:\"dist\",km});\n    const chk = (id,t,d)=>({id,t,d,tipo:\"chk\"});\n    const car = (id,t,d,lift,pct,reps)=>({id,t,d,tipo:\"car\",lift,pct,reps});\n    const lib = (id,t,d,peso,reps)=>({id,t,d,tipo:\"car\",peso,reps});\n    const rep = (id,t,d,reps)=>({id,t,d,tipo:\"rep\",reps});\n    const tim = (id,t,d,seg)=>({id,t,d,tipo:\"tim\",seg});\n    const ron = (id,t,d)=>({id,t,d,tipo:\"ron\"});\n    const pend = (dia,num,titulo,sub,nota,items)=>({dia,num,titulo,sub,mes:\"septiembre\",secciones:[{nombre:\"Sin plani todavía\", pres:\"Pendiente\", nota:nota, items:items}]});\n    return [\n      { dia:\"Lun\", num:\"31\", titulo:\"Snatch completo + Back Squat\", sub:\"Adaptado · 58' · llegás fresco\", secciones:[\n        {nombre:\"Warm up\", dur:\"05:00\", pres:\"2 rounds · IGUAL\", items:[\n          chk(\"d-l-w1\",\"90-90 hip rotation w/ hip thrust\",\"10 reps\"),\n          chk(\"d-l-w2\",\"Full T Hip Opener\",\"10/10\"),\n          chk(\"d-l-w3\",\"Shoulders Global\",\"10 reps\"),\n          chk(\"d-l-w4\",\"Overhead Squat con banda\",\"10 reps\")]},\n        {nombre:\"Activación · Pliometría\", dur:\"05:00\", pres:\"Box jump 3-2-2-1-1 · ADAPTADO\",\n          nota:\"PLANI: construir altura en el salto al cajón, por calidad.\\nAHORA: misma progresión pero con techo de altura y BAJANDO CAMINANDO del cajón en cada rep, sin rebote.\\n\\nPOR QUÉ: el viernes en la rep 10 del último set el gemelo derecho te avisó. La bajada de un box jump alto es el pico de carga excéntrica de gemelo y aquiles de toda la semana, y faltan seis semanas para el 10K. Subir por altura sirve igual; bajar de un salto no te suma nada.\\n\\nElegí la altura donde llegás sin estirar la cadera en el aire y quedate ahí. Si el gemelo dice algo, cortás la progresión y pasás al snatch.\", items:[\n          rep(\"d-l-p1\",\"Altura alcanzada\",\"cm del cajón\",60),\n          rep(\"d-l-p2\",\"Gemelo derecho durante el bloque\",\"0-10 · si pasa de 2, cortar\",0),\n          chk(\"d-l-p3\",\"Bajada caminando en todas las reps\",\"marcar\")]},\n        {nombre:\"Weightlifting · Bloque A\", dur:\"06:00\", pres:\"Cada 2' × 3 sets · 45-65% Snatch · IGUAL\",\n          nota:\"1 slow pull power snatch + 1 hang squat snatch con pausa en la recepción.\\n\\nSin cambios. Son tres sets técnicos y el más pesado es el 65%.\", items:[\n          car(\"d-l-a1\",\"Set 1\",\"45% del 1RM Snatch\",\"snatch\",.45,2),\n          car(\"d-l-a2\",\"Set 2\",\"55% del 1RM Snatch\",\"snatch\",.55,2),\n          car(\"d-l-a3\",\"Set 3\",\"65% del 1RM Snatch\",\"snatch\",.65,2)]},\n        {nombre:\"Weightlifting · Bloque B\", dur:\"06:00\", pres:\"Cada 2' × 3 sets · 70-80% Snatch · VUELVE\",\n          nota:\"1 snatch pull + 1 low hang squat snatch + 1 overhead squat.\\n\\nPOR QUÉ VUELVE (dos semanas seguidas afuera): el viernes lo hiciste igual, subiste hasta 88 y salió bien. Y el bloque de pierna de hoy es 3×2, no 4×3 — seis reps de squat dejan lugar para tres sets de snatch. Además el sábado no fuiste al box: llegás al lunes sin nada acumulado.\\n\\nEl overhead squat al final del complejo es el juez. Si a los 60 se te va la barra adelante o el codo cede, ese es tu tope del día: no subas al 80%.\", items:[\n          car(\"d-l-b1\",\"Set 1\",\"70% del 1RM Snatch\",\"snatch\",.70,3),\n          car(\"d-l-b2\",\"Set 2\",\"75% del 1RM Snatch\",\"snatch\",.75,3),\n          car(\"d-l-b3\",\"Set 3\",\"80% del 1RM Snatch\",\"snatch\",.80,3)]},\n        {nombre:\"Fuerza · Back Squat\", dur:\"09:00\", pres:\"Cada 3' × 3 sets · 2 reps · RPE 8-8.5 · IGUAL\",\n          nota:\"80-85% del 1RM. Sin cambios: es el bloque más importante del día.\\n\\nReferencia: el lunes pasado cerraste 112 × 3 en Justo, y el viernes el back squat no se hizo, así que la pierna viene de una sola sesión de squat en nueve días. 119 × 2 tiene que salir.\", items:[\n          car(\"d-l-f1\",\"Set 1\",\"2 reps · 80%\",\"backsq\",.80,2),\n          car(\"d-l-f2\",\"Set 2\",\"2 reps · 82%\",\"backsq\",.82,2),\n          car(\"d-l-f3\",\"Set 3\",\"2 reps · 85%\",\"backsq\",.85,2)]},\n        {nombre:\"Conditioning\", dur:\"12:00\", pres:\"EMOM 3' × 4 sets · 45/30 kg · ADAPTADO\",\n          nota:\"12 burpees over the bar · 9 deadlift · 7 hang power snatch · 5 overhead squats. Ritmo fluido en la barra (barbell cycling).\\n\\nÚNICO CAMBIO: los burpees over the bar van LATERALES CON PASO por encima de la barra, no salto. Son 48 burpees en el bloque; con salto son 48 despegues y 48 aterrizajes de gemelo el mismo día del box jump. Con paso, el estímulo cardiovascular es idéntico.\\n\\nEl resto queda: 45 kg en deadlift, hang power snatch y overhead squat es carga liviana y el trabajo es de ciclado de barra, que es justo lo que te falta.\\n\\nSi no cierran las rondas dentro de los 3', recortá los burpees a 9 y mantené la barra entera.\", items:[\n          ron(\"d-l-c1\",\"Set 1\",\"reps completadas en 3'\"),\n          ron(\"d-l-c2\",\"Set 2\",\"reps completadas en 3'\"),\n          ron(\"d-l-c3\",\"Set 3\",\"reps completadas en 3'\"),\n          ron(\"d-l-c4\",\"Set 4\",\"reps completadas en 3'\")]},\n        {nombre:\"Accesorio\", dur:\"08:00\", pres:\"3 sets · rest 2:00 · IGUAL\",\n          nota:\"10/10 three point dumbbell row · 8 YTW. Liviano, por calidad. Sin cambios: es hombro y dorsal, no interfiere con nada.\", items:[\n          lib(\"d-l-e1\",\"Three point DB row\",\"10/10 · liviano\",22.5,10),\n          chk(\"d-l-e2\",\"YTW\",\"8 reps × 3 sets\"),\n          chk(\"d-l-e3\",\"3 sets completos\",\"marcar al terminar\")]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"El gemelo derecho es el dato de la semana. Si termina en 3 o más, el martes el rodaje se cambia por remo o bici y no se discute.\\n\\nY la corrida: esta semana necesito tres salidas, no dos. El plan es martes rodaje, jueves Z2 + trote, sábado o domingo el largo. Hoy no se corre.\", items:[\n          rep(\"d-l-z1\",\"Gemelo derecho al terminar\",\"0 = bien · 10 = avisando\",1),\n          rep(\"d-l-z2\",\"Piernas al terminar\",\"0 = frescas · 10 = fundidas\",4)]}\n      ]},\n      { dia:\"Mar\", num:\"1\", titulo:\"Empuje / Tracción + Rodaje\", sub:\"PROPIA · 55' + 25' de corrida\", mes:\"septiembre\", secciones:[\n        {nombre:\"Cómo armé este día\", pres:\"Sin plani del coach\",\n          nota:\"Este día lo escribí yo, con la estructura de las cuatro semanas que ya registramos: warm up → activación → weightlifting → fuerza → conditioning → accesorio, dentro de la hora.\\n\\nCRITERIO DEL MARTES: es el día que menos toca la pierna en toda la semana. El lunes fue snatch + back squat + EMOM con barra, y el jueves es la sesión de carrera. Entonces el martes es torso: empuje vertical, tracción, y un conditioning que no tenga ni un salto. Así la pierna descansa 48 hs entre el back squat del lunes y el trote del jueves, y el rodaje de hoy entra sin pelearse con nada.\\n\\nSé lo que no sé: no vi tu técnica ni tengo tus RM de press. Los kilos de abajo son un punto de partida — si el primer set sale fácil, subilo y anotá el número real; eso es lo que hace que la próxima semana salga mejor calibrada.\", items:[\n          chk(\"d-m-x1\",\"Leído antes de entrenar\",\"marcar\")]},\n        {nombre:\"Warm up\", dur:\"06:00\", pres:\"2 rounds\", items:[\n          chk(\"d-m-w1\",\"Scap pull ups\",\"10 reps\"),\n          chk(\"d-m-w2\",\"Push up to down dog\",\"8 reps\"),\n          chk(\"d-m-w3\",\"Rotación torácica en cuadrupedia\",\"10/10\"),\n          chk(\"d-m-w4\",\"Band pull apart\",\"15 reps\")]},\n        {nombre:\"Activación\", dur:\"04:00\", pres:\"2 rounds · sin salto\",\n          nota:\"Nada de pliometría hoy. El gemelo derecho avisó el viernes y la carga de impacto de la semana va toda al jueves.\", items:[\n          chk(\"d-m-p1\",\"Hollow hold\",\"30 segundos\"),\n          chk(\"d-m-p2\",\"Ring row con pausa 2\\\" arriba\",\"8 reps\")]},\n        {nombre:\"Fuerza A · Strict Press\", dur:\"12:00\", pres:\"Cada 2'30\\\" × 4 sets · 5 reps · RPE 7-8\",\n          nota:\"Empuje vertical estricto, sin ayuda de pierna. El overhead squat del lunes y el jerk del viernes te piden hombro estable arriba; el strict press es lo que lo construye y es lo que menos aparece en las planis que vi.\\n\\nSubí 2.5 kg por set mientras las 5 reps salgan sin quiebre de lumbar. Si el set 3 se pone feo, repetí el peso en el 4 y listo.\", items:[\n          lib(\"d-m-f1\",\"Set 1\",\"5 reps\",40,5),\n          lib(\"d-m-f2\",\"Set 2\",\"5 reps\",42.5,5),\n          lib(\"d-m-f3\",\"Set 3\",\"5 reps\",45,5),\n          lib(\"d-m-f4\",\"Set 4\",\"5 reps\",45,5)]},\n        {nombre:\"Fuerza B · Tracción\", dur:\"08:00\", pres:\"4 sets · alternado con el press\",\n          nota:\"Va intercalado en los descansos del press: mientras la barra descansa, hacés la tracción. Así el bloque entra en 12' en vez de 20'.\\n\\nSi las strict pull ups no salen en series de 5, hacé negativas de 4\\\" o usá banda. La cuenta es de reps buenas, no de reps.\", items:[\n          rep(\"d-m-t1\",\"Set 1 · strict pull ups\",\"reps\",5),\n          rep(\"d-m-t2\",\"Set 2 · strict pull ups\",\"reps\",5),\n          rep(\"d-m-t3\",\"Set 3 · strict pull ups\",\"reps\",4),\n          rep(\"d-m-t4\",\"Set 4 · strict pull ups\",\"reps\",4)]},\n        {nombre:\"Conditioning\", dur:\"15:00\", pres:\"3 rounds · descanso 1' · CERO IMPACTO\",\n          nota:\"500 m remo · 12 DB push press (2×15 kg) · 12 ring rows.\\n\\nRitmo objetivo: el remo a 2:15-2:20/500 m, más rápido que tu Z2 de 2:40, pero son 500 m sueltos con descanso. La idea es respirar fuerte sin que la pierna trabaje.\\n\\nAnotá el tiempo total de cada round: es el número que compara semana contra semana.\", items:[\n          tim(\"d-m-c1\",\"Round 1\",\"tiempo total\",300),\n          tim(\"d-m-c2\",\"Round 2\",\"tiempo total\",300),\n          tim(\"d-m-c3\",\"Round 3\",\"tiempo total\",300)]},\n        {nombre:\"Accesorio\", dur:\"06:00\", pres:\"3 sets\",\n          nota:\"Hombro posterior y core. Liviano, por calidad.\", items:[\n          chk(\"d-m-e1\",\"Face pull con banda\",\"15 reps × 3 sets\"),\n          chk(\"d-m-e2\",\"Dead bug\",\"10/10 × 3 sets\"),\n          chk(\"d-m-e3\",\"3 sets completos\",\"marcar al terminar\")]},\n        {nombre:\"Rodaje Z2\", pres:\"20-25' · aparte de la sesión\",\n          nota:\"Salida 1 de 3 de la semana. Suave: tenés que poder hablar. Si el gemelo terminó el lunes en 3 o más, esto se hace en remo o bici al mismo RPE y no se discute.\\n\\nSi podés, separalo del box por unas horas — a la siesta, como el sábado, funcionó bien.\", items:[\n          tim(\"d-m-r1\",\"Tiempo de rodaje\",\"objetivo 20-25'\",1320),\n          dis(\"d-m-r2\",\"Distancia\",\"km\",3.5),\n          rep(\"d-m-r3\",\"Gemelo durante el rodaje\",\"0-10 · si pasa de 2, cortar\",0)]}\n      ]},\n      { dia:\"Mié\", num:\"2\", titulo:\"Corrida + Tren superior en casa\", sub:\"HOY · 25' de corrida + 40' de pesas pesadas\", mes:\"septiembre\", secciones:[\n        {nombre:\"El orden: correr primero\", pres:\"Respuesta corta · sí\",\n          nota:\"Corré primero, después las pesas. Tres razones:\\n\\n1. La corrida es la prioridad de las próximas seis semanas. Lo que va primero es lo que hacés con las piernas frescas y la cabeza entera.\\n2. El trabajo de pesas es todo de tren superior. No le saca nada a la corrida: no hay competencia entre los dos bloques, que es justo por qué esta combinación funciona.\\n3. Al revés sí molesta un poco. Después de 40' de press y remo el tronco está cansado, y correr con el torso fatigado te empeora la postura — hombro adelante, respiración más corta.\\n\\nDejá 5-10 minutos entre los dos. Tomás agua, se te normaliza la respiración, y arrancás las pesas.\\n\\nSi por horario tenés que hacer las pesas primero, no es un desastre: bajá la corrida a 20' y andá suave.\", items:[\n          chk(\"d-xc-ord\",\"Leído\",\"marcar\")]},\n        {nombre:\"Corrida\", dur:\"25:00\", pres:\"Salida 1 de 3 · Z2 · reemplaza la de ayer\",\n          nota:\"Ayer no se corrió, así que esta es la primera de las tres salidas de la semana. Sigue siendo la de rodaje suave: ritmo conversado, 6:50-7:10/km. Nada de apretar.\\n\\nEl jueves — mañana — es la sesión grande de carrera (25' sin impacto + 15-18' de trote). Así que hoy 25' y suave; hoy no es el día de sacar un ritmo.\\n\\nGemelo derecho: si aparece algo de 3 o más, parás. El aviso del viernes sigue siendo el dato que cuido toda la semana.\", items:[\n          tim(\"d-xc-r1\",\"Tiempo\",\"objetivo 25'\",1500),\n          dis(\"d-xc-r2\",\"Distancia\",\"km\",3.5),\n          rep(\"d-xc-r3\",\"Gemelo durante la corrida\",\"0-10 · si pasa de 2, cortar\",0)]},\n        {nombre:\"Tu material · la matemática de los discos\", pres:\"Leer una vez\",\n          nota:\"LO QUE TENÉS: dos mancuernas armables de 2,5 kg cada barra, y 50 kg de discos en total — 8 de 5 kg (40 kg) y 4 de 2,5 kg (10 kg).\\n\\nLA CUENTA QUE MANDA: los discos son un solo juego. Si cargás las dos mancuernas, cada una se lleva la mitad. Si cargás una sola, se lleva todo. De ahí salen dos escalas distintas y son las únicas que existen en tu casa:\\n\\nLAS DOS IGUALES — peso real de cada mancuerna:\\n7,5 · 12,5 · 17,5 · 22,5 · 27,5 kg\\n(discos: 5 · 10 · 15 · 20 · 25, más los 2,5 de la barra)\\nTecho: 27,5 kg por mano. Las dos manos juntas, 55 kg.\\n\\nUNA SOLA CON TODO — peso real:\\n32,5 · 37,5 · 42,5 · 47,5 · 52,5 kg\\n(discos: 30 · 35 · 40 · 45 · 50, más la barra)\\nTecho: 52,5 kg.\\n\\nEsos diez números son todo tu gimnasio. No hay nada en el medio: el salto mínimo es de 5 kg porque los discos entran de a dos, uno por lado.\\n\\nCONSECUENCIA PARA ENTRENAR PESADO: el peso de verdad está en el trabajo a un brazo. Con las dos cargadas llegás a 27,5 por mano — que para press estricto ya es pesado para vos: 55 kg entre las dos manos, diez arriba de los 45 que movés en barra. Pero para remo, 27,5 por mano es liviano. El remo pesado va a un brazo: 52,5 kg.\\n\\nY UNA REGLA PRÁCTICA: no armes superseries que mezclen las dos escalas. Cambiar de 52,5 a un brazo a 27,5 por mano te hace desarmar los discos entre set y set y se te va la sesión en eso. Un bloque, una configuración. Abajo está ordenado así: se cambian los discos dos veces en todo el entrenamiento.\", items:[\n          chk(\"d-xc-m1\",\"Barra de mancuerna: 2,5 kg\",\"confirmado · ya está en los números\")]},\n        {nombre:\"Warm up\", dur:\"04:00\", pres:\"2 rounds · liviano\",\n          nota:\"Corto, ya venís caliente de la corrida. Esto es solo para dejar el hombro listo para cargar.\", items:[\n          chk(\"d-xc-cw1\",\"Band pull apart (o brazos en cruz)\",\"15 reps\"),\n          chk(\"d-xc-cw2\",\"Círculos de hombro adelante y atrás\",\"10/10\"),\n          chk(\"d-xc-cw3\",\"Push up lento\",\"8 reps\"),\n          chk(\"d-xc-cw4\",\"Remo liviano a un brazo\",\"10/10 con 17,5 kg\")]},\n        {nombre:\"Bloque 1 · Tracción pesada\", dur:\"14:00\", pres:\"CONFIG: una mancuerna, todo · hasta 52,5 kg · 5 sets · descanso 2'\",\n          nota:\"DB Row a un brazo. Armá UNA sola mancuerna y ponele todo lo que tengas.\\n\\nSubida por sets, peso real: 42,5 → 47,5 → 52,5 → 52,5 → 52,5 kg. Los últimos tres sets al techo, 6 reps por brazo, RPE 8. Si los 52,5 salen con margen, la próxima subimos reps antes que peso — no tenés más discos, así que de acá en adelante la progresión es tempo y reps.\\n\\nCÓMO: una mano y una rodilla apoyadas en una silla o el borde de la cama, espalda plana, tirás con el codo pegado al cuerpo y aguantás 1 segundo arriba. Ese segundo es lo que convierte 52,5 kg en trabajo de dorsal y no en un envión de cadera.\\n\\nEste es el bloque más pesado del día y por eso va primero.\",\n          items:[\n          lib(\"d-xc-a1\",\"Set 1 · DB Row 1 brazo\",\"6/6 · 40 de discos + barra\",42.5,6),\n          lib(\"d-xc-a2\",\"Set 2 · DB Row 1 brazo\",\"6/6 · 45 de discos + barra\",47.5,6),\n          lib(\"d-xc-a3\",\"Set 3 · DB Row 1 brazo\",\"6/6 · todo · techo\",52.5,6),\n          lib(\"d-xc-a4\",\"Set 4 · DB Row 1 brazo\",\"6/6 · todo · techo\",52.5,6),\n          lib(\"d-xc-a5\",\"Set 5 · DB Row 1 brazo\",\"6/6 · todo · techo\",52.5,6)]},\n        {nombre:\"Bloque 2 · Empuje pesado\", dur:\"16:00\", pres:\"CONFIG: las dos al techo, 27,5 kg cada una · descanso 2'\",\n          nota:\"Repartí los discos: 2 de 5 kg + 1 de 2,5 kg por lado en cada mancuerna. Eso da 27,5 kg por mano contando la barra. Con esa configuración se hacen los dos ejercicios seguidos, sin volver a tocar los discos.\\n\\nB1 · DB STRICT PRESS de pie — 5 sets × 5 reps, RPE 8. Estricto: sin flexión de rodilla, sin arquear la lumbar. Son 55 kg entre las dos manos, diez kilos arriba de tu press en barra — para vos esto es pesado de verdad, tratalo como tal.\\n\\nB2 · DB FLOOR PRESS — 4 sets × 6 reps. En el piso, codos a 45°, bajás hasta que el tríceps toca y empujás. El piso te corta el rango abajo, que es exactamente lo que hace que puedas cargar el techo sin hombro comprometido y sin banco.\\n\\nSi las 5 reps del press no salen limpias, sacá el disco de 2,5 de cada lado (quedás en 22,5 por mano) y hacé los 5 sets ahí. Bajar el peso para mantener la técnica es progreso; forzar 25 con la lumbar arqueada no.\",\n          items:[\n          lib(\"d-xc-b1\",\"Strict Press · sets 1-5\",\"5 reps · por mano, con barra\",27.5,5),\n          rep(\"d-xc-b2\",\"Sets de press completados a 27,5\",\"de 5\",5),\n          lib(\"d-xc-b3\",\"Floor Press · sets 1-4\",\"6 reps · por mano, con barra\",27.5,6)]},\n        {nombre:\"Bloque 3 · Vertical + accesorio\", dur:\"08:00\", pres:\"CONFIG: 7,5 o 12,5 kg · 3 sets seguidos\",\n          nota:\"Último cambio de discos: dejá 5 o 10 kg de discos por mancuerna (7,5 o 12,5 kg reales) y hacé los tres ejercicios seguidos, sin descanso entre ellos y 90\\\" entre vueltas.\\n\\nAcá no se busca peso. Es hombro lateral, bíceps y core después de dos bloques pesados.\\n\\nY si tenés barra de dominadas: cambiá el lateral raise por pull ups estrictas al fallo técnico. Es mejor uso de los 8 minutos que te quedan.\",\n          items:[\n          chk(\"d-xc-c1\",\"DB Lateral Raise (o pull ups)\",\"12 reps × 3 sets\"),\n          chk(\"d-xc-c2\",\"DB Curl\",\"12 reps × 3 sets\"),\n          chk(\"d-xc-c3\",\"Hollow hold 30\\\" + Plancha 30\\\"\",\"3 sets\")]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"Anotá los discos reales de cada bloque. Tenés 52,5 kg de techo y punto: no hay más para agregar nunca, así que a partir de la semana que viene la progresión sale de otro lado — más reps al mismo peso, bajada más lenta, pausa arriba, menos descanso, o un set más. Eso solo funciona si los números de hoy quedan escritos.\\n\\nEl bloque de clean & jerk y deadlift que había escrito para hoy queda abajo, sin hacer. Lo muevo al viernes si querés, o lo dejamos afuera de esta semana: son dos días pesados de pierna en cinco días y ya tuviste back squat el lunes.\", items:[\n          rep(\"d-xc-z1\",\"Hombro al terminar\",\"0 = bien · 10 = muy cargado\",4),\n          rep(\"d-xc-z2\",\"Gemelo derecho\",\"0-10\",1)]},\n        {nombre:\"— Plan original del miércoles (no se hace hoy) —\", pres:\"Referencia\",\n          nota:\"Lo de abajo es la sesión de box que había escrito para este día. Queda como referencia.\", items:[\n          chk(\"d-xc-ref\",\"Sesión de box: no se hizo\",\"confirmado\")]},\n        {nombre:\"Cómo estaba armado el miércoles de box\", pres:\"Sin plani del coach\",\n          nota:\"CRITERIO DEL MIÉRCOLES: el lunes fue snatch, así que el segundo día pesado va al clean & jerk — es el levantamiento que más usás en los WOD (el viernes hiciste 29 reps con 60 kg) y el que más se te repite en el leaderboard.\\n\\nLa cadena posterior va acá y no el jueves ni el viernes: el deadlift pesado deja los isquios cargados 24-36 hs, y mañana se corre. Cuatro reps por set, no más — series largas de deadlift dejan la lumbar frita y no te suman nada para el 10K.\\n\\nEl accesorio de isquio y aductor es fijo del miércoles: es lo que sostiene el aumento de kilómetros sin que aparezca una molestia nueva.\", items:[\n          chk(\"d-x-x1\",\"Leído antes de entrenar\",\"marcar\")]},\n        {nombre:\"Warm up\", dur:\"06:00\", pres:\"2 rounds\", items:[\n          chk(\"d-x-w1\",\"90-90 hip rotation\",\"10 reps\"),\n          chk(\"d-x-w2\",\"Front rack stretch con barra\",\"30 segundos\"),\n          chk(\"d-x-w3\",\"Good morning con barra vacía\",\"10 reps\"),\n          chk(\"d-x-w4\",\"Muñeca y codo para el front rack\",\"30 segundos\")]},\n        {nombre:\"Activación\", dur:\"04:00\", pres:\"2 rounds\", items:[\n          chk(\"d-x-p1\",\"Glute bridge con banda\",\"15 reps\"),\n          chk(\"d-x-p2\",\"Bird dog\",\"8/8\")]},\n        {nombre:\"Weightlifting · Clean & Jerk\", dur:\"12:00\", pres:\"Cada 2' × 5 sets · 60-78% Clean\",\n          nota:\"1 power clean + 1 hang squat clean + 1 split jerk.\\n\\nNo es un día de buscar máximo: es de repetir el mismo complejo cinco veces y que las cinco se vean iguales. El split jerk al final es el que cuenta — si el pie de adelante aterriza corto, bajá el peso.\\n\\nEl salto del jerk es bajo y controlado, no un salto vertical. Con el gemelo avisando, esto importa: aterrizás en tijera, no rebotás.\", items:[\n          car(\"d-x-a1\",\"Set 1\",\"60% del 1RM Clean\",\"clean\",.60,3),\n          car(\"d-x-a2\",\"Set 2\",\"65% del 1RM Clean\",\"clean\",.65,3),\n          car(\"d-x-a3\",\"Set 3\",\"70% del 1RM Clean\",\"clean\",.70,3),\n          car(\"d-x-a4\",\"Set 4\",\"74% del 1RM Clean\",\"clean\",.74,3),\n          car(\"d-x-a5\",\"Set 5\",\"78% del 1RM Clean\",\"clean\",.78,3)]},\n        {nombre:\"Fuerza · Deadlift\", dur:\"12:00\", pres:\"Cada 3' × 4 sets · 4 reps · RPE 7.5-8\",\n          nota:\"70-80% del 1RM. Reps de a una, bajando controlado, sin rebote en el piso.\\n\\nTope: si el set 4 te obliga a redondear la espalda, ese es el techo del día y el número que anotás es el bueno. Mañana se corre 15-18 minutos; no vale la pena ganar 5 kg acá y perder la sesión de carrera.\", items:[\n          car(\"d-x-f1\",\"Set 1\",\"4 reps · 70%\",\"dead\",.70,4),\n          car(\"d-x-f2\",\"Set 2\",\"4 reps · 74%\",\"dead\",.74,4),\n          car(\"d-x-f3\",\"Set 3\",\"4 reps · 77%\",\"dead\",.77,4),\n          car(\"d-x-f4\",\"Set 4\",\"4 reps · 80%\",\"dead\",.80,4)]},\n        {nombre:\"Conditioning\", dur:\"12:00\", pres:\"AMRAP 12' · 40 kg · sin salto\",\n          nota:\"10 cal bike · 8 hang power clean (40 kg) · 10 T2B.\\n\\nPOR QUÉ ASÍ: es el mismo formato del leaderboard que ya hiciste (bike + T2B + barra), con peso liviano para que puedas ciclar la barra sin bajarla. El viernes con 60 kg hiciste series de 8-11 reps; con 40 tenés que poder hacer las 8 de un tirón, y ese es el punto.\\n\\nT2B: si a los 45 del viernes te agarró el abdomen, cortá a 8 por ronda. Nada de burpees hoy — la pierna tiene que llegar entera a mañana.\\n\\nObjetivo: 5 rondas o más.\", items:[\n          ron(\"d-x-c1\",\"Rondas completas\",\"en 12'\"),\n          rep(\"d-x-c2\",\"Reps sueltas de la ronda parcial\",\"reps\",0)]},\n        {nombre:\"Accesorio · Fijo del miércoles\", dur:\"08:00\", pres:\"3 sets · rest 2:00\",\n          nota:\"Isquio y aductor. Este bloque no se saltea: es el que hace que el aumento de kilómetros no termine en una molestia.\", items:[\n          lib(\"d-x-e1\",\"Weighted GHD Hip Extension\",\"15 reps\",10,15),\n          chk(\"d-x-e2\",\"Copenhagen Plank\",\"10/10 × 3 sets\"),\n          chk(\"d-x-e3\",\"3 sets completos\",\"marcar al terminar\")]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"El número de isquios de acá abajo decide el jueves: si sale en 6 o más, el trote de mañana se queda en 12' y el bloque sin impacto sube a 30'.\", items:[\n          rep(\"d-x-z1\",\"Isquios al terminar\",\"0 = frescos · 10 = cargados\",5),\n          rep(\"d-x-z2\",\"Gemelo derecho\",\"0-10\",1)]}\n      ]},\n      { dia:\"Jue\", num:\"3\", titulo:\"Z2 + Trote · sesión de carrera\", sub:\"PROPIA · 50' · semana 2 de 7 al 10K\", mes:\"septiembre\", secciones:[\n        {nombre:\"Cómo armé este día\", pres:\"El día más importante de la semana\",\n          nota:\"CRITERIO DEL JUEVES: esta es la sesión que define si llegás al 10K, y por eso es el único día donde no hay nada pesado antes. Ni squat, ni deadlift, ni pliometría.\\n\\nLA PROGRESIÓN: la semana pasada fueron 30' de remo + 12' de trote, y salió a 6:52/km sin molestias. Esta semana el trote sube a 15-18' y el bloque sin impacto baja a 25'. Es la regla que voy a seguir las siete semanas: el tiempo de impacto sube de a 3-4 minutos por semana y el tiempo sin impacto baja para compensar, así el total cardiovascular se mantiene mientras el tejido se adapta de a poco.\\n\\nSi el gemelo dio problema el lunes o el martes, o los isquios del miércoles cerraron en 6 o más: el trote se queda en 12' y no sube. Perder una semana de progresión no cuesta nada; perder tres semanas por una molestia sí.\", items:[\n          chk(\"d-j-x1\",\"Leído antes de entrenar\",\"marcar\")]},\n        {nombre:\"Warm up\", dur:\"08:00\", pres:\"Movilidad de tobillo y gemelo\",\n          nota:\"Esto es específico para el gemelo derecho. No lo saltees hoy.\", items:[\n          chk(\"d-j-w1\",\"Ankle dorsiflexion contra la pared\",\"10/10\"),\n          chk(\"d-j-w2\",\"Calf raise lento (3\\\" arriba, 3\\\" abajo)\",\"15/15\"),\n          chk(\"d-j-w3\",\"Leg swings adelante y al costado\",\"10/10 cada dirección\"),\n          chk(\"d-j-w4\",\"Caminata en punta de pie\",\"30 metros\")]},\n        {nombre:\"Bloque sin impacto\", dur:\"25:00\", pres:\"Remo, bici o ski · Zona 2\",\n          nota:\"25' continuos, sin bajar del rango. Tu referencia de remo es 2:40/500 m en Z2 — si el pulsómetro no está, ese ritmo es el ancla.\\n\\nEs aeróbico puro: nada de sprints, nada de intervalos. El pulso lo tenés arriba en el panel de zona 2 según tu edad.\", items:[\n          tim(\"d-j-b1\",\"Tiempo\",\"objetivo 25'\",1500),\n          rep(\"d-j-b2\",\"Esfuerzo\",\"0 = fácil · 10 = duro\",4)]},\n        {nombre:\"Trote\", dur:\"18:00\", pres:\"15-18' continuos · el bloque que sube\",\n          nota:\"Continuo, no por intervalos. Ritmo conversado: 6:50-7:10/km está perfecto — no busques bajar el ritmo esta semana, el objetivo es el tiempo en los pies.\\n\\nREGLA DE CORTE: si aparece una molestia de 3 o más en el gemelo, parás en ese momento. No hay versión de esto donde terminarlo valga la pena.\\n\\nAnotá tiempo y distancia: de ahí sale el ritmo real y con eso ajusto la semana que viene.\", items:[\n          tim(\"d-j-t1\",\"Tiempo trotado\",\"objetivo 15-18'\",1000),\n          dis(\"d-j-t2\",\"Distancia trotada\",\"km\",2.6),\n          rep(\"d-j-t3\",\"Molestia durante el trote\",\"0-10 · si pasa de 2, cortar\",0)]},\n        {nombre:\"Torso\", dur:\"09:00\", pres:\"3 sets · nada de pierna\",\n          nota:\"Lo único de fuerza del día, y es todo de la cintura para arriba. Va después de correr, no antes.\", items:[\n          rep(\"d-j-g1\",\"Strict pull ups\",\"reps por set\",6),\n          chk(\"d-j-g2\",\"Push ups\",\"12 reps × 3 sets\"),\n          chk(\"d-j-g3\",\"Hollow hold 30\\\"\",\"3 sets\")]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"Estiramiento de gemelo y sóleo, 60\\\" por lado. Dos minutos hoy te ahorran tres semanas después.\", items:[\n          chk(\"d-j-z1\",\"Estiramiento gemelo y sóleo\",\"60\\\" por lado\"),\n          rep(\"d-j-z2\",\"Gemelo al terminar\",\"0-10\",1)]}\n      ]},\n      { dia:\"Vie\", num:\"4\", titulo:\"Front Squat + Leaderboard\", sub:\"PROPIA · 57' · cierre de semana\", mes:\"septiembre\", secciones:[\n        {nombre:\"Cómo armé este día\", pres:\"Sin plani del coach\",\n          nota:\"CRITERIO DEL VIERNES: el viernes es el día de test — así lo usa el box con el leaderboard y así lo dejo. Es el único día de la semana que te dice si algo mejoró.\\n\\nPIERNA: front squat, no back squat. El lunes ya hiciste back squat al 85% y el miércoles deadlift al 80%; un tercer día de cadena posterior pesada en cinco días es demasiado con la carrera arriba. El front squat carga menos lumbar, cuida la posición de recepción del clean y del snatch, y te deja el sábado disponible para el rodaje largo.\\n\\nSin fútbol, así que no hay taper: el día va completo.\\n\\nEl leaderboard de abajo es la versión medible de lo que ya hiciste el viernes 28 — misma estructura, con el gemelo protegido.\", items:[\n          chk(\"d-v-x1\",\"Leído antes de entrenar\",\"marcar\")]},\n        {nombre:\"Warm up\", dur:\"06:00\", pres:\"2 rounds\", items:[\n          chk(\"d-v-w1\",\"Front rack con barra + squat hold\",\"30 segundos\"),\n          chk(\"d-v-w2\",\"Cossack squat\",\"8/8\"),\n          chk(\"d-v-w3\",\"Shoulders global\",\"10 reps\"),\n          chk(\"d-v-w4\",\"Air squat con pausa abajo\",\"10 reps\")]},\n        {nombre:\"Weightlifting · Snatch liviano\", dur:\"06:00\", pres:\"Cada 2' × 3 sets · 60-70% Snatch\",\n          nota:\"1 power snatch + 1 overhead squat.\\n\\nLiviano a propósito: el lunes ya trabajaste snatch hasta el 80%. Esto es para mantener el patrón fresco antes del front squat, no para cargar.\", items:[\n          car(\"d-v-a1\",\"Set 1\",\"60% del 1RM Snatch\",\"snatch\",.60,2),\n          car(\"d-v-a2\",\"Set 2\",\"65% del 1RM Snatch\",\"snatch\",.65,2),\n          car(\"d-v-a3\",\"Set 3\",\"70% del 1RM Snatch\",\"snatch\",.70,2)]},\n        {nombre:\"Fuerza · Front Squat\", dur:\"12:00\", pres:\"Cada 2'30\\\" × 4 sets · 3 reps · RPE 7.5-8\",\n          nota:\"70-82% del 1RM de front squat.\\n\\nCodos arriba en las tres reps. El set donde el codo empieza a caer es tu tope real, no el que dice el porcentaje. Anotá el peso del último set bueno.\", items:[\n          car(\"d-v-f1\",\"Set 1\",\"3 reps · 70%\",\"frontsq\",.70,3),\n          car(\"d-v-f2\",\"Set 2\",\"3 reps · 74%\",\"frontsq\",.74,3),\n          car(\"d-v-f3\",\"Set 3\",\"3 reps · 78%\",\"frontsq\",.78,3),\n          car(\"d-v-f4\",\"Set 4\",\"3 reps · 82%\",\"frontsq\",.82,3)]},\n        {nombre:\"Leaderboard\", dur:\"18:00\", pres:\"3 sets · 5' de trabajo, 1' de descanso · 60 kg\",\n          nota:\"En cada set de 5': 12 cal bike + 12 T2B + máximo de clean and jerk con 60 kg en el tiempo que sobre.\\n\\nPOR QUÉ ESTE: es exactamente lo que hiciste el viernes 28, con dos cambios. Los T2B bajan de 15 a 12 (45 reps te dejó el abdomen al límite y quiero que la barra sea el limitante, no el core), y el clean and jerk queda en 60 kg — el mismo peso, así los números se comparan directo.\\n\\nTU MARCA A BATIR: 10 · 8 · 11, total 29 reps.\\n\\nEl aviso del gemelo apareció justo acá, en la rep 10 del set 3. Si vuelve a aparecer, el set se termina donde está: 29 es un buen número y no vale una lesión.\", items:[\n          lib(\"d-v-c1\",\"Set 1 · clean and jerk\",\"reps con 60 kg\",60,10),\n          lib(\"d-v-c2\",\"Set 2 · clean and jerk\",\"reps con 60 kg\",60,8),\n          lib(\"d-v-c3\",\"Set 3 · clean and jerk\",\"reps con 60 kg\",60,11),\n          rep(\"d-v-c4\",\"Gemelo derecho durante el WOD\",\"0-10\",0)]},\n        {nombre:\"Accesorio\", dur:\"06:00\", pres:\"3 sets · liviano\",\n          nota:\"Dorsal y hombro, por calidad.\", items:[\n          lib(\"d-v-e1\",\"Three point DB row\",\"10/10\",22.5,10),\n          chk(\"d-v-e2\",\"YTW\",\"8 reps × 3 sets\"),\n          chk(\"d-v-e3\",\"3 sets completos\",\"marcar al terminar\")]},\n        {nombre:\"Cierre de semana\", pres:\"Post sesión\",\n          nota:\"Con esto cierra la primera semana escrita sin el coach. Lo que necesito de vuelta son tres cosas: los kilos reales que movieron los bloques de fuerza, el total del leaderboard, y cómo se portó el gemelo los cinco días.\\n\\nCon eso escribo la semana del 7 mejor que esta. Es así como la cosa se vuelve independiente: no porque el plan salga perfecto la primera vez, sino porque cada semana usa los datos de la anterior.\", items:[\n          rep(\"d-v-z1\",\"Total del leaderboard\",\"reps · marca previa 29\",29),\n          rep(\"d-v-z2\",\"Piernas al terminar la semana\",\"0 = frescas · 10 = fundidas\",5),\n          rep(\"d-v-z3\",\"Gemelo derecho · resumen de la semana\",\"0 = nunca apareció · 10 = todos los días\",1)]}\n      ]},\n      pend(\"Sáb\",\"5\",\"Box + rodaje largo\",\"Pendiente · doble sesión\",\n        \"El sábado pasado la doble sesión no pasó: no fuiste al box y corriste 30' a la siesta. Eso está bien — la corrida es la que no se negocia.\\n\\nEste sábado el rodaje sube a 35-40' si la semana viene limpia. Si vas al box, la corrida va cuatro o cinco horas después, no pegada.\",\n        [tim(\"d-s-r1\",\"Tiempo de rodaje\",\"objetivo 35-40'\",2100),\n         dis(\"d-s-r2\",\"Distancia\",\"km\",5.5),\n         rep(\"d-s-r3\",\"Sensación\",\"0 = fácil · 10 = duro\",5)]),\n      { dia:\"Dom\", num:\"6\", titulo:\"Descanso\", sub:\"Libre\", mes:\"septiembre\", secciones:[\n        {nombre:\"Descanso\", pres:\"Sin plan\",\n          nota:\"Si la corrida del sábado no salió, va acá. Si salió, caminata de 30' y nada más.\", items:[\n          rep(\"d-d-z1\",\"Cómo te levantaste\",\"0 = entero · 10 = roto\",3),\n          chk(\"d-d-z2\",\"Caminata 30'\",\"opcional\")]}\n      ]}\n    ];\n  }\n  planS3(){\n    const dis = (id,t,d,km)=>({id,t,d,tipo:\"dist\",km});\n    const chk = (id,t,d)=>({id,t,d,tipo:\"chk\"});\n    const car = (id,t,d,lift,pct,reps)=>({id,t,d,tipo:\"car\",lift,pct,reps});\n    const lib = (id,t,d,peso,reps)=>({id,t,d,tipo:\"car\",peso,reps});\n    const rep = (id,t,d,reps)=>({id,t,d,tipo:\"rep\",reps});\n    const tim = (id,t,d,seg)=>({id,t,d,tipo:\"tim\",seg});\n    const ron = (id,t,d)=>({id,t,d,tipo:\"ron\"});\n    return [\n      { dia:\"Lun\", num:\"24\", titulo:\"Snatch + Back Squat\", sub:\"Adaptado · 56' · día pesado 1\", secciones:[\n        {nombre:\"Movilidad\", dur:\"08:00\", pres:\"2 rounds\", items:[\n          chk(\"c-l-w1\",\"90-90 hip rotation w/ hip thrust\",\"10 reps\"),\n          chk(\"c-l-w2\",\"Full T Hip Opener\",\"10/10\"),\n          chk(\"c-l-w3\",\"Shoulders Global\",\"10 reps\"),\n          chk(\"c-l-w4\",\"Overhead Squat con banda\",\"10 reps\")]},\n        {nombre:\"Weightlifting · Bloque A\", dur:\"12:00\", pres:\"Cada 3' × 4 sets · 45-65% Snatch\",\n          nota:\"1 segment snatch deadlift + 1 power snatch c/pausa debajo de rodillas + 1 squat snatch c/pausa arriba de rodilla · drop/tiro barra · 1 snatch pull + 1 low hang squat snatch\", items:[\n          car(\"c-l-a1\",\"Set 1\",\"45% del 1RM Snatch\",\"snatch\",.45,5),\n          car(\"c-l-a2\",\"Set 2\",\"52% del 1RM Snatch\",\"snatch\",.52,5),\n          car(\"c-l-a3\",\"Set 3\",\"58% del 1RM Snatch\",\"snatch\",.58,5),\n          car(\"c-l-a4\",\"Set 4\",\"65% del 1RM Snatch\",\"snatch\",.65,5)]},\n        {nombre:\"Weightlifting · Bloque B\", dur:\"—\", pres:\"FUERA esta semana\",\n          nota:\"PLANI: cada 2'30\\\" × 4 sets al 75-80% del snatch (1 squat snatch + 2 hang squat snatch).\\nAHORA: no se hace.\\nPOR QUÉ: snatch pesado antes de cuatro series de back squat te deja la sentadilla en segundo lugar del día. El squat es el ancla del lunes. Este bloque vuelve en la fase post-10K.\\n\\nSi te sobra tiempo después del conditioning, podés hacer 2 sets al 73-75%, nunca antes del squat.\", items:[\n          chk(\"c-l-b1\",\"Bloque saltado\",\"marcar para registro\")]},\n        {nombre:\"Fuerza · Back Squat\", dur:\"08:00\", pres:\"Cada 2' × 4 sets · 3 reps · RPE 7.5-8\",\n          nota:\"70-80% del 1RM. Acá va la carga pesada de piernas de la semana: es lunes, tenés cinco días hasta el partido.\", items:[\n          car(\"c-l-f1\",\"Set 1\",\"3 reps · 70%\",\"backsq\",.70,3),\n          car(\"c-l-f2\",\"Set 2\",\"3 reps · 73%\",\"backsq\",.73,3),\n          car(\"c-l-f3\",\"Set 3\",\"3 reps · 77%\",\"backsq\",.77,3),\n          car(\"c-l-f4\",\"Set 4\",\"3 reps · 80%\",\"backsq\",.80,3)]},\n        {nombre:\"Conditioning\", dur:\"14:00\", pres:\"AMRAP 14'\",\n          nota:\"AHORA: 20 shuttle run (7.5 m) · 20 alternating DB snatch 22.5 kg · 10 burpee box STEP-OVER 50 cm.\\n\\nPLANI: 30 shuttle run · 10 burpee box JUMP over 60 cm.\\nPOR QUÉ: es la primera semana de vuelta al impacto. El salto al cajón de 60 y las 30 frenadas son justo el impacto que no querés sumar dos días antes del test de trote.\", items:[\n          ron(\"c-l-m1\",\"Resultado\",\"rondas + reps en 14'\")]}\n      ]},\n      { dia:\"Mar\", num:\"25\", titulo:\"Push / Pull + Rodaje\", sub:\"Adaptado · 72' · tren superior\", secciones:[\n        {nombre:\"Warm Up\", dur:\"05:00\", pres:\"2 rounds\", items:[\n          chk(\"c-m-w1\",\"Quadruped Thoracic Rotation\",\"10/10\"),\n          chk(\"c-m-w2\",\"Yoga Push Up\",\"10 reps\"),\n          chk(\"c-m-w3\",\"Active Samson Stretch\",\"10/10\"),\n          chk(\"c-m-w4\",\"Plate Calf Raises\",\"20 reps\")]},\n        {nombre:\"Fuerza · Push / Pull\", dur:\"15:00\", pres:\"3 sets · rest 3:00 b/sets\",\n          nota:\"4 seated pin press (RIR 2) · rest 1:00 · 4 weighted strict pull up (RIR 2)\", items:[\n          lib(\"c-m-f1\",\"Set 1 · Pin press\",\"4 reps · RIR 2\",50,4),\n          lib(\"c-m-f2\",\"Set 1 · Pull up lastrado\",\"4 reps · RIR 2\",10,4),\n          lib(\"c-m-f3\",\"Set 2 · Pin press\",\"4 reps · RIR 2\",52.5,4),\n          lib(\"c-m-f4\",\"Set 2 · Pull up lastrado\",\"4 reps · RIR 2\",10,4),\n          lib(\"c-m-f5\",\"Set 3 · Pin press\",\"4 reps · RIR 2\",55,4),\n          lib(\"c-m-f6\",\"Set 3 · Pull up lastrado\",\"4 reps · RIR 2\",12.5,4)]},\n        {nombre:\"Desarrollo de skill\", dur:\"14:00\", pres:\"3 sets · rest 2:00 · COMO LA PLANI\",\n          nota:\"3 sets: 2 legless rope climb · 10 cal bike · AMRAP HSPU estrictas (RIR 2).\\n\\nVuelve completo: la soga sin piernas es tracción de brazo y dorsal, no carga pierna, y es trabajo de fuerza que en esta fase te sirve. El único cambio es el shuttle run del set, que va como 10 cal bike.\\n\\nSi el HSPU estricto no sale limpio, box pike push-up. Anotá las subidas: es el número que sube semana a semana.\", items:[\n          rep(\"c-m-x1\",\"Set 1 · Legless rope climb\",\"2 subidas\",2),\n          rep(\"c-m-x2\",\"Set 1 · HSPU estrictas\",\"AMRAP · RIR 2\",5),\n          rep(\"c-m-x3\",\"Set 2 · Legless rope climb\",\"2 subidas\",2),\n          rep(\"c-m-x4\",\"Set 2 · HSPU estrictas\",\"AMRAP · RIR 2\",5),\n          rep(\"c-m-x5\",\"Set 3 · Legless rope climb\",\"2 subidas\",2),\n          rep(\"c-m-x6\",\"Set 3 · HSPU estrictas\",\"AMRAP · RIR 2\",4)]},\n        {nombre:\"Accesorio de hombro y brazo\", dur:\"08:00\", pres:\"3 sets en circuito · rest 1:30 · SE CAE PRIMERO\",\n          nota:\"Cierra el día sin fatiga sistémica. Codo y hombro son lo que más se beneficia de volumen acá, porque el resto de la semana no los toca.\\n\\nEste es el bloque que sacás si el día se estira: el martes es el más cargado de la semana (72') porque suma el rodaje. El orden de sacrificio es accesorio primero, conditioning después. El rodaje no se toca.\", items:[\n          lib(\"c-m-y1\",\"Incline DB press\",\"10 reps · RIR 2\",20,10),\n          lib(\"c-m-y2\",\"Face pull o band pull apart\",\"15 reps\",15,15),\n          chk(\"c-m-y3\",\"3 sets completos\",\"marcar al terminar\")]},\n        {nombre:\"Conditioning\", dur:\"10:00\", pres:\"1 set · cap 10' · ADAPTADO\",\n          nota:\"AHORA: 1000 m row · 20 air squats · 30 GHD sit ups o sit ups · 10 bar muscle ups o burpee pull ups · 50 double unders. Cap 10'.\\n\\nPLANI: 40 air squats · 100 double unders · cap 12-15', con opción de 800 m run.\\nPOR QUÉ: el cap baja a 10' para devolverle los minutos al skill, que vuelve completo. Los cambios de contenido son por impacto: row en vez de correr y la mitad de sentadillas y de saltos, porque es tu primera semana de vuelta a correr y el jueves es la sesión clave. Lo que sale es el impacto, no el estímulo.\", items:[\n          tim(\"c-m-c1\",\"Tiempo final\",\"o corte al cap\",600)]},\n        {nombre:\"Rodaje Z2\", dur:\"20:00\", pres:\"Continuo · RPE 4/10 · AGREGADO\",\n          nota:\"No está en la plani. Es la segunda corrida de la semana del plan híbrido, y va acá porque empujar y traccionar no le quita nada a un trote fácil. Queda igual: es la base aeróbica del 10K y el martes es el único día donde entra sin pelear con nada.\\n\\nRitmo de poder hablar de corrido — apuntá a 6:20-6:40, más lento está bien. Si el día se estiró, baja a 15' antes que salir.\", items:[\n          tim(\"c-m-r1\",\"Tiempo de rodaje\",\"objetivo 20'\",1200),\n          dis(\"c-m-r2\",\"Distancia\",\"km\",3),\n          rep(\"c-m-r3\",\"Molestia durante el rodaje\",\"0-10 · si pasa de 2, cortar\",0)]}\n      ]},\n      { dia:\"Mié\", num:\"26\", titulo:\"Deadlift 88% + Prevención\", sub:\"Adaptado · 58' · día pesado 2\", secciones:[\n        {nombre:\"Warm Up\", dur:\"05:00\", pres:\"2 rounds\", items:[\n          chk(\"c-x-w1\",\"Dynamic Pec Stretch\",\"30/30\\\"\"),\n          chk(\"c-x-w2\",\"Downward Dog to Cobra\",\"10 reps\"),\n          chk(\"c-x-w3\",\"Full T Hip Opener\",\"10/10\"),\n          chk(\"c-x-w4\",\"90 to 90\",\"10 reps\")]},\n        {nombre:\"Fuerza · Deadlift · Bloque A\", dur:\"15:00\", pres:\"Subir de 2 reps hasta 88% · los sets que hagan falta\",\n          nota:\"Sin touch and go: reset en cada rep. La semana pasada cerraste 136 × 2 en Justo — hoy el tope está en 141.\", items:[\n          car(\"c-x-a1\",\"Set 1\",\"2 reps · 62%\",\"dead\",.62,2),\n          car(\"c-x-a2\",\"Set 2\",\"2 reps · 70%\",\"dead\",.70,2),\n          car(\"c-x-a3\",\"Set 3\",\"2 reps · 78%\",\"dead\",.78,2),\n          car(\"c-x-a4\",\"Set 4\",\"2 reps · 84%\",\"dead\",.84,2),\n          car(\"c-x-a5\",\"Set 5\",\"2 reps · 88%\",\"dead\",.88,2)]},\n        {nombre:\"Deadlift · Bloque B\", dur:\"—\", pres:\"FUERA esta semana\",\n          nota:\"PLANI: pause deadlift 4 × 2 al 75%, con pausa debajo de rodillas.\\nAHORA: no se hace.\\nPOR QUÉ: son ocho reps más de bisagra cargada después del 88%, el día antes de correr. Esta es exactamente la acumulación que te dio el tirón hace dos semanas.\", items:[\n          chk(\"c-x-b1\",\"Bloque saltado\",\"marcar para registro\")]},\n        {nombre:\"Capacidad\", dur:\"10:00\", pres:\"2 sets · sub 1:30-2:00 · intensidad 90% · rest 2:00 · ADAPTADO\",\n          nota:\"15 dual DB bench press 2×22.5 kg · 15 burpee over bench lateral.\\n\\nPLANI: 3 sets. AHORA: 2.\\nPOR QUÉ: es trabajo de tren superior a intensidad alta y no toca la cadena posterior, así que se queda — solo se recorta por tiempo. Si el día viene holgado, hacé el tercero.\", items:[\n          tim(\"c-x-c1\",\"Set 1\",\"tiempo del set\",105),\n          tim(\"c-x-c2\",\"Set 2\",\"tiempo del set\",105),\n          tim(\"c-x-c3\",\"Set 3 (opcional)\",\"solo si sobra tiempo\",105)]},\n        {nombre:\"Accesorio · NO SE NEGOCIA\", dur:\"12:00\", pres:\"3 sets por calidad · rest 2:00 · VA ANTES\",\n          nota:\"El coach lo pone último; vos lo hacés acá, antes de que se te vaya el tiempo.\\n\\nEs el trabajo excéntrico de isquios y aductor que faltaba en todo el ciclo, prevención directa de la lesión que tuviste, y lo que va a sostener el aumento de kilómetros hacia el 10K. Por calidad, sin buscar fatiga. Si quedan 10 minutos de sesión, esto se hace igual.\", items:[\n          lib(\"c-x-e1\",\"Weighted GHD Hip Extension\",\"15 reps\",10,15),\n          chk(\"c-x-e2\",\"Dynamic Short Lever Copenhagen Plank\",\"10/10 × 3 sets\")]},\n        {nombre:\"Conditioning\", dur:\"—\", pres:\"FUERA esta semana\",\n          nota:\"PLANI: 3 sets de 7.5 m single arm OH walking lunge · 10 m HSW · 14 alternating DB hang clean and jerk · 10 m HSW · 7.5 m OH walking lunge, DB 22.5 kg.\\nAHORA: el bloque entero afuera.\\nPOR QUÉ: quince metros de zancada con peso en alto por set, dos veces por set, tres sets. Es el ejercicio con más carga excéntrica de glúteo e isquio de toda la semana y va 18 horas antes del test de trote. Vuelve en la fase post-10K.\", items:[\n          chk(\"c-x-d1\",\"Bloque saltado\",\"marcar para registro\")]}\n      ]},\n      { dia:\"Jue\", num:\"27\", titulo:\"Z2 + test de trote\", sub:\"Adaptado · 60' · sesión clave\", secciones:[\n        {nombre:\"Warm Up\", dur:\"06:00\", pres:\"2 rounds\", items:[\n          chk(\"c-j-w1\",\"Alternating Standing Knee Hugs\",\"10 reps\"),\n          chk(\"c-j-w2\",\"Alternating Table Tops\",\"10 reps\"),\n          chk(\"c-j-w3\",\"Alternating Scoop Hamstrings\",\"10 reps\"),\n          chk(\"c-j-w4\",\"Alternating Quad Pulls\",\"10 reps\")]},\n        {nombre:\"Bloque A · Z2 sin impacto\", dur:\"30:00\", pres:\"Remo, bici o ski · RPE 4/10 · ADAPTADO\",\n          nota:\"PLANI: 40' de trote continuo.\\nAHORA: 30' sin impacto + 12' de trote al final.\\nPOR QUÉ: 40' de impacto entre el deadlift del miércoles y el partido del sábado es carga excéntrica que el remo da igual sin el costo.\\n\\nRitmo conversacional de punta a punta: si no podés hablar de corrido, bajá.\", items:[\n          tim(\"c-j-b1\",\"Tiempo total\",\"duración real\",1800),\n          rep(\"c-j-b2\",\"RPE del bloque\",\"0-10 · objetivo 4\",4)]},\n        {nombre:\"Bloque B · Test de trote\", dur:\"12:00\", pres:\"Semana 1 de 7 hacia el 10K\",\n          nota:\"Primer trote desde el tirón. Va al final y con la sesión ya hecha, a propósito: sin nada en juego. Muy suave, ritmo de conversación, sobre superficie plana. Si aparece cualquier molestia se corta en el acto — la semana que viene volvemos a remo y perdemos una semana de las siete, que es un costo aceptable.\", items:[\n          tim(\"c-j-b3\",\"Tiempo trotado\",\"objetivo 12'\",720),\n          dis(\"c-j-b6\",\"Distancia trotada\",\"para calcular el ritmo\",2),\n          rep(\"c-j-b4\",\"Molestia durante el trote\",\"0-10 · si pasa de 2, cortar\",0),\n          rep(\"c-j-b5\",\"Molestia el viernes al levantarte\",\"decide la semana 2\",0)]},\n        {nombre:\"Core\", dur:\"10:00\", pres:\"3 rondas · AGREGADO\",\n          nota:\"No está en la plani. Va al final porque no interfiere con nada, y sostiene la postura de carrera cuando los kilómetros suban. Sin flexión de cadera cargada.\", items:[\n          tim(\"c-j-k1\",\"Plancha · ronda 1\",\"40 seg\",40),\n          chk(\"c-j-k2\",\"Dead bug\",\"10/10 × 3 rondas\"),\n          chk(\"c-j-k3\",\"Hollow hold\",\"20\\\" × 3 rondas\")]},\n        {nombre:\"Tren superior liviano\", dur:\"12:00\", pres:\"3 sets · rest 1:30 · opcional\",\n          nota:\"Solo si el bloque Z2 salió cómodo.\", items:[\n          lib(\"c-j-t1\",\"DB shoulder press sentado\",\"10 reps · RIR 2\",15,10),\n          lib(\"c-j-t2\",\"Ring rows / remo con DB\",\"12 reps · RIR 2\",20,12),\n          chk(\"c-j-t3\",\"3 sets completos\",\"marcar al terminar\")]}\n      ]},\n      { dia:\"Vie\", num:\"28\", titulo:\"Clean técnico + Back Squat\", sub:\"Adaptado · 58' · sin partido · vuelve pierna\", secciones:[\n        {nombre:\"Warm Up\", dur:\"05:00\", pres:\"2 rounds\", items:[\n          chk(\"c-v-w1\",\"Full T Hip Opener\",\"10 reps\"),\n          chk(\"c-v-w2\",\"Deep Squat w/ Internal-External Hip Rotation\",\"10 reps\"),\n          chk(\"c-v-w3\",\"Shoulder External Rotation con PVC\",\"10/10\")]},\n        {nombre:\"Weightlifting · Bloque A\", dur:\"12:00\", pres:\"Cada 2'30\\\" × 4 sets · sin cambios\",\n          nota:\"1 segment clean deadlift + 1 power clean into front squat + 1 hang power clean + 1 hang squat clean. Este bloque queda tal cual: es técnico y no llega a carga alta.\", items:[\n          car(\"c-v-a1\",\"Set 1\",\"55% del 1RM Clean\",\"clean\",.55,4),\n          car(\"c-v-a2\",\"Set 2\",\"60% del 1RM Clean\",\"clean\",.60,4),\n          car(\"c-v-a3\",\"Set 3\",\"65% del 1RM Clean\",\"clean\",.65,4),\n          car(\"c-v-a4\",\"Set 4\",\"70% del 1RM Clean\",\"clean\",.70,4)]},\n        {nombre:\"Weightlifting · Bloque B\", dur:\"—\", pres:\"FUERA esta semana\",\n          nota:\"PLANI: cada 2'30\\\" × 4 sets al 75-83% del clean (2 hang squat clean + drop + 1 squat clean).\\nAHORA: no se hace.\\nPOR QUÉ: ya no es por el partido — es porque el bloque de pierna del día ahora es el back squat, y squat clean al 83% más 4×5 de squat son dos bloques pesados de pierna en la misma sesión. Elegí uno: el squat, que es el que construye fuerza.\", items:[\n          chk(\"c-v-b1\",\"Bloque saltado\",\"marcar para registro\")]},\n        {nombre:\"Fuerza · Back Squat\", dur:\"10:00\", pres:\"4 sets · 5 reps · rest 2:00 · AGREGADO\",\n          nota:\"PLANI: 3 sets de 3 reps de 1¼ front squat al 70%.\\nAHORA: back squat 4×5 al 65-72%, bajá en 3 segundos y subí normal. RIR 3: la quinta rep tiene que salir sola.\\n\\nPOR QUÉ VUELVE: sin fútbol el sábado se cae la razón por la que el viernes era taper. Y el lunes fueron 4×3 — doce reps de squat en toda la semana es poco estímulo para fortalecer.\\n\\nPOR QUÉ BACK Y NO FRONT: mismo objetivo con muchísima menos tensión específica de cuádriceps que el 1¼ front squat, y hoy el cuádriceps te avisó en la corrida. Además el sábado vas al box y todavía no sabés qué hay: esto te deja el sábado disponible.\\n\\nSi el sábado el WOD viene cargado de pierna, se arregla el sábado, no acá.\", items:[\n          car(\"c-v-f1\",\"Set 1\",\"5 reps · 65%\",\"backsq\",.65,5),\n          car(\"c-v-f2\",\"Set 2\",\"5 reps · 68%\",\"backsq\",.68,5),\n          car(\"c-v-f3\",\"Set 3\",\"5 reps · 72%\",\"backsq\",.72,5),\n          car(\"c-v-f4\",\"Set 4\",\"5 reps · 72%\",\"backsq\",.72,5)]},\n        {nombre:\"Leaderboard\", dur:\"09:00\", pres:\"3 sets · AMRAP 2' × 1' rest · ADAPTADO\",\n          nota:\"PLANI: 12 cal bike o 100 m run · 15 toes to bar · max clean and jerk.\\nAHORA: 12 cal bike · 10 toes to bar · max clean and jerk 55 kg con tope de 8 reps.\\n\\nPOR QUÉ: la bici en vez de correr, porque es impacto la víspera del partido. T2B de 15 a 10 — el kip es un latigazo de cadera y con 15 son 45 reps en total. Y tope de 8 clean and jerk por set con carga moderada: \\\"max reps\\\" pesado es el bloque de más fatiga de cadera de la semana.\", items:[\n          rep(\"c-v-l1\",\"Set 1 · Clean and jerk\",\"reps 55 kg · tope 8\",6),\n          rep(\"c-v-l2\",\"Set 2 · Clean and jerk\",\"reps 55 kg · tope 8\",6),\n          rep(\"c-v-l3\",\"Set 3 · Clean and jerk\",\"reps 55 kg · tope 8\",6)]},\n        {nombre:\"Accesorio\", dur:\"08:00\", pres:\"3 sets por calidad · rest 2:00\",\n          nota:\"10/10 single arm DB upright row (liviano) · 10 banded external rotation face pull. Sin cambios: es hombro, no molesta al sábado.\", items:[\n          lib(\"c-v-e1\",\"Upright row\",\"10/10 · liviano\",10,10),\n          chk(\"c-v-e2\",\"Banded Face Pull\",\"10 reps × 3 sets\")]},\n        {nombre:\"Cierre\", pres:\"Post sesión\",\n          nota:\"LO QUE PASÓ (registrado):\\n· Bloque B NO se saltó — lo hiciste igual, cada 2'30\\\" × 4 sets hasta el 83%: 78 · 82 · 85 · 88 kg.\\n· Back squat 4×5: no se hizo.\\n· Leaderboard con 60 kg (no 55) y T2B en 15 (no 10): 12 cal bike + 15 T2B + clean and jerk → 10 · 8 · 11.\\n· En la rep 10 del set 3 el gemelo derecho quiso tirar. Terminaste el set y no pasó nada.\\n\\nBalance: el día quedó al revés de como estaba escrito — se hizo el clean pesado y se cayó el squat. No es un problema en sí (el squat vuelve el lunes), pero el aviso del gemelo con 60 kg y 45 T2B es el dato que arrastro a la semana nueva: el lunes el box jump baja de un paso y los burpees over the bar van con paso.\", items:[\n          rep(\"c-v-z1\",\"Piernas al terminar\",\"0 = frescas · 10 = fundidas\",3)]}\n      ]},\n      { dia:\"Sáb\", num:\"29\", titulo:\"Solo rodaje\", sub:\"No fuiste al box · 30' de corrida a la siesta\", secciones:[\n        {nombre:\"Lo que pasó\", pres:\"Registro real\",\n          nota:\"No hubo box. Solo la corrida: 30' a la siesta, nada más.\\n\\nEl bloque de jerk y el leaderboard de abajo no se hicieron — los dejo visibles como referencia de lo que estaba planificado.\\n\\nBalance de la semana: cinco días de box (lun a vie) y dos corridas (jue 12' de test + sáb 30'). La sesión que se cayó es la que menos costaba perder. Lo que falta es frecuencia de carrera: esta semana van tres salidas.\", items:[\n          tim(\"c-s-real1\",\"Tiempo de corrida\",\"30'\",1800),\n          chk(\"c-s-real2\",\"Box: no se hizo\",\"confirmado\")]},\n        {nombre:\"Warm up\", dur:\"08:00\", pres:\"2 rounds · NO SE HIZO\",\n          nota:\"10 active hinge mobility · 10 shoulder ER con PVC · 10/10 knight to hamstring stretch · 5/5 single arm DB thrusters livianos.\\n\\nEntrá en calor con tiempo en el hombro: el día son 57 reps de tracción y todo el weightlifting va por encima de la cabeza.\", items:[\n          chk(\"c-s-w1\",\"Active hinge mobility\",\"10 reps\"),\n          chk(\"c-s-w2\",\"Shoulder ER con PVC\",\"10 reps\"),\n          chk(\"c-s-w3\",\"Knight to hamstring stretch\",\"10/10\"),\n          chk(\"c-s-w4\",\"Single arm DB thrusters\",\"5/5 liviano\")]},\n        {nombre:\"Weightlifting · Jerk\", dur:\"14:00\", pres:\"4 sets · rest 2:00-3:00 · IGUAL\",\n          nota:\"1 jerk drive + 1 power jerk + 2 split jerk, entre el 70 y 80% del 1RM de jerk.\\n\\nSe hace entero. Es el bloque más valioso del día para vos: empuje vertical pesado, que es justo lo que la semana híbrida te venía sacando. El split jerk mete una zancada cargada, pero son 8 reps en total — no es un bloque de pierna.\\n\\nQuedate en el 70-75% en los dos primeros sets y subí solo si la recepción sale firme.\", items:[\n          car(\"c-s-j1\",\"Set 1\",\"complejo · 70%\",\"jerk\",.70,4),\n          car(\"c-s-j2\",\"Set 2\",\"complejo · 73%\",\"jerk\",.73,4),\n          car(\"c-s-j3\",\"Set 3\",\"complejo · 77%\",\"jerk\",.77,4),\n          car(\"c-s-j4\",\"Set 4\",\"complejo · 80%\",\"jerk\",.80,4)]},\n        {nombre:\"Leaderboard · parte 1\", dur:\"10:00\", pres:\"3 rounds · IGUAL\",\n          nota:\"14 pull ups + 7 power snatch 50 kg.\\n\\nIgual. Si en la segunda ronda las pull ups se te parten en series de menos de 5, bajá a 10 por ronda: te guardás el hombro para la parte 2, que es la que tiene los muscle ups.\", items:[\n          rep(\"c-s-l1\",\"Ronda 1 · Pull ups\",\"14 reps\",14),\n          rep(\"c-s-l2\",\"Ronda 2 · Pull ups\",\"14 reps\",14),\n          rep(\"c-s-l3\",\"Ronda 3 · Pull ups\",\"14 reps\",14),\n          lib(\"c-s-l4\",\"Power snatch · carga\",\"7 reps por ronda\",50,7),\n          tim(\"c-s-l5\",\"Tiempo parte 1\",\"3 rondas\",480)]},\n        {nombre:\"Double unders\", dur:\"03:00\", pres:\"60 reps · RECORTADO\",\n          nota:\"PLANI: 100 double unders.\\nAHORA: 60.\\nPOR QUÉ: es el único bloque de impacto puro de la semana y cae 24 horas después del back squat del viernes. Faltan seis semanas para el 10K y el gemelo y el aquiles son lo que menos tolera saltos acumulados sin haber vuelto a correr en volumen.\\n\\nNo es fatiga: es la única concesión del día. Los otros 40 saltos no te dan nada que no te dé el resto de la sesión.\", items:[\n          rep(\"c-s-d1\",\"Double unders\",\"60 en lugar de 100\",60),\n          tim(\"c-s-d2\",\"Tiempo\",\"\",120)]},\n        {nombre:\"Leaderboard · parte 2\", dur:\"10:00\", pres:\"3 rounds · IGUAL\",\n          nota:\"5/4 bar muscle ups (o 10 pull ups) + 4 squat snatch 50 kg.\\n\\nIgual. Los 12 squat snatch son el único trabajo de sentadilla del día y son técnicos, no cargados: no chocan con el viernes.\\n\\nSi la parte 1 te dejó el dorsal cansado, tomá la opción de 10 pull ups sin culpa — el estímulo del día ya está cubierto.\", items:[\n          rep(\"c-s-l6\",\"Ronda 1 · BMU o pull ups\",\"5 BMU · o 10 pull ups\",5),\n          rep(\"c-s-l7\",\"Ronda 2 · BMU o pull ups\",\"5 BMU · o 10 pull ups\",4),\n          rep(\"c-s-l8\",\"Ronda 3 · BMU o pull ups\",\"5 BMU · o 10 pull ups\",4),\n          lib(\"c-s-l9\",\"Squat snatch · carga\",\"4 reps por ronda\",50,4),\n          tim(\"c-s-l10\",\"Tiempo parte 2\",\"3 rondas\",480)]},\n        {nombre:\"Registro\", pres:\"Al terminar\",\n          nota:\"Dos datos que necesito para armar la semana que viene: cómo quedó el hombro con 57 reps de tracción en un día, y cómo quedaron las piernas con squat el viernes y jerk el sábado.\\n\\nEl de gemelo y aquiles es el que decide la corrida de la tarde: si pasa de 4, el rodaje baja a 20'.\", items:[\n          rep(\"c-s-z1\",\"Hombro al terminar\",\"0 = bien · 10 = fundido\",4),\n          rep(\"c-s-z2\",\"Piernas al terminar\",\"0 = frescas · 10 = fundidas\",3),\n          rep(\"c-s-z3\",\"Gemelo y aquiles\",\"post double unders · decide la tarde\",1)]},\n   }\n  turn2(){\n    const st = this.state;\n    const plan = this.plan();\n    const dia = plan[st.dia2];\n    const diasSem = plan.map((d,i)=>({\n      dia:d.dia, num:d.num, titulo:d.titulo, sub:d.sub,\n      cls: st.dia2===i ? \"on\" : \"\", pick: ()=>this.setState({dia2:i, abierto:null}),\n      chipCls: st.dia2===i ? \"chip on\" : \"chip\"\n    }));\n    let total = 0, hechos = 0;\n    const secciones = dia.secciones.map((sec,si)=>({\n      nombre: sec.nombre, dur: sec.dur || \"\", pres: sec.pres || \"\", nota: sec.nota || \"\",\n      tieneNota: !!sec.nota,\n\n      items: sec.items.map(it=>{\n        total++;\n        const done = !!st.done2[it.id];\n        if (done) hechos++;\n        const abierto = st.abierto === it.id;\n        const r = st.reg[it.id] || {};\n        const ult = this.ultimaVez(sec, it, st.semana);\n        return {\n          id: it.id, titulo: it.t, detalle: it.d, ultima: ult, tieneUltima: !!ult,\n          valor: done ? (this.resumen(it) || \"✓\") : this.sugerido(it),\n          color: done ? \"#201e1d\" : \"rgba(32,30,29,.35)\",\n          chkClass: done ? \"on\" : \"\", abierto,\n          esCheck: it.tipo === \"chk\", editable: it.tipo !== \"chk\",\n          campos: abierto ? this.campos(it) : [],\n          tienePaso: it.tipo === \"car\",\n          nota: r.nota || \"\",\n          notaPrev: r.nota || \"\", tieneNota: !!(r.nota && r.nota.trim()),\n          notaPlaceholder: it.tipo === \"chk\" ? \"Cómo salió, qué cambiarías…\" : \"Ej: cómodo en las dos primeras series, así que en la 3ª le puse 110 y en la 4ª 115, y seguí cómodo.\",\n          setNota: (e)=>{ const v = e.target.value; this.setState(st2=>({reg:{...st2.reg,[it.id]:{...(st2.reg[it.id]||{}), nota:v}}})); },\n          guardarLabel: it.tipo === \"chk\" ? \"Guardar nota\" : \"Guardar serie\",\n          sensaciones: [\"Fácil\",\"Justo\",\"Duro\",\"Al límite\"].map(l=>({\n            label:l, cls: r.sens===l ? \"chip on\" : \"chip\",\n            pick: ()=>this.setState(s
